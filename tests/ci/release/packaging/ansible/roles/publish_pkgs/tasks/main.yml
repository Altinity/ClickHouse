- name: Log the configuration being used
  debug:
    msg:
      - 'Repo DNS Name:  {{ repo_dns_name }}'
      - 'Repo Title:     {{ repo_title }}'
      - 'Repo Subtitle:  {{ repo_subtitle }}'
      - 'Repo Name:      {{ repo_name }}'
      - 'Origin Path:    {{ new_cloudfront_origin_path|default("None") }}'
      - 'Push to Active: {{ push_to_active|default(false) }}'

- name: Create directory index files
  shell: "{{ ansible_playbook_python }} {{ (playbook_dir + '/../dirindex/dirindexgen.py') | realpath }} {{ repo_dns_name }} {{ new_cloudfront_origin_path }}"

- name: Get static content source path
  set_fact:
    static_path: "{{ (playbook_dir + '/../static') | realpath }}"

- name: Get list of static content files
  find:
    paths: "{{ static_path }}"
    file_type: file
    recurse: true
    follow: true
  register: static_files

- name: Generate target filenames for source filenames
  set_fact:
    target_filenames: >-
      {{
        target_filenames | default({}) |
        combine(
          {
            item.path:
              item.path | regex_replace('^' + (static_path | regex_escape) + '/(.*)$', '\1')
          }
        )
      }}
  loop: "{{ static_files.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: Set known static file extension -> Content-Type map
  set_fact:
    static_mime_types:
      .js: application/javascript
      .css: text/css
      .png: image/png
      .jpg: image/jpeg
      .jpeg: image/jpeg
      .gif: image/gif
      .svg: image/svg+xml
      .txt: text/plain

- name: Template HTML files to S3
  amazon.aws.s3_object:
    bucket: "{{ repo_dns_name }}"
    object: "{{ new_cloudfront_origin_path }}/{{ target_filenames[item.path] }}"
    content: "{{ lookup('template', item.path) }}"
    metadata: "Content-Type=text/html"
    mode: put
  when: 'item.path | basename | splitext | last == ".html"'
  loop: "{{ static_files.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: Copy other static files to S3
  amazon.aws.s3_object:
    bucket: "{{ repo_dns_name }}"
    object: "{{ new_cloudfront_origin_path }}/{{ target_filenames[item.path] }}"
    src: "{{ item.path }}"
    metadata: "Content-Type={{ static_mime_types[item.path | splitext | last] | default('application/octet-stream') }}"
    mode: put
  when:
    - 'item.path | basename | splitext | last != ".html"'
    - 'item.path | basename != "installer.sh"'
  loop: "{{ static_files.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: Upload installer.sh with an explicit text/plain Content-Type
  amazon.aws.s3_object:
    bucket: "{{ repo_dns_name }}"
    object: "{{ new_cloudfront_origin_path }}/installer.sh"
    src: "{{ static_path }}/installer.sh"
    metadata: "Content-Type=text/plain"
    mode: put

- name: Update CloudFront distribution
  community.aws.cloudfront_distribution:
    region: "{{ aws_region }}"
    state: present
    caller_reference: "{{ cloudfront_info.cloudfront[repo_dns_name].Distribution.DistributionConfig.CallerReference }}"
    origins:
      - id: "{{ cloudfront_info.cloudfront[repo_dns_name].Distribution.DistributionConfig.Origins.Items[0].Id }}"
        domain_name: "{{ cloudfront_info.cloudfront[repo_dns_name].Distribution.DistributionConfig.Origins.Items[0].DomainName }}"
        origin_path: "/{{ new_cloudfront_origin_path | default(omit) }}"
        custom_origin_config:
          origin_protocol_policy: "http-only"
    aliases:
      - "{{ cloudfront_info.cloudfront[repo_dns_name].Distribution.DistributionConfig.Aliases.Items[0] }}"
    viewer_certificate:
      acm_certificate_arn: "{{ cloudfront_info.cloudfront[repo_dns_name].Distribution.DistributionConfig.ViewerCertificate.ACMCertificateArn }}"
      ssl_support_method: "{{ cloudfront_info.cloudfront[repo_dns_name].Distribution.DistributionConfig.ViewerCertificate.SSLSupportMethod }}"
    logging:
      bucket: "{{ cloudfront_info.cloudfront[repo_dns_name].Distribution.DistributionConfig.Logging.Bucket }}"
      enabled: "{{ cloudfront_info.cloudfront[repo_dns_name].Distribution.DistributionConfig.Logging.Enabled }}"
      include_cookies: "{{ cloudfront_info.cloudfront[repo_dns_name].Distribution.DistributionConfig.Logging.IncludeCookies }}"
      prefix: "{{ cloudfront_info.cloudfront[repo_dns_name].Distribution.DistributionConfig.Logging.Prefix }}"
  when: 'not (push_to_active|default(false)|bool)'
  register: distribution

- name: Set CloudFront Function name
  set_fact:
    cf_function_name: "{{ repo_name }}-root-router"

- name: Get CloudFront Function source path
  set_fact:
    cf_function_js_path: "{{ role_path }}/files/installer-router.js"

- name: Check if the root-router function already exists
  command: "aws cloudfront describe-function --name {{ cf_function_name }} --stage DEVELOPMENT"
  register: cf_function_describe
  failed_when: false
  changed_when: false

- name: Create the root-router function (first run only)
  command: >
    aws cloudfront create-function
    --name {{ cf_function_name }}
    --function-config Comment="Serve installer.sh to non-browser clients hitting /",Runtime=cloudfront-js-2.0
    --function-code fileb://{{ cf_function_js_path }}
  when: cf_function_describe.rc != 0

- name: Get current function code (to detect drift on later runs)
  command: "aws cloudfront get-function --name {{ cf_function_name }} --stage DEVELOPMENT /tmp/{{ cf_function_name }}-current-code.js"
  when: cf_function_describe.rc == 0
  changed_when: false

- name: Update the function if its code has drifted
  command: >
    aws cloudfront update-function
    --name {{ cf_function_name }}
    --if-match {{ (cf_function_describe.stdout | from_json).ETag }}
    --function-config Comment="Serve installer.sh to non-browser clients hitting /",Runtime=cloudfront-js-2.0
    --function-code fileb://{{ cf_function_js_path }}
  when:
    - cf_function_describe.rc == 0
    - lookup('file', '/tmp/' + cf_function_name + '-current-code.js') | trim != lookup('file', cf_function_js_path) | trim

- name: Re-check function state after create/update
  command: "aws cloudfront describe-function --name {{ cf_function_name }} --stage DEVELOPMENT"
  register: cf_function_current
  changed_when: false

- name: Test the function against synthetic events before publishing
  command: >
    aws cloudfront test-function
    --name {{ cf_function_name }}
    --if-match {{ (cf_function_current.stdout | from_json).ETag }}
    --stage DEVELOPMENT
    --event-object fileb://{{ role_path }}/files/test-events/{{ item }}.json
  register: cf_function_test
  changed_when: false
  loop:
    - curl
    - no-accept
    - browser
  loop_control:
    label: "{{ item }}"

- name: Verify the function rewrote the URI correctly for each test event
  vars:
    output: "{{ (item.stdout | from_json).TestResult.FunctionOutput | from_json }}"
    should_rewrite: "{{ item.item in ['curl', 'no-accept'] }}"
    expected_uri: "{{ '/installer.sh' if should_rewrite else '/' }}"
  assert:
    that: output.request.uri == expected_uri
    fail_msg: "root-router function returned uri={{ output.request.uri }} for the '{{ item.item }}' test event, expected {{ expected_uri }} - refusing to publish a function that doesn't route correctly"
    success_msg: "{{ item.item }} -> {{ output.request.uri }} (as expected)"
  loop: "{{ cf_function_test.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Publish the function to LIVE
  command: >
    aws cloudfront publish-function --name {{ cf_function_name }}
    --if-match {{ (cf_function_current.stdout | from_json).ETag }}

- name: Get the LIVE function ARN
  command: >
    aws cloudfront describe-function --name {{ cf_function_name }} --stage LIVE
    --query FunctionSummary.FunctionMetadata.FunctionARN --output text
  register: cf_function_arn_result
  changed_when: false

- name: Associate the root-router function with the distribution's default cache behavior
  shell: >
    set -euo pipefail;
    aws cloudfront get-distribution-config --id {{ cloudfront_info.cloudfront[repo_dns_name].Distribution.Id }} > /tmp/{{ cf_function_name }}-dist-config.json &&
    DIST_ETAG=$(jq -r '.ETag' /tmp/{{ cf_function_name }}-dist-config.json) &&
    jq --arg arn "{{ cf_function_arn_result.stdout }}" '(.DistributionConfig.DefaultCacheBehavior.FunctionAssociations.Items // [] | map(select(.EventType != "viewer-request")) | . + [{FunctionARN: $arn, EventType: "viewer-request"}]) as $merged | .DistributionConfig.DefaultCacheBehavior.FunctionAssociations = {Quantity: ($merged | length), Items: $merged} | .DistributionConfig' /tmp/{{ cf_function_name }}-dist-config.json > /tmp/{{ cf_function_name }}-new-dist-config.json &&
    aws cloudfront update-distribution --id {{ cloudfront_info.cloudfront[repo_dns_name].Distribution.Id }} --distribution-config file:///tmp/{{ cf_function_name }}-new-dist-config.json --if-match "$DIST_ETAG"
  args:
    executable: /bin/bash

- name: Invalidate CloudFront cache
  community.aws.cloudfront_invalidation:
    alias: "{{ repo_dns_name }}"
    target_paths:
      - "/*"
  register: invalidation

- name: Wait for CloudFront invalidation to be complete
  shell: "aws cloudfront wait invalidation-completed --distribution-id {{ cloudfront_info.cloudfront[repo_dns_name].Distribution.Id }} --id {{ invalidation.invalidation.id }}"
