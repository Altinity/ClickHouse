syntax = "proto3";
package DB.Cas.Proto;

// Binary codec for the CA RootShard manifest (B164a). Replaces the JSON encoding on the hot CA
// write path. The manifest is CAS-by-token (not content-addressed), so byte-determinism is not a
// correctness requirement; the encoder still serializes deterministically for stable golden tests.
// Introspect a raw manifest offline with:
//   protoc --decode DB.Cas.Proto.RootShardManifest cas_root_shard.proto < manifest.bin
//
// VERSION + FAIL-CLOSED GATING: version and fail-closed reader gating now live in the CasFormat
// framing header ([magic CARS][writer:u16][min_reader:u16]) prepended to every serialized manifest;
// see `CasFormat.h`. The in-message codec_version field (field 1) has been removed (reserved 1).
//
// SCHEMA EVOLUTION RULES (read before editing):
//  * The wire format is keyed by field NUMBER, not name. Two ways to evolve:
//    1. ADDITIVE + safe-to-ignore (e.g. a new optional sidecar): give it a NEW field number — old
//       readers skip the unknown field; new readers reading old data get the default. Old and new
//       binaries interoperate automatically.
//    2. BREAKING / unsafe-to-ignore (reinterpreting an existing field, a new mandatory invariant, a
//       change where an old reader silently ignoring the new data would be WRONG): bump the
//       CasFormat framing header's min_reader_version (via a new FormatChangePoint in CasFormat.cpp)
//       so old binaries refuse rather than mis-read.
//  * NEVER reuse or change the TYPE of an existing field number. To drop a field, `reserved <n>;` its
//    number (and `reserved "<name>";`) so it is never reused.

// Serialized form of a single DB.Cas.TreeEntry for closure storage.
// Only the fields needed by the GC walk are serialized; name/inline_bytes are
// intentionally omitted (decode leaves them at defaults).
message TreeEntryProto {
  uint32 placement = 1;   // DB.Cas.Placement enum value (Inline=1, Blob=2, Subtree=3)
  bytes  file_hash = 2;   // raw 16 bytes (UInt128, big-endian); blob/subtree hash
  uint64 file_size = 3;
}

// One tree node in a precommit's inline closure: the node's tree hash and its staged entries.
// An ADDITIVE field (field 5 of JournalRecord); old readers skip it.
message ClosureNodeProto {
  bytes tree_hash = 1;                    // raw 16 bytes (UInt128, big-endian)
  repeated TreeEntryProto entries = 2;
}

message RefPayload {
  bytes tree_id = 1;                      // raw 16 bytes (UInt128, big-endian)
  uint64 tree_size = 2;
  map<string, string> mutable_files = 3;
  reserved 4;                             // was `closure` (B199-S2); moved to JournalRecord.closure
  uint64 published_at_ms = 5;             // publish wall-clock (epoch ms) for getLastModified; replaces the .ca_mtime mutable_files key
}

enum JournalOp {
  JOURNAL_OP_UNSPECIFIED = 0;         // decode fails closed on 0
  JOURNAL_OP_ADD = 1;
  JOURNAL_OP_REMOVE = 2;
}

message JournalRecord {
  JournalOp op = 1;
  string ref_name = 2;
  bytes tree_id = 3;                  // raw 16 bytes
  uint64 at_version = 4;
  repeated ClosureNodeProto closure = 5;  // NEW (B199-S2); populated only on precommit-ns Add records
}

message RootShardManifest {
  reserved 1;                         // was codec_version; version is now in the CasFormat framing header
  reserved "codec_version";           // 3a nit: reserve the name too so it is never reused
  uint64 shard_version = 2;
  uint64 fence_round = 3;
  map<string, RefPayload> refs = 4;
  repeated JournalRecord journal = 5; // insertion order preserved
}

// Pool-wide identity and constants (_pool_meta). Magic CAPM, FormatId::PoolMeta.
// Framing header ([CAPM][writer:u16][min_reader:u16]) is prepended; the proto body follows.
message PoolMetaProto {
  bytes  pool_id         = 1;  // raw 16 bytes (UInt128, big-endian); minted once at creation
  uint64 root_shards     = 2;  // must be >= 1
  uint64 blob_header_len = 3;  // 8-aligned, in [96, 16384]
}

// Per-server build watermark (_watermark under roots/<server-hex>/). Magic CAWM, FormatId::Watermark.
// min_active == UINT64_MAX encodes the "retired" sentinel (farewell epoch).
message WatermarkProto {
  bytes  server_id  = 1;  // raw 16 bytes (UInt128, big-endian)
  uint64 epoch      = 2;
  uint64 min_active = 3;  // UINT64_MAX (0xFFFFFFFFFFFFFFFF) = retired sentinel
  uint64 seq        = 4;
}

// GC lease embedded inside GcStateProto.
message GcLeaseProto {
  bytes  owner = 1;  // raw 16 bytes (UInt128, big-endian); 0 = never held
  uint64 seq   = 2;
}

// One shard entry of fence_version inner map: "ns/shard" -> uint64 version.
// Spec bans new proto map<> for byte-determinism; we use sorted repeated instead
// (a proto map<string,uint64> and repeated{key=1,value=2} share the same wire shape).
message FenceVersionShardProto {
  string shard_name = 1;
  uint64 version    = 2;
}

// Inner map of fence_version: list of shard entries, sorted by shard_name ascending.
message FenceVersionInnerProto {
  repeated FenceVersionShardProto shards = 1;
}

// One outer entry of fence_version: round -> inner shard map.
message FenceVersionEntryProto {
  uint64 round                 = 1;
  FenceVersionInnerProto inner = 2;
}

// GC controller state (gc/state). Magic CAGT, FormatId::GcState.
// fence_version is a list of (round, inner) entries, sorted by round ascending,
// and within each, shards sorted by shard_name ascending — for byte-determinism.
message GcStateProto {
  uint64 round              = 1;
  uint64 fence_seq          = 2;
  uint64 snap_shards        = 3;  // must be >= 1
  uint64 snap_generation    = 4;
  uint64 snap_pruned_through = 5;
  GcLeaseProto lease        = 6;
  repeated FenceVersionEntryProto fence_version = 7;
}

// Build heartbeat (builds/<build_id>). Magic CAHB, FormatId::Heartbeat.
// server_id: raw 16 bytes (UInt128, big-endian).
message HeartbeatProto {
  bytes  server_id      = 1;  // raw 16 bytes (UInt128, big-endian)
  uint64 heartbeat_seq  = 2;  // strictly monotone within one build
  uint64 created_at_ms  = 3;  // DIAGNOSTIC ONLY — no protocol decision reads writer clocks
}

// Namespace registry (gc/registry). Magic CARR, FormatId::RootsRegistry.
// namespaces: sorted repeated string (deterministic; no proto map<>).
message RootsRegistryProto {
  uint64 registry_version = 1;  // monotone, CAS-carried
  uint64 fence_round      = 2;  // written only by GC; monotone
  repeated string namespaces = 3;  // sorted ascending for byte-determinism
}

// One entry inside a GcOutcomeLogProto.
// kind: 1=blob, 2=tree (mirrors ObjectKind enum).
// token_type: 1=etag, 2=generation, 3=emulated (mirrors TokenType enum).
// outcome: 1=deleted, 2=absent, 3=replaced, 4=spared (mirrors OutcomeKind enum).
message GcOutcomeEntryProto {
  uint32 kind        = 1;
  bytes  hash        = 2;  // raw 16 bytes (UInt128, big-endian)
  string token_value = 3;
  uint32 token_type  = 4;
  uint32 outcome     = 5;
}

// Retire outcome log (gc/outcomes/<round>.<fence_seq>/<snap_shard>). Magic CAGO, FormatId::GcOutcomes.
// Entries are in insertion order (the original JSON encoder kept insertion order).
message GcOutcomeLogProto {
  repeated GcOutcomeEntryProto entries = 1;
}

// One condemned object inside a RetiredSetProto.
// kind: 1=blob, 2=tree (mirrors ObjectKind enum).
// token_type: 1=etag, 2=generation, 3=emulated (mirrors TokenType enum).
message RetiredEntryProto {
  uint32 kind        = 1;
  bytes  hash        = 2;  // raw 16 bytes (UInt128, big-endian)
  string token_value = 3;
  uint32 token_type  = 4;
  uint64 size        = 5;
}

// Retired-object set (gc/retired/<round>.<fence_seq>/<shard>). Magic CART, FormatId::RetiredSet.
// Entries are sorted deterministically (kind, hash-BE, token_value, token_type, size) before
// serialization so the encoded bytes are stable.
message RetiredSetProto {
  repeated RetiredEntryProto entries = 1;
}
