syntax = "proto3";
package clickhouse.cas.format;

// ===========================================================================================
// NORMATIVE protobuf schema for EVERY mutable content-addressed (CA) object. This single file is
// the portable contract: a third party reimplementing CA reads/writes (Python/Java/Go) compiles it
// to get all message types. (Hashed/immutable objects — the blob envelope and its hash rules —
// are NOT protobuf; they are normative in the design doc
// docs/superpowers/specs/2026-06-24-cas-schema-evolution-framework-design.md.)
//
// CONVERGED HEADER MODEL (2026-06-25): every mutable object carries a CasHeader as field 1.
// The object is PURE PROTOBUF — no binary prefix, decodable directly with protoc:
//   protoc --decode clickhouse.cas.format.PoolMetaProto cas_format.proto < pool_meta.bin
// Per-object magic (4 ASCII bytes as little-endian fixed32):
//   PoolMetaProto "CAPM" | GcStateProto "CAGT" | GcOutcomeLogProto "CAGO"
// (The generation-2 mutable ref manifest family "CARS" was removed in Task 12 with the snapshot+log ref
//  format — magic CARS freed, never reuse; refs now live as immutable _log/_snap objects.)
// (RetiredSetProto "CART" retired 2026-07-10 with the retired-in-snapshot refactor — magic CART freed,
//  never reuse; condemned state rides the source-edge runs + fold-seal condemned_summary)
// (RootsRegistryProto "CARR" deleted in Task 4 — discovery authority moved to LIST(cas/refs/))
// (gc-snap stays a versioned binary+zstd codec — GC-internal, not an interchange format; B176 defers
// its protobuf conversion.)
//
// SCHEMA EVOLUTION RULES (read before editing):
//  * Safe-additive (new optional sidecar, safe to ignore): give it a NEW field number — old readers
//    skip the unknown field; new readers reading old data get the default. Old and new binaries
//    interoperate automatically. Do NOT bump compatibility_version for additive changes.
//  * Unsafe / breaking (reinterpreting an existing field, a new mandatory invariant, a change where
//    an old reader silently ignoring the new data would be WRONG): write-down-to-floor:
//      1. Bump compatibility_version in the new object (via currentCompatibilityVersion() bump).
//      2. In the decoder, branch on compatibility_version: new arm handles the new schema; old arm
//         handles the old schema. Both arms MUST be correct.
//      3. Once all readers are on the new floor (i.e. the floor rises past the compatibility_version
//         of the old arm), prune the old arm and its dead code.
//  * NEVER reuse or change the TYPE of an existing field number. To drop a field, `reserved <n>;` its
//    number (and `reserved "<name>";`) so it is never reused.
//  * VERSION + FAIL-CLOSED GATING: reader checks magic (CORRUPTED_DATA on mismatch), then
//    compatibility_version > G_BUILD → UNKNOWN_FORMAT_VERSION (fail-closed on future objects).

// CasHeader is field 1 of every mutable object. magic is a per-type 4-ASCII-byte constant stored
// as a little-endian fixed32 (e.g. "CARS" → 0x53524143). writer_version and compatibility_version
// match the C++ constants in CasFormat.h (currentWriterVersion() / currentCompatibilityVersion()).
message CasHeader {
  fixed32 magic               = 1;  // per-type 4-ASCII-byte constant (see table above)
  uint32  writer_version      = 2;  // forensic: the build/generation that wrote this
  uint32  compatibility_version = 3; // functional: the floor targeted; reader dispatches + fail-closes
}

// Pool-wide identity and constants (_pool_meta). Magic CAPM, FormatId::PoolMeta.
// CasHeader is field 1; existing fields renumbered from 2 to free field 1.
message PoolMetaProto {
  CasHeader header              = 1;  // magic=CAPM; set by encoder, checked by decoder
  bytes  pool_id                = 2;  // raw 16 bytes (UInt128, big-endian); minted once at creation
  uint64 root_shards            = 3;  // must be >= 1
  uint64 blob_header_len        = 4;  // 8-aligned, in [96, 16384]
  uint64 min_reader_generation  = 5;  // startup gate: if G_BUILD < min_reader_generation => UNKNOWN_FORMAT_VERSION
  // CAS mixed-algo pools (Phase 3 T4, design 2026-07-11-cas-mixed-algo-pools-design.md §5): every
  // hash algo ever ADMITTED to this pool, sorted, append-only. 1=cityHash128 2=xxh3-128 3=sha256
  // (mirrors DB::Cas::BlobHashAlgo). REPLACES the Phase 1/2 single `blob_hash_algo` field (field
  // number 6 reused -- CAS is pre-release, no wire compat kept for the old singular value: a
  // pre-Phase-3 `_pool_meta` object is disposable derived state, per CLAUDE.md). Admitting a new
  // algo (opt-in via the disk's `blob_hash_allow_new`) CAS-unions it in; the default reopen with an
  // unlisted algo fails closed (BAD_ARGUMENTS).
  repeated uint32 algos_used = 6;
}

// (WatermarkProto "CAWM" retired with the ack-floor merge — the build-watermark floor rides the
// mount-lease beat (MountLeaseProto), there is no standalone watermark object anymore.)

// CA Phase 0 (mount safety): per-server-root control objects under gc/server-roots/<server_root_id>/.
// Each is a pure-protobuf mutable object carrying a CasHeader as field 1.

// Owner anchor (gc/server-roots/<srid>/owner). Magic CAOW, FormatId::Owner. Binds a configured
// server_root_id to the server UUID that owns the subtree; write-once, never reused.
message OwnerProto {
  CasHeader header     = 1;  // magic=CAOW; set by encoder, checked by decoder
  bytes     server_uuid = 2; // raw 16 bytes (UInt128, big-endian)
}

// Writer-epoch fence (gc/server-roots/<srid>/epoch). Magic CAEP, FormatId::ServerEpoch. The monotone
// next writer epoch to hand out; CAS-advanced on each mount.
message ServerEpochProto {
  CasHeader header           = 1;  // magic=CAEP; set by encoder, checked by decoder
  uint64    next_writer_epoch = 2;
}

// Mount lease (gc/server-roots/<srid>/mount). Magic CAML, FormatId::MountLease. The current live mount
// holder of the subtree: who, at which writer epoch, and until when.
message MountLeaseProto {
  CasHeader header        = 1;  // magic=CAML; set by encoder, checked by decoder
  bytes     server_uuid   = 2;  // raw 16 bytes (UInt128, big-endian)
  uint64    writer_epoch  = 3;
  string    hostname      = 4;
  uint64    pid           = 5;
  uint64    started_at_ms = 6;
  uint64    seq           = 7;
  uint64    expires_at_ms = 8;
  uint64    min_active     = 9;   // oldest in-flight build_seq; UINT64_MAX = retired (farewell)
  reserved 10;  // was observed_gc_round; the writer-side retired-view ack floor was removed (v3 Task 6)
  bool      gc_fenced      = 11;  // set ONLY by GC fence-out of an expired lease; terminal
}

// GC lease embedded inside GcStateProto.
message GcLeaseProto {
  bytes  owner = 1;  // raw 16 bytes (UInt128, big-endian); 0 = never held
  uint64 seq   = 2;
}

// (RetiredRefEntryProto retired with the retired-in-snapshot refactor 2026-07-10 — condemned state now
// rides the source-edge runs as kCondemned rows + the fold seal's condemned_summary; no separate
// retired-list object family.)

// GC controller state (gc/state). Magic CAGT, FormatId::GcState.
// CasHeader is field 1; existing fields renumbered from 2 to free field 1.
message GcStateProto {
  reserved 8;                         // fence_version (retired with the one-pass ack-floor round)
  reserved "fence_version";
  reserved 11;                        // retired_refs (retired-in-snapshot 2026-07-10); condemned state
  reserved "retired_refs";            //   rides the source-edge runs + fold-seal condemned_summary
  CasHeader header              = 1;  // magic=CAGT; set by encoder, checked by decoder
  uint64 round                  = 2;
  uint64 fence_seq              = 3;
  uint64 snap_shards            = 4;  // must be >= 1
  uint64 snap_generation        = 5;
  uint64 snap_pruned_through    = 6;
  GcLeaseProto lease            = 7;
  uint64 snap_attempt           = 9;  // adopted attempt id for the round that produced snap_generation
  string manifest_sweep_cursor  = 10; // best-effort cleanup cursor; never consulted by reachability
}

// One entry inside a GcOutcomeLogProto.
// kind: 1=blob (mirrors ObjectKind enum; Tree was excised in rev. 15).
// token_type: 1=etag, 2=generation, 3=emulated (mirrors TokenType enum).
// outcome: 1=deleted, 2=absent, 3=replaced, 4=spared (mirrors OutcomeKind enum).
message GcOutcomeEntryProto {
  uint32 kind        = 1;
  bytes  hash        = 2;  // raw 32 bytes (BlobDigest, big-endian, tail zero beyond the algo's width)
  string token_value = 3;
  uint32 token_type  = 4;
  uint32 outcome     = 5;
  uint32 hash_algo   = 6;  // Phase 3 T3 (mixed-algo pools): BlobHashAlgo of `hash` -- a bare digest is
                           // never a blob identity anymore, so every entry names its algo explicitly.
}

// Retire outcome log (gc/outcomes/<round>.<fence_seq>/<snap_shard>). Magic CAGO, FormatId::GcOutcomes.
// CasHeader is field 1; existing field renumbered from 1 to free field 1.
// Entries are in insertion order (the original JSON encoder kept insertion order).
message GcOutcomeLogProto {
  CasHeader header                         = 1;  // magic=CAGO; set by encoder, checked by decoder
  repeated GcOutcomeEntryProto entries     = 2;
}

// CA GC root-local part-manifest redesign (rev. 15) — the one-pass round's write-once fold seal.
// A reference to one write-once run object plus its content checksum (RunFooter checksum).
message RunRefProto {
  string key         = 1;
  uint64 checksum_hi = 2;  // high 64 bits of the UInt128 checksum
  uint64 checksum_lo = 3;  // low 64 bits
  // 2026-07-02 snapshot-streaming (T0). Additive: old readers skip these and get 0. Consumers resolve
  // blob_target runs through these refs (not by key construction) once reference-parent carry means a
  // run sealed for generation G may live under an older generation's key. Set for blob_target_runs;
  // part_manifest_cleanup / outcome refs leave them 0.
  uint64 shard       = 4;  // gc-shard this run belongs to
  uint64 generation  = 5;  // generation whose key namespace physically holds the object
}

// One (namespace, shard) coverage entry inside a FoldSealProto.
message FoldShardCoverageProto {
  string key                = 1;  // "ns/shard"
  uint32 classification     = 2;  // 0=Absent 1=Unchanged 2=Folded 3=Minted
  uint32 folded_token_type  = 3;  // TokenType enum
  string folded_token_value = 4;
  uint64 folded_cursor      = 5;
  uint64 incarnation_writer_epoch   = 6;  // ShardIncarnation.writer_epoch; 0 = unstamped
  uint64 incarnation_build_sequence = 7;  // ShardIncarnation.build_sequence; 0 = unstamped
  bool   has_live_precommit                 = 8;  // shard holds >=1 live (un-promoted, un-removed) precommit
  uint64 min_live_precommit_writer_epoch    = 9;  // lexicographically-min live precommit writer_epoch
  uint64 min_live_precommit_build_sequence  = 10; // lexicographically-min live precommit build_sequence
  // Snapshot+log ref model (spec §GC State): last_folded_ref_id = greatest RefTxnId whose owner changes
  // this table already folded. Replaces folded_cursor for ref intake; per table (shard fixed at 0).
  uint64 last_folded_ref_epoch    = 11;  // RefTxnId.writer_epoch; 0 = nothing folded
  uint64 last_folded_ref_sequence = 12;  // RefTxnId.ref_sequence; 0 = nothing folded
}

// One per-gc-shard condemned-in-snapshot summary inside a FoldSealProto (retired-in-snapshot T4).
// Sorted repeated (spec bans new proto map<> for byte-determinism); TOTAL over gc_shards.
message CondemnedSummaryProto {
  uint64 shard                          = 1;
  uint64 condemned_total                = 2;
  uint64 pending_total                  = 3;
  uint64 oldest_nonpending_condemn_round = 4;   // UINT64_MAX = none
}

// One namespace-cleanup item {ns, remove_txn_id} inside a FoldSealProto (spec §Clean Old Ref Objects).
// New Phase-1 protocol state: the durable Pending->Completed record for the physical reclamation of a
// removed namespace. Carried forward each fold generation until Completed.
message RefNsCleanupItemProto {
  string ns                  = 1;
  uint64 remove_txn_epoch    = 2;  // RefTxnId.writer_epoch of remove_txn_id
  uint64 remove_txn_sequence = 3;  // RefTxnId.ref_sequence of remove_txn_id
  uint32 state               = 4;  // 1=Pending 2=Completed
}

// FOLD seal (write-once gc/gen/<gen>/fold_seal). Magic CAFS, FormatId::FoldSeal.
message FoldSealProto {
  CasHeader header                            = 1;
  uint64 generation                           = 2;
  uint64 parent_generation                    = 3;
  repeated FoldShardCoverageProto per_ns_shard = 4;  // sorted by key
  repeated RunRefProto blob_target_runs       = 5;   // sorted by key
  repeated RunRefProto part_manifest_cleanup  = 6;   // sorted by key
  repeated CondemnedSummaryProto condemned_summary = 7;  // sorted by shard; TOTAL over gc_shards
  repeated RefNsCleanupItemProto ns_cleanup_items  = 8;  // sorted by (ns, remove_txn_id); §Step 6
}

// (CompletionSealProto / SealVersionEntryProto "CACS" retired with the one-pass ack-floor round —
// fence/recheck/delete/trim phases removed; the fold seal is now the sole per-generation coverage record.)

// (RetiredEntryProto / RetiredSetProto "CART" retired with the retired-in-snapshot refactor 2026-07-10.
// Condemned state now rides the source-edge runs as kCondemned rows + the fold seal's condemned_summary —
// there is no separate retired-object set family. Magic CART (0x54524143) is freed; never reuse it.)
