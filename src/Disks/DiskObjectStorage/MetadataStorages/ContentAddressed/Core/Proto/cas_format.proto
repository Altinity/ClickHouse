syntax = "proto3";
package clickhouse.cas.format;

// ===========================================================================================
// NORMATIVE protobuf schema for EVERY mutable content-addressed (CA) object. This single file is
// the portable contract: a third party reimplementing CA reads/writes (Python/Java/Go) compiles it
// to get all message types. (Hashed/immutable objects — the blob/tree envelope + the Merkle treeId
// rule — are NOT protobuf; they are normative in the design doc
// docs/superpowers/specs/2026-06-24-cas-schema-evolution-framework-design.md.)
//
// CONVERGED HEADER MODEL (2026-06-25): every mutable object carries a CasHeader as field 1.
// The object is PURE PROTOBUF — no binary prefix, decodable directly with protoc:
//   protoc --decode clickhouse.cas.format.RootShardManifest cas_format.proto < manifest.bin
// Per-object magic (4 ASCII bytes as little-endian fixed32):
//   RootShardManifest "CARS" | PoolMetaProto "CAPM" | WatermarkProto "CAWM" | GcStateProto "CAGT"
//   RetiredSetProto "CART" | GcOutcomeLogProto "CAGO"
// (RootsRegistryProto "CARR" deleted in Task 4 — discovery authority moved to LIST(cas/refs/))
// (gc-snap stays a versioned binary+zstd codec — GC-internal, not an interchange format; B176 defers
// its protobuf conversion.)
//
// SCHEMA EVOLUTION RULES (read before editing):
//  * Safe-additive (new optional sidecar, safe to ignore): give it a NEW field number — old readers
//    skip the unknown field; new readers reading old data get the default. Old and new binaries
//    interoperate automatically. Do NOT bump compatibility_version for additive changes.
//  * Unsafe / breaking (reinterpreting an existing field, a new mandatory invariant, a change where
//    an old reader silently ignoring the new data would be WRONG): write-down-to-floor:
//      1. Bump compatibility_version in the new object (via currentCompatibilityVersion() bump).
//      2. In the decoder, branch on compatibility_version: new arm handles the new schema; old arm
//         handles the old schema. Both arms MUST be correct.
//      3. Once all readers are on the new floor (i.e. the floor rises past the compatibility_version
//         of the old arm), prune the old arm and its dead code.
//  * NEVER reuse or change the TYPE of an existing field number. To drop a field, `reserved <n>;` its
//    number (and `reserved "<name>";`) so it is never reused.
//  * VERSION + FAIL-CLOSED GATING: reader checks magic (CORRUPTED_DATA on mismatch), then
//    compatibility_version > G_BUILD → UNKNOWN_FORMAT_VERSION (fail-closed on future objects).

// CasHeader is field 1 of every mutable object. magic is a per-type 4-ASCII-byte constant stored
// as a little-endian fixed32 (e.g. "CARS" → 0x53524143). writer_version and compatibility_version
// match the C++ constants in CasFormat.h (currentWriterVersion() / currentCompatibilityVersion()).
message CasHeader {
  fixed32 magic               = 1;  // per-type 4-ASCII-byte constant (see table above)
  uint32  writer_version      = 2;  // forensic: the build/generation that wrote this
  uint32  compatibility_version = 3; // functional: the floor targeted; reader dispatches + fail-closes
}

// CA GC root-local part-manifest redesign (rev. 15). The compact reference a root journal stores for a
// part manifest. NOT a string key: CasLayout::manifestKey derives the object key from this ref plus the
// owning root namespace. root_namespace_id is NOT a field here (it comes from the owning context).
message ManifestRefProto {
  uint64 writer_epoch          = 1;  // durable monotone writer epoch under the mounted server root
  uint64 build_sequence        = 2;  // monotone build sequence inside one writer epoch
  uint32 manifest_ordinal      = 3;  // monotone ordinal inside one build, rendered as 000001.proto
}

enum OwnerKindProto {
  OWNER_KIND_UNSPECIFIED = 0;        // decode fails closed on 0
  OWNER_KIND_COMMITTED   = 1;
  OWNER_KIND_PRECOMMIT   = 2;
}

// One owner binding: which kind of owner names which manifest.
// Committed: ref_name set, build_id = 0. Precommit: ref_name = final_ref_name, build_id set.
message OwnerBindingProto {
  OwnerKindProto   owner_kind  = 1;
  string           ref_name    = 2;
  bytes            build_id    = 3;  // raw 16 bytes (UInt128, big-endian); 0 for Committed
  ManifestRefProto manifest_ref = 4;
}

// One ordered owner-change event in the single root journal stream. old_binding/new_binding are
// proto3 explicit-presence (optional) so absence is distinguishable from a zero binding.
// is_tombstone: set by dropNamespace as the LAST journal event; both bindings are absent. The fold
// treats it as a no-op (no blob delta), and GC reclaims the shard object once it is fully folded.
message RootOwnerEventProto {
  uint64                     transition_version = 1;
  optional OwnerBindingProto old_binding        = 2;
  optional OwnerBindingProto new_binding        = 3;
  bool                       is_tombstone       = 4;  // Task 6: drop-namespace tombstone marker
}

// The current committed ref payload in the root journal: the committed ManifestRef plus the mutable
// per-ref files. root_namespace_id is NOT stored here — it comes from the owning root context.
message RootRefProto {
  string              ref_name        = 1;
  ManifestRefProto    manifest_ref    = 2;
  map<string, string> mutable_files   = 3;
  uint64              published_at_ms = 4;  // publish wall-clock (epoch ms); 0 = unset
}

// Root shard manifest (the per-namespace versioned ref store). Magic CARS, FormatId::Manifest.
// rev. 15: refs carry a ManifestRef; the journal is ONE ordered RootOwnerEvent stream
// (transition_version order). The old RefPayload/JournalRecord/ClosureNode model is removed.
// (Pre-release: field renumbering is safe — no on-disk data exists under the old numbering.)
message RootShardManifest {
  CasHeader header      = 1;          // magic=CARS; set by encoder, checked by decoder
  reserved "codec_version";           // old name; reserved so it is never reused
  uint64 shard_version  = 2;
  uint64 fence_round    = 3;
  map<string, RootRefProto> refs = 4;
  repeated RootOwnerEventProto journal = 5; // insertion order == transition_version order
  uint64 incarnation_writer_epoch    = 6;   // ShardIncarnation.writer_epoch; 0 = unstamped
  uint64 incarnation_build_sequence  = 7;   // ShardIncarnation.build_sequence; 0 = unstamped
}

// Pool-wide identity and constants (_pool_meta). Magic CAPM, FormatId::PoolMeta.
// CasHeader is field 1; existing fields renumbered from 2 to free field 1.
message PoolMetaProto {
  CasHeader header              = 1;  // magic=CAPM; set by encoder, checked by decoder
  bytes  pool_id                = 2;  // raw 16 bytes (UInt128, big-endian); minted once at creation
  uint64 root_shards            = 3;  // must be >= 1
  uint64 blob_header_len        = 4;  // 8-aligned, in [96, 16384]
  uint64 min_reader_generation  = 5;  // startup gate: if G_BUILD < min_reader_generation => UNKNOWN_FORMAT_VERSION
}

// Per-server build watermark (_watermark under roots/<server-hex>/). Magic CAWM, FormatId::Watermark.
// CasHeader is field 1; existing fields renumbered from 2 to free field 1.
// min_active == UINT64_MAX encodes the "retired" sentinel (farewell epoch).
message WatermarkProto {
  CasHeader header  = 1;          // magic=CAWM; set by encoder, checked by decoder
  bytes  server_id  = 2;          // raw 16 bytes (UInt128, big-endian)
  uint64 epoch      = 3;
  uint64 min_active = 4;          // UINT64_MAX (0xFFFFFFFFFFFFFFFF) = retired sentinel
  uint64 seq        = 5;
}

// CA Phase 0 (mount safety): per-server-root control objects under gc/server-roots/<server_root_id>/.
// Each is a pure-protobuf mutable object carrying a CasHeader as field 1.

// Owner anchor (gc/server-roots/<srid>/owner). Magic CAOW, FormatId::Owner. Binds a configured
// server_root_id to the server UUID that owns the subtree; write-once, never reused.
message OwnerProto {
  CasHeader header     = 1;  // magic=CAOW; set by encoder, checked by decoder
  bytes     server_uuid = 2; // raw 16 bytes (UInt128, big-endian)
}

// Writer-epoch fence (gc/server-roots/<srid>/epoch). Magic CAEP, FormatId::ServerEpoch. The monotone
// next writer epoch to hand out; CAS-advanced on each mount.
message ServerEpochProto {
  CasHeader header           = 1;  // magic=CAEP; set by encoder, checked by decoder
  uint64    next_writer_epoch = 2;
}

// Mount lease (gc/server-roots/<srid>/mount). Magic CAML, FormatId::MountLease. The current live mount
// holder of the subtree: who, at which writer epoch, and until when.
message MountLeaseProto {
  CasHeader header        = 1;  // magic=CAML; set by encoder, checked by decoder
  bytes     server_uuid   = 2;  // raw 16 bytes (UInt128, big-endian)
  uint64    writer_epoch  = 3;
  string    hostname      = 4;
  uint64    pid           = 5;
  uint64    started_at_ms = 6;
  uint64    seq           = 7;
  uint64    expires_at_ms = 8;
  uint64    min_active     = 9;   // oldest in-flight build_seq; UINT64_MAX = retired (farewell)
  uint64    observed_gc_round = 10;  // newest gc round whose retired list this server has loaded
  bool      gc_fenced      = 11;  // set ONLY by GC fence-out of an expired lease; terminal
}

// GC lease embedded inside GcStateProto.
message GcLeaseProto {
  bytes  owner = 1;  // raw 16 bytes (UInt128, big-endian); 0 = never held
  uint64 seq   = 2;
}

// One shard entry of fence_version inner map: "ns/shard" -> uint64 version.
// Spec bans new proto map<> for byte-determinism; we use sorted repeated instead
// (a proto map<string,uint64> and repeated{key=1,value=2} share the same wire shape).
message FenceVersionShardProto {
  string shard_name = 1;
  uint64 version    = 2;
}

// Inner map of fence_version: list of shard entries, sorted by shard_name ascending.
message FenceVersionInnerProto {
  repeated FenceVersionShardProto shards = 1;
}

// One outer entry of fence_version: round -> inner shard map.
message FenceVersionEntryProto {
  uint64 round                 = 1;
  FenceVersionInnerProto inner = 2;
}

// One (gc-shard -> retired-list object key) entry of retired_refs (ack-floor redesign). Spec bans new
// proto map<> for byte-determinism; we use sorted repeated instead (sorted by shard ascending).
message RetiredRefEntryProto {
  uint64 shard = 1;
  string key   = 2;
}

// GC controller state (gc/state). Magic CAGT, FormatId::GcState.
// CasHeader is field 1; existing fields renumbered from 2 to free field 1.
// fence_version is a list of (round, inner) entries, sorted by round ascending,
// and within each, shards sorted by shard_name ascending — for byte-determinism.
message GcStateProto {
  CasHeader header              = 1;  // magic=CAGT; set by encoder, checked by decoder
  uint64 round                  = 2;
  uint64 fence_seq              = 3;
  uint64 snap_shards            = 4;  // must be >= 1
  uint64 snap_generation        = 5;
  uint64 snap_pruned_through    = 6;
  GcLeaseProto lease            = 7;
  repeated FenceVersionEntryProto fence_version = 8;
  uint64 snap_attempt           = 9;  // adopted attempt id for the round that produced snap_generation
  string manifest_sweep_cursor  = 10; // best-effort cleanup cursor; never consulted by reachability
  // ack-floor redesign: gc-shard -> object key of the current retired list. Additive (same regime as
  // snap_attempt): old readers skip it, but a build that understands the ack-floor protocol reads the
  // retired list from HERE (not a LIST). Sorted by shard ascending for byte-determinism.
  repeated RetiredRefEntryProto retired_refs = 11;
}

// One entry inside a GcOutcomeLogProto.
// kind: 1=blob, 2=tree (mirrors ObjectKind enum).
// token_type: 1=etag, 2=generation, 3=emulated (mirrors TokenType enum).
// outcome: 1=deleted, 2=absent, 3=replaced, 4=spared (mirrors OutcomeKind enum).
message GcOutcomeEntryProto {
  uint32 kind        = 1;
  bytes  hash        = 2;  // raw 16 bytes (UInt128, big-endian)
  string token_value = 3;
  uint32 token_type  = 4;
  uint32 outcome     = 5;
}

// Retire outcome log (gc/outcomes/<round>.<fence_seq>/<snap_shard>). Magic CAGO, FormatId::GcOutcomes.
// CasHeader is field 1; existing field renumbered from 1 to free field 1.
// Entries are in insertion order (the original JSON encoder kept insertion order).
message GcOutcomeLogProto {
  CasHeader header                         = 1;  // magic=CAGO; set by encoder, checked by decoder
  repeated GcOutcomeEntryProto entries     = 2;
}

// CA GC root-local part-manifest redesign (rev. 15) — two write-once generation seals.
// A reference to one write-once run object plus its content checksum (RunFooter checksum).
message RunRefProto {
  string key         = 1;
  uint64 checksum_hi = 2;  // high 64 bits of the UInt128 checksum
  uint64 checksum_lo = 3;  // low 64 bits
}

// One (namespace, shard) coverage entry inside a FoldSealProto.
message FoldShardCoverageProto {
  string key                = 1;  // "ns/shard"
  uint32 classification     = 2;  // 0=Absent 1=Unchanged 2=Folded 3=Minted
  uint32 folded_token_type  = 3;  // TokenType enum
  string folded_token_value = 4;
  uint64 folded_cursor      = 5;
  uint64 incarnation_writer_epoch   = 6;  // ShardIncarnation.writer_epoch; 0 = unstamped
  uint64 incarnation_build_sequence = 7;  // ShardIncarnation.build_sequence; 0 = unstamped
}

// FOLD seal (write-once gc/gen/<gen>/fold_seal). Magic CAFS, FormatId::FoldSeal.
message FoldSealProto {
  CasHeader header                            = 1;
  uint64 generation                           = 2;
  uint64 parent_generation                    = 3;
  repeated FoldShardCoverageProto per_ns_shard = 4;  // sorted by key
  repeated RunRefProto blob_target_runs       = 5;   // sorted by key
  repeated RunRefProto part_manifest_cleanup  = 6;   // sorted by key
}

// One "ns/shard" -> version entry inside a CompletionSealProto map.
message SealVersionEntryProto {
  string key     = 1;
  uint64 version = 2;
}

// COMPLETION seal (write-once gc/gen/<gen>/completion_seal). Magic CACS, FormatId::CompletionSeal.
message CompletionSealProto {
  CasHeader header                          = 1;
  uint64 generation                         = 2;
  repeated SealVersionEntryProto fence_positions = 3;  // sorted by key
  repeated RunRefProto delete_outcomes      = 4;       // sorted by key
  repeated SealVersionEntryProto trim_cursors = 5;     // sorted by key
  bool adoptable                            = 6;
  // M2: the completion (fold-through-fence) generation's in-degree run segments. CasCompletionSeal
  // declared this field and recheck fills it, but it was never (de)serialized => silent coverage loss.
  repeated RunRefProto blob_target_runs     = 7;  // sorted by key
  // M1: the completion gen overwrites the snap_generation pointer with the completion generation, whose
  // fold_seal lives at the PARENT (fold) generation, not here. Carry the per-(ns,shard) fold cursor
  // coverage forward so the NEXT round's fold recovers the exact sealed cursor from the LATEST seal at
  // snap_generation (completion seal => these folded_cursors), independent of whether trim ran. Without
  // this, sealedCursorOf falls back to 0 and a folded-but-untrimmed event is re-folded => double-count.
  repeated FoldShardCoverageProto folded_cursors = 8;  // sorted by key
}

// One condemned object inside a RetiredSetProto.
// kind: 1=blob, 2=tree (mirrors ObjectKind enum).
// token_type: 1=etag, 2=generation, 3=emulated (mirrors TokenType enum).
message RetiredEntryProto {
  uint32 kind          = 1;
  bytes  hash          = 2;  // raw 16 bytes (UInt128, big-endian)
  string token_value   = 3;
  uint32 token_type    = 4;
  uint64 size          = 5;
  uint64 condemn_round = 6;  // ack-floor: the GC round that condemned this incarnation
}

// Retired-object set (gc/retired/<round>.<fence_seq>/<shard>). Magic CART, FormatId::RetiredSet.
// CasHeader is field 1; existing field renumbered from 1 to free field 1.
// Entries are sorted deterministically (kind, hash-BE, token_value, token_type, size) before
// serialization so the encoded bytes are stable.
message RetiredSetProto {
  CasHeader header                      = 1;  // magic=CART; set by encoder, checked by decoder
  repeated RetiredEntryProto entries    = 2;
}
