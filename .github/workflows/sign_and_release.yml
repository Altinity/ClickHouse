name: Sign and Release packages
on: workflow_dispatch
jobs:
  test-job:
    runs-on: arc-runners-clickhouse-signer-prod
    steps:
      - uses: unfor19/install-aws-cli-action@v1
        with:
          version: 2
          arch: arm64

      - name: Remove packages from s3
        run: |
          aws s3 rm s3://builds.altinity.cloud/Blue/bin-repo/amd64/v25.3.6.10034.altinitystable/non-self-extracting/clickhouse-with-symtable
          aws s3 rm s3://builds.altinity.cloud/Blue/bin-repo/amd64/v25.3.6.10034.altinitystable/non-self-extracting/clickhouse-with-symtable.sha512
          aws s3 rm s3://builds.altinity.cloud/Green/bin-repo/amd64/v25.3.6.10034.altinitystable/non-self-extracting/clickhouse-with-symtable
          aws s3 rm s3://builds.altinity.cloud/Green/bin-repo/amd64/v25.3.6.10034.altinitystable/non-self-extracting/clickhouse-with-symtable.sha512

      - name: Reupload to prod
        run: |
          aws s3 sync /home/runner/.cache/bin-repo/ s3://builds.altinity.cloud/Blue/bin-repo
          aws s3 sync s3://builds.altinity.cloud/Blue/bin-repo s3://builds.altinity.cloud/Green/bin-repo
