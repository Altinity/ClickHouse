name: Sign and Release packages

on:
  workflow_dispatch:
    inputs:
      workflow_url:
        description: 'The URL to the workflow run that produced the packages'
        required: true
      release_environment:
        description: 'The environment to release to. "staging" or "production"'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      package_version:
        description: 'The version of the package to release'
        required: true
        type: string
      docker_release:
        description: 'Publish Docker images'
        required: true
        default: true
        type: boolean
      folder_time:
        description: 'Optional timestamp for the release folder. If not provided, one will be generated.'
        required: false
        type: string

concurrency:
  group: sign-and-release-${{ inputs.release_environment }}
  cancel-in-progress: false
  queue: max

env:
  ARTIFACT_NAME: build_report_package_release
  AWS_REGION: us-east-1
  SRC_BUCKET: ${{ vars.S3_ARTIFACT_BUCKET }}
  DEST_BUCKET: ${{ vars.S3_STORAGE_BUCKET }}

jobs:
  approve-release:
    runs-on: ubuntu-latest
    environment: ${{ inputs.release_environment }}
    steps:
      - name: Release approved
        run: echo "Release of ${PACKAGE_VERSION} to ${RELEASE_ENVIRONMENT} approved (started by ${GITHUB_ACTOR})"
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
          RELEASE_ENVIRONMENT: ${{ inputs.release_environment }}

  extract-package-info:
    needs: approve-release
    runs-on: [altinity-style-checker-aarch64, altinity-on-demand]
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      FOLDER_TIME: ${{ inputs.folder_time }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      docker_version: ${{ env.DOCKER_VERSION }}
      commit_hash: ${{ env.COMMIT_HASH }}
      folder_time: ${{ env.FOLDER_TIME }}
      needs_binary_processing: ${{ env.NEEDS_BINARY_PROCESSING }}
      test_results_src: ${{ env.TEST_RESULTS_SRC }}
      repo_prefix: ${{ env.REPO_PREFIX }}
      src_url: ${{ env.SRC_URL }}
      dest_url: ${{ env.DEST_URL }}
      major_version: ${{ env.MAJOR_VERSION }}
      build_dir: ${{ env.BUILD_DIR }}
      arm_build_dir: ${{ env.ARM_BUILD_DIR }}
      package_version: ${{ env.PACKAGE_VERSION }}
    steps:
      - name: Checkout release scripts
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            tests/ci/release/extract-package-info.py
            tests/ci/release/process-binaries.py
          filter: blob:none
          persist-credentials: false

      - name: Install Python deps
        run: pip3 install packaging requests boto3

      - name: Run script
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
          WORKFLOW_URL: ${{ inputs.workflow_url }}
        run: |
          python3 tests/ci/release/extract-package-info.py \
            --artifact-dest-bucket "$DEST_BUCKET" \
            --artifact-src-bucket "$SRC_BUCKET" \
            --package-version "$PACKAGE_VERSION" \
            --workflow-url "$WORKFLOW_URL"

      - name: Display Extracted Information
        run: |
          echo "Extracted information:"
          echo "commit_hash: ${COMMIT_HASH}"
          echo "docker_version: ${DOCKER_VERSION}"
          echo "folder_time: ${FOLDER_TIME}"
          echo "needs_binary_processing: ${NEEDS_BINARY_PROCESSING}"
          echo "repo_prefix: ${REPO_PREFIX}"
          echo "src_bucket: ${SRC_BUCKET}"
          echo "test_results_src: ${TEST_RESULTS_SRC}"
          echo "src_url: ${SRC_URL}"
          echo "dest_url: ${DEST_URL}"
          echo "major_version: ${MAJOR_VERSION}"
          echo "build_dir: ${BUILD_DIR}"
          echo "arm_build_dir: ${ARM_BUILD_DIR}"

      - name: Install aws cli
        if: ${{ env.NEEDS_BINARY_PROCESSING == 'true' }}
        uses: unfor19/install-aws-cli-action@v1
        with:
          version: 2
          arch: arm64

      - name: Process ARM binaries
        if: ${{ env.NEEDS_BINARY_PROCESSING == 'true' }}
        run: |
          python3 tests/ci/release/process-binaries.py \
            --arch arm64 \
            --package-version "$PACKAGE_VERSION" \
            --binaries-url "${SRC_URL}/${ARM_BUILD_DIR}" \
            --tgz-url "${SRC_URL}/${ARM_BUILD_DIR}" \
            --upload-url "${SRC_URL}/${ARM_BUILD_DIR}/arm64-bin/non-self-extracting"

  copy-packages:
    needs: extract-package-info
    runs-on: [altinity-func-tester, altinity-on-demand]
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      SRC_URL: ${{ needs.extract-package-info.outputs.src_url }}
      DEST_URL: ${{ needs.extract-package-info.outputs.dest_url }}
      NEEDS_BINARY_PROCESSING: ${{ needs.extract-package-info.outputs.needs_binary_processing }}
      MAJOR_VERSION: ${{ needs.extract-package-info.outputs.major_version }}
      BUILD_DIR: ${{ needs.extract-package-info.outputs.build_dir }}
      ARM_BUILD_DIR: ${{ needs.extract-package-info.outputs.arm_build_dir }}
      PACKAGE_VERSION: ${{ needs.extract-package-info.outputs.package_version }}
    steps:
      - name: Checkout release scripts
        uses: actions/checkout@v6
        with:
          sparse-checkout: tests/ci/release/process-binaries.py
          filter: blob:none
          persist-credentials: false

      - name: Install aws cli
        uses: unfor19/install-aws-cli-action@v1
        with:
          version: 2
          arch: amd64

      - name: Copy packages to destination
        run: |
          aws s3 sync --no-progress --exclude "*.src.tar.gz" \
            "${SRC_URL}/${ARM_BUILD_DIR}/" "${DEST_URL}/packages/ARM_PACKAGES/"
          aws s3 sync --no-progress --exclude "*.src.tar.gz" \
            "${SRC_URL}/${BUILD_DIR}/" "${DEST_URL}/packages/AMD_PACKAGES/"

      - name: Separate binaries
        run: |
          aws s3 mv "${DEST_URL}/packages/ARM_PACKAGES/clickhouse" "${DEST_URL}/packages/ARM_PACKAGES/arm64-bin/clickhouse"
          aws s3 mv "${DEST_URL}/packages/ARM_PACKAGES/clickhouse-stripped" "${DEST_URL}/packages/ARM_PACKAGES/arm64-bin/clickhouse-stripped"
          aws s3 mv "${DEST_URL}/packages/AMD_PACKAGES/clickhouse" "${DEST_URL}/packages/AMD_PACKAGES/amd64-bin/clickhouse"
          aws s3 mv "${DEST_URL}/packages/AMD_PACKAGES/clickhouse-stripped" "${DEST_URL}/packages/AMD_PACKAGES/amd64-bin/clickhouse-stripped"

      - name: Process AMD binaries
        if: ${{ env.NEEDS_BINARY_PROCESSING == 'true' }}
        run: |
          python3 tests/ci/release/process-binaries.py \
            --arch amd64 \
            --package-version "$PACKAGE_VERSION" \
            --binaries-url "${DEST_URL}/packages/AMD_PACKAGES/amd64-bin" \
            --tgz-url "${DEST_URL}/packages/AMD_PACKAGES" \
            --upload-url "${DEST_URL}/packages/AMD_PACKAGES/amd64-bin/non-self-extracting"

  copy-test-results:
    needs: extract-package-info
    runs-on: [altinity-style-checker-aarch64, altinity-on-demand]
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TEST_RESULTS_SRC: ${{ needs.extract-package-info.outputs.test_results_src }}
      COMMIT_HASH: ${{ needs.extract-package-info.outputs.commit_hash }}
      DEST_URL: ${{ needs.extract-package-info.outputs.dest_url }}
    steps:
      - name: Install aws cli
        uses: unfor19/install-aws-cli-action@v1
        with:
          version: 2
          arch: arm64
      - name: Copy test results to S3
        run: |
          # Copy test results
          echo "Copying test results..."
          if ! aws s3 sync "s3://${SRC_BUCKET}/${TEST_RESULTS_SRC}/${COMMIT_HASH}" \
              "${DEST_URL}/test_results/"; then
            echo "Failed to copy test results"
            exit 1
          fi

  publish-docker:
    if: ${{ github.event.inputs.docker_release == 'true' }}
    needs: extract-package-info
    strategy:
      matrix:
        image_type: [server, keeper]
        variant: ['', '-alpine']
    uses: ./.github/workflows/docker_publish.yml
    with:
      docker_image: altinityinfra/clickhouse-${{ matrix.image_type }}:${{ needs.extract-package-info.outputs.docker_version }}${{ matrix.variant }}
      release_environment: ${{ inputs.release_environment }}
      upload_artifacts: false
      s3_upload_path: "${{ needs.extract-package-info.outputs.dest_url }}/docker_images/${{ matrix.image_type }}${{ matrix.variant }}/"
    secrets: inherit

  sign-and-publish:
    needs: [extract-package-info, copy-packages]
    environment: ${{ inputs.release_environment == 'production' && 'production-signing' || 'staging' }}
    runs-on: ${{
      inputs.release_environment == 'staging' && 'arc-runners-clickhouse-signer' ||
      inputs.release_environment == 'production' && 'arc-runners-clickhouse-signer-prod'
     }}
    env:
      REPO_DNS_NAME: ${{ inputs.release_environment == 'production' && 'builds.altinity.cloud' || 'builds.staging.altinity.cloud' }}
      REPO_NAME: ${{ inputs.release_environment == 'production' && 'altinity' || 'altinity-staging' }}
      REPO_SUBTITLE: ${{ inputs.release_environment == 'production' && 'Stable Builds' || 'Staging Builds' }}
      PACKAGE_VERSION: ${{ needs.extract-package-info.outputs.package_version }}
      FOLDER_TIME: ${{ needs.extract-package-info.outputs.folder_time }}
      REPO_PREFIX: ${{ needs.extract-package-info.outputs.repo_prefix }}
      NEEDS_BINARY_PROCESSING: ${{ needs.extract-package-info.outputs.needs_binary_processing }}
      DEST_URL: ${{ needs.extract-package-info.outputs.dest_url }}
      RELEASE_ENVIRONMENT: ${{ inputs.release_environment }}
    steps:
      - name: Install aws cli
        uses: unfor19/install-aws-cli-action@v1
        with:
          version: 2
          arch: arm64

      - name: Checkout release scripts
        uses: actions/checkout@v6
        with:
          path: ClickHouse
          sparse-checkout: tests/ci/release
          filter: blob:none
          persist-credentials: false

      - name: Install required packages
        run: |
          echo "Installing required packages..."
          sudo add-apt-repository -y universe
          sudo apt-get update
          sudo apt-get install -y software-properties-common python3-pip apt-utils gnupg rpm createrepo-c file wget
          wget -q http://archive.ubuntu.com/ubuntu/pool/universe/d/dpkg-sig/dpkg-sig_0.13.1+nmu4_all.deb
          sudo dpkg -i dpkg-sig_0.13.1+nmu4_all.deb || sudo apt-get install -f -y
          rm dpkg-sig_0.13.1+nmu4_all.deb
          sudo apt-add-repository --yes --update ppa:ansible/ansible
          sudo apt-get install -y ansible
          sudo ln -s /usr/bin/createrepo_c /usr/bin/createrepo
          pip3 install boto3 botocore natsort --break-system-packages

      - name: Download packages
        run: |
          if ! aws s3 sync "${DEST_URL}/packages/ARM_PACKAGES/" /home/runner/.cache/tmp/packages --exact-timestamps; then
            echo "Failed to download ARM packages"
            exit 1
          fi
          if ! aws s3 sync "${DEST_URL}/packages/AMD_PACKAGES/" /home/runner/.cache/tmp/packages --exact-timestamps; then
            echo "Failed to download AMD packages"
            exit 1
          fi
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Import and unlock GPG key
        id: gpg
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          SIGNING_SECRET_ID: ${{ inputs.release_environment == 'production' && secrets.SIGNING_PROD_SECRET_ID || secrets.SIGNING_STAGING_SECRET_ID }}
        run: ClickHouse/tests/ci/release/gpg-setup.sh setup "$RELEASE_ENVIRONMENT"

      - name: Sign and publish packages
        env:
          GPG_KEY_ID: ${{ steps.gpg.outputs.key_id }}
          GPG_KEY_NAME: ${{ steps.gpg.outputs.key_name }}
        run: |
          ansible-playbook -i ClickHouse/tests/ci/release/packaging/ansible/inventory/localhost.yml \
            -e aws_region="$AWS_REGION" \
            -e gpg_key_id="$GPG_KEY_ID" \
            -e gpg_key_name="$GPG_KEY_NAME" \
            -e local_repo_path="/home/runner/.cache/${RELEASE_ENVIRONMENT}" \
            -e pkgver="$PACKAGE_VERSION" \
            -e release_environment="$RELEASE_ENVIRONMENT" \
            -e repo_dns_name="$REPO_DNS_NAME" \
            -e repo_name="$REPO_NAME" \
            -e repo_prefix="$REPO_PREFIX" \
            -e repo_subtitle="$REPO_SUBTITLE" \
            -e s3_pkgs_bucket="$DEST_BUCKET" \
            -e s3_pkgs_path="pre-release/${PACKAGE_VERSION}/${FOLDER_TIME}" \
            ClickHouse/tests/ci/release/packaging/ansible/sign-and-release.yml

      - name: Remove GPG key and temporary files
        if: always()
        env:
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
        run: |
          rm -rf /home/runner/.cache/tmp/packages
          ClickHouse/tests/ci/release/gpg-setup.sh cleanup "$GPG_FINGERPRINT"

  repo-sanity-check:
    needs: sign-and-publish
    uses: ./.github/workflows/repo-sanity-checks.yml

  copy-to-released:
    needs: [extract-package-info, sign-and-publish]
    if: ${{ inputs.release_environment == 'production' }}
    runs-on: [altinity-style-checker-aarch64, altinity-on-demand]
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      PACKAGE_VERSION: ${{ needs.extract-package-info.outputs.package_version }}
      DEST_URL: ${{ needs.extract-package-info.outputs.dest_url }}
    steps:
      - name: Install aws cli
        uses: unfor19/install-aws-cli-action@v1
        with:
          version: 2
          arch: arm64

      - name: Copy from pre-released to released
        run: |
          case "$DEST_URL" in
            "s3://${DEST_BUCKET}/builds/pre-released/"?*) ;;
            *) echo "::error::Unexpected DEST_URL '${DEST_URL}'"; exit 1 ;;
          esac

          RELEASED_URL="s3://${DEST_BUCKET}/builds/released/v${PACKAGE_VERSION}/"
          echo "Copying pre-released build to released directory..."
          echo "Source: ${DEST_URL}/"
          echo "Destination: ${RELEASED_URL}"

          if ! aws s3 sync "${DEST_URL}/" "${RELEASED_URL}" --no-progress; then
            echo "Failed to copy to released directory"
            exit 1
          fi

          echo "Verifying copy operation..."
          if ! aws s3 ls "${RELEASED_URL}" | grep -q "packages"; then
            echo "Error: Packages directory not found in destination"
            exit 1
          fi
