name: Label and assign new Altinity PRs

on:
  pull_request_target:
    types: [opened]

permissions:
  contents: read
  pull-requests: write

jobs:
  apply-metadata:
    if: github.repository == 'Altinity/ClickHouse'
    runs-on: ubuntu-latest
    steps:
      - name: Load PR scripts from the trusted workflow revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: /.github/scripts/pr_metadata/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Apply branch labels and default assignee
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const apply = require('./.github/scripts/pr_metadata/apply.cjs');
            await apply(github, context);
