name: Deploy static site assets

on:
  workflow_dispatch:
    inputs:
      release_environment:
        description: 'The environment to deploy to. "staging" or "production"'
        required: true
        default: 'staging'
      push_to_active:
        description: >-
          If true, deploy static assets onto the currently live Blue/Green
          prefix and do not rotate CloudFront. If false, deploy static assets
          onto the inactive prefix and rotate CloudFront to it.
        required: true
        type: boolean
        default: true

env:
  AWS_REGION: us-east-1

jobs:
  deploy-static:
    runs-on: ${{
      inputs.release_environment == 'staging' && 'arc-runners-clickhouse-signer' ||
      inputs.release_environment == 'production' && 'arc-runners-clickhouse-signer-prod'
     }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      REPO_DNS_NAME: ${{ inputs.release_environment == 'production' && 'builds.altinity.cloud' || 'builds.staging.altinity.cloud' }}
      REPO_NAME: ${{ inputs.release_environment == 'production' && 'altinity' || 'altinity-staging' }}
      REPO_SUBTITLE: ${{ inputs.release_environment == 'production' && 'Stable Builds' || 'Staging Builds' }}
    steps:
      - name: Validate inputs
        run: |
          if [ "${{ inputs.release_environment }}" != "staging" ] && [ "${{ inputs.release_environment }}" != "production" ]; then
            echo "Error: release_environment must be either 'staging' or 'production'"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install aws cli
        uses: unfor19/install-aws-cli-action@v1
        with:
          version: 2
          arch: arm64

      - name: Install ansible and required collections
        run: |
          pip install --user ansible
          ansible-galaxy collection install amazon.aws community.aws

      - name: Run static deploy playbook
        run: |
          echo "Deploying static site assets to ${{ inputs.release_environment }}..."
          echo "push_to_active=${{ inputs.push_to_active }} (true=stay on live prefix, false=rotate Blue/Green)"
          if ! ansible-playbook -i tests/ci/release/packaging/ansible/inventory/localhost.yml \
            -e aws_region="$AWS_REGION" \
            -e repo_dns_name="$REPO_DNS_NAME" \
            -e repo_name="$REPO_NAME" \
            -e repo_subtitle="$REPO_SUBTITLE" \
            -e push_to_active=${{ inputs.push_to_active }} \
            tests/ci/release/packaging/ansible/deploy-static.yml; then
            echo "Ansible playbook failed"
            exit 1
          fi
