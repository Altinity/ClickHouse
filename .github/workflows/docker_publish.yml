name: Republish Multiarch Docker Image

on:
  workflow_dispatch:
    inputs:
      docker_image:
        description: 'Multiarch Docker image with tag'
        required: true
      release_environment:
        description: 'Select release type: "staging" or "production"'
        type: choice
        default: 'staging'
        options:
          - staging
          - production
      upload_artifacts:
        description: 'Upload artifacts directly in this workflow'
        type: boolean
        default: true
      s3_upload_path:
        description: 'Upload artifacts to s3 path'
        type: string
        required: false
  workflow_call:
    inputs:
      docker_image:
        type: string
        required: true
      release_environment:
        type: string
        required: false
        default: 'staging'
      upload_artifacts:
        type: boolean
        required: false
        default: false
      s3_upload_path:
        type: string
        required: false
    outputs:
      image_archives_path:
        description: 'Path to the image archives directory'
        value: ${{ jobs.republish.outputs.image_archives_path }}

env:
  IMAGE: ${{ github.event.inputs.docker_image || inputs.docker_image }}

jobs:
  republish:
    runs-on: [self-hosted, altinity-on-demand, altinity-style-checker-aarch64]
    outputs:
      image_archives_path: ${{ steps.set_path.outputs.image_archives_path }}
      component: ${{ steps.image_info.outputs.component }}
      published_image: ${{ steps.image_info.outputs.published_image }}
    steps:
      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set clickhouse-server version as new tag
        id: image_info
        run: |
          # Determine "clickhouse-server" or "clickhouse-keeper"
          echo "Input IMAGE: $IMAGE"
          COMPONENT=$(echo "$IMAGE" | sed -E 's|.*/(clickhouse-[^:]+):.*|\1|')
          echo "Component determined: $COMPONENT"
          echo "COMPONENT=$COMPONENT" >> $GITHUB_ENV

          # Pull the image
          echo "Pulling the image"
          docker pull $IMAGE

          # Get version and clean it up
          echo "Getting version from image..."
          VERSION_OUTPUT=$(docker run --rm $IMAGE $COMPONENT --version)
          echo "Raw version output: $VERSION_OUTPUT"

          # Extract just the version number
          NEW_TAG=$(echo "$VERSION_OUTPUT" | sed -E 's/.*version ([0-9.]+[^ ]*).*/\1/')
          echo "Cleaned version: $NEW_TAG"

          # Append "-prerelease" if necessary
          if [ "${{ github.event.inputs.release_environment || inputs.release_environment }}" = "staging" ]; then
            NEW_TAG="${NEW_TAG}-prerelease"
          fi

          if [[ "$IMAGE" == *-alpine* ]]; then
            NEW_TAG="${NEW_TAG}-alpine"
          fi
          if [[ "$IMAGE" == *-ubi9* ]]; then
            NEW_TAG="${NEW_TAG}-ubi9"
          fi
          echo "New tag: $NEW_TAG"

          # Export the new tag
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV
          echo "component=$COMPONENT" >> $GITHUB_OUTPUT
          echo "published_image=altinity/$COMPONENT:$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Process multiarch manifest
        run: |
          echo "Re-tag multiarch image $IMAGE to altinity/$COMPONENT:$NEW_TAG"
          docker buildx imagetools create --tag "altinity/$COMPONENT:$NEW_TAG" "$IMAGE"

          # Create directory for image archives
          mkdir -p image_archives

          # Pull and save platform-specific images
          for PLATFORM in "linux/amd64" "linux/arm64"; do
            echo "Pulling and saving image for $PLATFORM..."
            # Pull the specific platform image
            docker pull --platform $PLATFORM "altinity/$COMPONENT:$NEW_TAG"

            # Save the image to a tar file
            ARCH=$(echo $PLATFORM | cut -d'/' -f2)
            docker save "altinity/$COMPONENT:$NEW_TAG" -o "image_archives/${COMPONENT}-${NEW_TAG}-${ARCH}.tar"
          done

          # Save manifest inspection
          docker buildx imagetools inspect "altinity/$COMPONENT:$NEW_TAG" > image_archives/manifest.txt

          # Compress the archives
          cd image_archives
          for file in *.tar; do
            gzip "$file"
          done
          cd ..

      - name: Set image archives path
        id: set_path
        run: |
          echo "image_archives_path=${{ github.workspace }}/image_archives" >> $GITHUB_OUTPUT

      - name: Upload image archives
        if: ${{ github.event.inputs.upload_artifacts || inputs.upload_artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: docker-images-backup
          path: image_archives/
          retention-days: 90

      - name: Install aws cli
        if: ${{ inputs.s3_upload_path != '' }}
        uses: unfor19/install-aws-cli-action@v1
        with:
          version: 2
          arch: arm64

      - name: Upload to S3
        if: ${{ inputs.s3_upload_path != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws s3 sync image_archives/ "${{ inputs.s3_upload_path }}"

  redhat-certification:
    name: Submit Red Hat container certification
    needs: republish
    if: ${{ vars.RED_HAT_CERTIFICATION_ENABLED == 'true' && (github.event.inputs.release_environment || inputs.release_environment) == 'production' && contains(github.event.inputs.docker_image || inputs.docker_image, '-ubi9') }}
    runs-on: [self-hosted, altinity-on-demand, altinity-style-checker]
    env:
      PREFLIGHT_VERSION: 1.21.0
      PREFLIGHT_SHA256: 5e653135503c72f8702bbe31d7643197d12937c68086879133dd6b9650a9a449
      PYXIS_API_TOKEN: ${{ secrets.RED_HAT_PYXIS_API_TOKEN }}
      SERVER_COMPONENT_ID: ${{ secrets.RED_HAT_CLICKHOUSE_SERVER_CERTIFICATION_COMPONENT_ID }}
      KEEPER_COMPONENT_ID: ${{ secrets.RED_HAT_CLICKHOUSE_KEEPER_CERTIFICATION_COMPONENT_ID }}
      PUBLISHED_IMAGE: ${{ needs.republish.outputs.published_image }}
      COMPONENT: ${{ needs.republish.outputs.component }}
    steps:
      - name: Install Preflight
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/preflight \
            "https://github.com/redhat-openshift-ecosystem/openshift-preflight/releases/download/${PREFLIGHT_VERSION}/preflight-linux-amd64"
          echo "${PREFLIGHT_SHA256}  /tmp/preflight" | sha256sum --check
          sudo install -m 0755 /tmp/preflight /usr/local/bin/preflight

      - name: Submit immutable multiarch image
        run: |
          set -euo pipefail
          : "${PYXIS_API_TOKEN:?Set the RED_HAT_PYXIS_API_TOKEN secret}"
          case "${COMPONENT}" in
            clickhouse-server) component_id="${SERVER_COMPONENT_ID}" ;;
            clickhouse-keeper) component_id="${KEEPER_COMPONENT_ID}" ;;
            *) echo "Unknown component: ${COMPONENT}" >&2; exit 1 ;;
          esac
          : "${component_id:?Set the matching Red Hat certification component secret}"
          digest=$(docker buildx imagetools inspect \
            "${PUBLISHED_IMAGE}" --format '{{.Manifest.Digest}}')
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          pinned_image="${PUBLISHED_IMAGE%:*}@${digest}"
          mkdir -p preflight-artifacts
          PFLT_ARTIFACTS=preflight-artifacts \
          PFLT_LOGFILE=preflight.log \
          PFLT_PYXIS_API_TOKEN="${PYXIS_API_TOKEN}" \
          PFLT_CERTIFICATION_COMPONENT_ID="${component_id}" \
            preflight check container "${pinned_image}" --submit

      - name: Upload certification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: redhat-certification-${{ needs.republish.outputs.component }}-${{ github.run_id }}
          path: |
            preflight-artifacts/
            preflight.log
          if-no-files-found: warn
          retention-days: 365
