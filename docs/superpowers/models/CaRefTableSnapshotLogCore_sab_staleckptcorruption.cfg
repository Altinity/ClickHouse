\* Sabotage (INV-4): snapshot cleanup races the checkpoint away — it deletes the snapshot
\* `ckpt.base` still points at, instead of only snapshots STRICTLY below it. The reader samples the
\* base, its exact-key GET 404s, the `_ckpt` reread shows an UNCHANGED token, and the three-way
\* revalidation is then obliged to declare corruption. Proves the strictly-below gate is what keeps
\* the corrupt branch unreachable — a stale pointer may only under-clean.
\* Must be RED on INV_NOFAIL.
SPECIFICATION Spec
CONSTANTS
    MaxSeq = 4
    MaxRestarts = 2
    LatePred = FALSE
    SabotageReuseAfterAmbiguous = FALSE
    SabotageGapOnFail = FALSE
    SabotageNoSeal = FALSE
    SabotageBlindPut = FALSE
    SabotageScanIsTruth = FALSE
    SabotageCleanupAboveCkpt = FALSE
    SabotageStaleCkptCorruption = TRUE
    SabotageSealClobbersBase = FALSE
INVARIANTS TypeOK INV_RECOVERY INV_NOFAIL INV_DENSE INV_NO_GHOST INV_NO_PHANTOM
