\* Sabotage: the exact-token `_ckpt` delete runs while the row still says `Removing`, instead of
\* after the fourth state.
\*
\* Must be RED on INV_CKPT_UNTIL_READY. `_ckpt` is what grounds recovery for the life, and a
\* `Removing` row is still walkable and still recoverable; deleting the object early manufactures a
\* shape -- a `Removing` row with no `_ckpt` -- that a resumption path would have to interpret, and
\* the only safe reading of it is corruption. Treating it as a finalization window instead would
\* delete a row whose cursor and cleanup item were never proven absent.
\* Control: `_safe`, where the same delete runs one state later.
SPECIFICATION Spec
CONSTANTS
    MaxInc = 3
    SabotageJanitorEatsNewborn = FALSE
    SabotageZombieGoLive = FALSE
    SabotageReconcileLiveCreator = FALSE
    SabotageReconcileStaleToken = FALSE
    SabotageCkptDeleteWhileRemoving = TRUE
    SabotageEntryBeforeCkptDelete = FALSE
    SabotageSameIncarnationRebirth = FALSE
    SabotageFloorRetainsDeadName = FALSE
    SabotageSkipRemovalReady = FALSE
    SabotageRemovalReadyWithoutItem = FALSE
    SabotagePromoteUnderHold = FALSE
INVARIANT TypeOK
INVARIANT INV_CKPT_UNTIL_READY
