\* SABOTAGE: cascade deferred as a free-floating record applied at an arbitrary later time — the re-create/re-expand interleave strips a LIVE tree's child edges. EXPECT INV_NO_LOSS violation.
SPECIFICATION Spec
CONSTANTS
    Writers = {w1}
    Leaders = {L1}
    Shards = {s1}
    Hashes = {t1, t2, h1, h2}
    TreeHashes = {t1, t2}
    MaxToken = 2
    MaxRound = 2
    MaxLog = 5
    EnableResurrect = TRUE
    EnableTrees = TRUE
    EnableDebris = FALSE
    EnableSplit = FALSE
    EnableOverwrite = FALSE
    SabotageNoFence = FALSE
    SabotageNoRecheckFold = FALSE
    SabotageNoRetireView = FALSE
    SabotageUncondDelete = FALSE
    SabotageReusedTag = FALSE
    SabotageCascadeRace = TRUE
    SabotageCutOverclaim = FALSE
    EnableReval = FALSE
    SabotageNoReobserve = FALSE
    EnableRegistry = FALSE
    EnableEvStale = FALSE
    SabotageNoRegistry = FALSE
    SabotageFoldTimeUniverse = FALSE
    SabotageNoEvReobserve = FALSE
CONSTRAINT StateConstraint
INVARIANT TypeOK
INVARIANT INV_NO_DANGLE
INVARIANT INV_NO_LOSS
INVARIANT INV_NO_RETURN
INVARIANT INV_JOURNAL_COVERAGE
PROPERTY MonotoneGC
