\* Witness, negated reachability: the lease expires (`clock >= fenceUntil`), `Renew` extends it
\* under the same epoch, then `WedgeRetryCreate` and `Write` run under the same generation.
\* EXPECTED: `W_LateRenewThenLaneAndWrite` violated, with every invariant of
\* `CaCasMountCore_v9_recoverygen.cfg` enabled and none of them violated first.
\*
\* Runs `CaCasMountCoreLateRenew.tla`, a history wrapper: the sequence is a fact about actions,
\* and `CaCasMountCore` keeps no variable that records it.
\*
\* Trace, depth 10: `ClaimOwnerEmpty -> AllocEpoch -> ClaimMount -> WedgeAdmit -> Tick -> Tick ->
\* Renew -> WedgeRetryCreate -> Write`.
\*
\* Bounds are those of `CaCasMountCore_v9_recoverygen.cfg`. `StrictOrderMount` keeps the trace on
\* an `AllocEpoch`-first mount.
