\* Sabotage: the lazy janitor's scope is widened past INV-3's "foreign incarnation" to the entry's
\* OWN incarnation while the entry is `Creating` — GC eating a newborn.
\*
\* Must be RED on INV_NEWBORN_SAFE. The violation is NOT the deletion: it is the creator going
\* `Live` afterwards on the strength of its own `_ckpt` ack, leaving a `Live` catalog entry whose
\* `_ckpt` object does not exist — the state spec §3's three-writes-in-order makes impossible.
\* Control: `_safe` (identical settings, no toggle).
SPECIFICATION Spec
CONSTANTS
    MaxInc = 3
    SabotageJanitorEatsNewborn = TRUE
    SabotageZombieGoLive = FALSE
    SabotageReconcileLiveCreator = FALSE
    SabotageReconcileStaleToken = FALSE
    SabotageSameIncarnationRebirth = FALSE
    SabotageFloorRetainsDeadName = FALSE
    SabotageDeleteWithoutEvidence = FALSE
    SabotageDeleteWithForeignEvidence = FALSE
    SabotageDeleteUnderHold = FALSE
    SabotageDeleteWithoutExactObservation = FALSE
INVARIANT TypeOK
INVARIANT INV_NEWBORN_SAFE
