\* THE GATE. The honest v9 fold against an HONEST store: contiguous ids, arithmetic walking, a
\* zero-trust LIST hint that may return anything or nothing, one shared blob whose in-degree is
\* pool-wide. Destructive rounds hold a frontier proof for every namespace. Must be GREEN.
SPECIFICATION Spec
CONSTANTS
    T1 = t1
    T2 = t2
    MaxSeq = 3
    EdgeOf <- EdgeRoles
    HintSilent = FALSE
    HintComplete = FALSE
    CkptWitness = FALSE
    EnableHiddenHole = FALSE
    SabotageSkipQuietProbe = FALSE
    SabotageRebuildDropsHold = FALSE
    SabotageClearHoldOnAbsent = FALSE
    SabotageDestroyUnderHold = FALSE
    SabotageDeleteIgnoresIndeg = FALSE
    SabotageAdoptBeforeCommit = FALSE
    SabotageCleanupIgnoresCursor = FALSE
INVARIANT TypeOK
INVARIANT NoMissedFold
INVARIANT ExactlyOnce
INVARIANT LosingCommitAdoptsNothing
INVARIANT NoAckedLoss
INVARIANT HoldSuppresses
