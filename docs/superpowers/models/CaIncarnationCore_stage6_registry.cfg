\* Stage 6a: namespace registry + manifest creation (2026-06-12 amendment). Two shards (= two
\* namespaces), both UNREGISTERED at Init — every publish must W-REGISTER first; GC fences the
\* registry, derives the shard universe from the FENCE-TIME registry, and MINTS absent manifests.
\* Reval mode (entries drop on outcomes) — matches the implementation. Exercises both horns of the
\* registration-vs-fence ordering: register-before-registry-fence => minted+fenced this round;
\* register-after => registration floor = round forces a view refresh before the first publish.
\* INV_MAN_EXISTS: no manifest activity without creation.
SPECIFICATION Spec
CONSTANTS
    Writers = {w1}
    Leaders = {L1}
    Shards = {s1, s2}
    Hashes = {h1}
    TreeHashes = {}
    MaxToken = 3
    MaxRound = 2
    MaxLog = 4
    EnableResurrect = TRUE
    EnableTrees = FALSE
    EnableDebris = FALSE
    EnableSplit = FALSE
    EnableOverwrite = FALSE
    SabotageNoFence = FALSE
    SabotageNoRecheckFold = FALSE
    SabotageNoRetireView = FALSE
    SabotageUncondDelete = FALSE
    SabotageReusedTag = FALSE
    SabotageCascadeRace = FALSE
    SabotageCutOverclaim = FALSE
    EnableReval = TRUE
    SabotageNoReobserve = FALSE
    EnableRegistry = TRUE
    EnableEvStale = FALSE
    SabotageNoRegistry = FALSE
    SabotageFoldTimeUniverse = FALSE
    SabotageNoEvReobserve = FALSE
CONSTRAINT StateConstraint
INVARIANT TypeOK
INVARIANT INV_NO_DANGLE
INVARIANT INV_NO_LOSS
INVARIANT INV_NO_RETURN
INVARIANT INV_JOURNAL_COVERAGE
INVARIANT INV_MAN_EXISTS
PROPERTY MonotoneGC
PROPERTY MonotoneRegistry
