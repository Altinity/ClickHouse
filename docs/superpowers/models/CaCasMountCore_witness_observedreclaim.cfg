\* LIVENESS WITNESS (split out from CaCasMountCore_rev6_observe.cfg in round 7 -- see that
\* cfg's header for why bundling a monotone witness with safety invariants is a gate defect):
\* assert W_ObservedReclaim as an INVARIANT so TLC reports it VIOLATED -> the "reclaim after
\* full TTL + Drift token-stability wait" recovery path is reachable, not vacuous.
SPECIFICATION Spec
CONSTANTS
    Actors = {A, B}
    None = NoneVal
    MaxClock = 8
    MaxEpoch = 3
    MaxToken = 9
    TTL = 3
    SabForeignTakeover = FALSE
    SabEpochReset = FALSE
    SabAdoptWedgeOnTouch = FALSE
    SabAdoptIgnoresFence = FALSE
    Drift = 2
    SabWallClockReclaim = FALSE
    SabEpochGuardOff = FALSE
    SabDecomBlindBypass = FALSE
    RecoveryGenOn = FALSE          \* 2026-07-28 v9: the recovery-generation layer is INERT here --
                                   \* this cfg predates it and its state space is therefore
                                   \* unchanged (see CaCasMountCore_RESULTS.md's before/after table)
    SabStaleInstall = FALSE
    SabWedgeRetryOldGen = FALSE
    SabSlotNoByteCompare = FALSE
    MaxAdmissions = 0          \* the layer is off here; the bound is only
                            \* declared because TLC requires every constant
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT W_ObservedReclaim
