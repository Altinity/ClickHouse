\* HUNT (BFS bug-hunt, NOT a proof run): the full cross-product no staged config co-checks —
\* trees x debris x split-brain x overwrite x 2 writers x 2 shards. This will NOT converge within
\* any practical budget; it is run under a wall-clock timeout to search a multi-billion-state
\* prefix for counterexamples. "No violation found" here means exactly that — an incomplete
\* search with no error in the explored prefix — and is recorded as such, never as a PASS.
SPECIFICATION Spec
CONSTANTS
    Writers = {w1, w2}
    Leaders = {L1, L2}
    Shards = {s1, s2}
    Hashes = {t1, h1, h2}
    TreeHashes = {t1}
    MaxToken = 3
    MaxRound = 2
    MaxLog = 4
    EnableResurrect = TRUE
    EnableTrees = TRUE
    EnableDebris = TRUE
    EnableSplit = TRUE
    EnableOverwrite = TRUE
    SabotageNoFence = FALSE
    SabotageNoRecheckFold = FALSE
    SabotageNoRetireView = FALSE
    SabotageUncondDelete = FALSE
    SabotageReusedTag = FALSE
    SabotageCascadeRace = FALSE
    SabotageCutOverclaim = FALSE
    EnableReval = TRUE
    SabotageNoReobserve = FALSE
    EnableRegistry = FALSE
    EnableEvStale = FALSE
    SabotageNoRegistry = FALSE
    SabotageFoldTimeUniverse = FALSE
    SabotageNoEvReobserve = FALSE
CONSTRAINT StateConstraint
INVARIANT TypeOK
INVARIANT INV_NO_DANGLE
INVARIANT INV_NO_LOSS
INVARIANT INV_NO_RETURN
INVARIANT INV_JOURNAL_COVERAGE
PROPERTY MonotoneGC
