\* Sabotage: a fenced-out creator's install is REFUSED BY NEITHER credential. Spec §3 requires the
\* admission mount-fence generation on every `slot-occupy`, `_ckpt` CAS and install; INV-3 makes
\* `ref_catalog` a token-CAS "like `gc/state`". `GoLive` carries both; this drops both at once,
\* because a design relying on only one of them would be gated by neither config.
\*
\* Must be RED on INV_NEWBORN_SAFE, and note that this reaches that invariant from the OPPOSITE end
\* to `_sab_janitoreatsnewborn`. Nothing here is sabotaged except the install's refusal: the creator
\* legitimately acked its `_ckpt`, its fence legitimately went terminal, the reconciliation that
\* reclaimed the name was honest (token-exact and fence-terminal), and the janitor that then swept
\* the now-foreign `_ckpt` was following its own correct rule. The only wrong step is the stalled
\* creator waking up and publishing `Live` over a prefix that has been cleaned.
\*
\* The damage needs NO incarnation reuse, which is the point: this is the aliasing route that the
\* incarnation argument does not close, and it is closed by the two credential checks instead.
\* Control: `_safe`.
SPECIFICATION Spec
CONSTANTS
    MaxInc = 3
    SabotageJanitorEatsNewborn = FALSE
    SabotageZombieGoLive = TRUE
    SabotageReconcileLiveCreator = FALSE
    SabotageReconcileStaleToken = FALSE
    SabotageSameIncarnationRebirth = FALSE
    SabotageFloorRetainsDeadName = FALSE
    SabotageDeleteWithoutEvidence = FALSE
    SabotageDeleteWithForeignEvidence = FALSE
    SabotageDeleteUnderHold = FALSE
    SabotageDeleteWithoutExactObservation = FALSE
INVARIANT TypeOK
INVARIANT INV_NEWBORN_SAFE
