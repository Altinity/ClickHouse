\* Sabotage: recreation reuses the physical life id captured by the janitor page. The unchanged stale
\* janitor delete then reaches the reborn life's bytes. Must violate NoLiveDataDeleted. Rederivation
\* stays disabled so this isolates incarnation freshness.
SPECIFICATION Spec
CONSTANTS
    MaxInc = 2
    SabotageNoIncarnation = TRUE
    SabotageRederive = FALSE
INVARIANT TypeOK
INVARIANT NominationCapturedPhysicalId
INVARIANT NoLiveDataDeleted
