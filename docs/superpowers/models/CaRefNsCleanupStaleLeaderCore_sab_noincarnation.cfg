\* Sabotage (CaRefCatalogCore's SabotageSameIncarnationRebirth, replayed in the stale-leader shape):
\* recreation reuses `staleInc` instead of minting fresh. The SAME unconditional StaleLeaderPass code
\* -- nothing about it changes -- now deletes the reborn life's own data the moment it captures the
\* aliased incarnation. Must violate NoLiveDataDeleted. RED: the model-level proof that incarnation
\* freshness, not a live guard, is what carries rebirth safety. SabotageRederive stays FALSE: this
\* config isolates the incarnation-reuse route from the deposit-vs-rederive route (`_sab_rederive`).
SPECIFICATION Spec
CONSTANTS
    MaxInc = 2
    SabotageNoIncarnation = TRUE
    SabotageRederive = FALSE
INVARIANT TypeOK
INVARIANT NoLiveDataDeleted
