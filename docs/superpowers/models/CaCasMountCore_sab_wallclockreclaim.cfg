\* SABOTAGE (rev.6, round 2): the reclaimer trusts the stamp directly (clock >
\* mount.deadline) instead of waiting out the full token-stability window (TTL + Drift)
\* on its own clock. With Drift > 0 the holder's TRUE local fence can genuinely outlive
\* the stamp, so WallClockReclaim can complete (advancing GLOBAL truth -- the durable
\* epoch counter) strictly before the holder's fence has expired -- the holder's next
\* mechanically-valid Write (clock < fenceUntil still holds) then lands after global
\* truth already superseded it. MUST violate GlobalSupersededWriterMakesNoMutation.
\* SupersededWriterMakesNoMutation (the KNOWLEDGE-based, legacy invariant) is also
\* checked and is expected to stay green here: WallClockReclaim never touches localLost
\* (see model comments) -- the whole point is that the old holder does NOT learn.
SPECIFICATION Spec
CONSTANTS
    Actors = {A, B}
    None = NoneVal
    MaxClock = 8
    MaxEpoch = 3
    MaxToken = 8
    TTL = 3
    SabForeignTakeover = FALSE
    SabEpochReset = FALSE
    SabSupersededWrites = FALSE
    SabAdoptWedgeOnTouch = FALSE
    SabAdoptIgnoresFence = FALSE
    Drift = 2
    SabWallClockReclaim = TRUE
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT GlobalSupersededWriterMakesNoMutation
INVARIANT SupersededWriterMakesNoMutation
