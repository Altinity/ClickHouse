\* SABOTAGE (rev.6, round 2; body-install added round 8): the reclaimer trusts the stamp
\* directly (clock > mount.deadline) instead of waiting out the full token-stability
\* window (TTL + Drift) on its own clock. With Drift > 0 the holder's TRUE local fence can
\* genuinely outlive the stamp, so WallClockReclaim can complete (installing the successor's
\* fresh-epoch, unfenced body -- round 8, faithful to `CasServerRoot.cpp:405-414`) strictly
\* before the holder's fence has expired -- the holder's next mechanically-valid Write
\* (clock < fenceUntil still holds; round 8: Write reads no shared state at all, so the
\* freshly-installed body cannot block it either) then lands after global truth already
\* superseded it. THE LOAD-BEARING ASYMMETRY (round 8): installing the successor body does
\* NOT block this violation -- Write never reads `mount`, so the reclaim's body-install
\* (needed for honest-path safety) has zero effect on the sabotage path; only the reclaim's
\* PRECONDITION differs (observation wait vs. trusting the stamp). MUST violate
\* GlobalSupersededWriterMakesNoMutation.
\*
\* SupersededWriterMakesNoMutation (the KNOWLEDGE-based, legacy invariant) is DELIBERATELY
\* NOT checked here (round 8, reviewer Q2): with `~mount.fenced` gone from Write (P2-full),
\* a Write CAN now fire with localLost[a]=TRUE if the local fence is still valid -- which IS
\* reachable in this specific drift window (a Renew-then-Write path could trip it), but only
\* behind the shallower GlobalSupersededWriterMakesNoMutation violation above, which TLC
\* always finds first. Listing it here would invite "why is this masked-green" confusion;
\* dropped rather than trusted.
