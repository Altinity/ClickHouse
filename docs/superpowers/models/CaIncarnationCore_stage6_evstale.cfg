\* Stage 6b: evidence staleness (amended W-EVIDENCE, 2026-06-12) + dep-set tree-child validation
\* (W-TREE-BUILD without a global presence oracle). Reval mode: retired entries drop on confirmed
\* outcomes, so "no retire hit at my view" can mean "already deleted" — STALE evidence (recorded
\* under an older view) must be re-observed (WEvObserve) before gating a publish. One tree whose
\* children are covered by token deps or evidence in the writer's OWN dep set.
SPECIFICATION Spec
CONSTANTS
    Writers = {w1}
    Leaders = {L1}
    Shards = {s1}
    Hashes = {t1, h1, h2}
    TreeHashes = {t1}
    MaxToken = 2
    MaxRound = 2
    MaxLog = 5
    EnableResurrect = TRUE
    EnableTrees = TRUE
    EnableDebris = FALSE
    EnableSplit = FALSE
    EnableOverwrite = FALSE
    SabotageNoFence = FALSE
    SabotageNoRecheckFold = FALSE
    SabotageNoRetireView = FALSE
    SabotageUncondDelete = FALSE
    SabotageReusedTag = FALSE
    SabotageCascadeRace = FALSE
    SabotageCutOverclaim = FALSE
    EnableReval = TRUE
    SabotageNoReobserve = FALSE
    EnableRegistry = FALSE
    EnableEvStale = TRUE
    SabotageNoRegistry = FALSE
    SabotageFoldTimeUniverse = FALSE
    SabotageNoEvReobserve = FALSE
CONSTRAINT StateConstraint
INVARIANT TypeOK
INVARIANT INV_NO_DANGLE
INVARIANT INV_NO_LOSS
INVARIANT INV_NO_RETURN
INVARIANT INV_JOURNAL_COVERAGE
PROPERTY MonotoneGC
