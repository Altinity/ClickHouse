\* SABOTAGE: gate 1 rule 3's touch check is blind to shape. With only two admitted shapes,
\* "blind to shape" means rule 3 can never see a reason to refuse -- it degenerates to
\* unconditionally quiescent, identical to SabotageStaleCache. A touching mutation then confirms
\* off the stale row exactly as in _sab_stalecache, producing the same counterexample.
\* TLC MUST report a ConfirmedRelinkNeverDangles counterexample.
SPECIFICATION Spec
CONSTANTS
    Receivers = {r1}
    MaxId = 5
    MaxRound = 5
    MaxHoles = 0
    SabotageNoGate1 = FALSE
    SabotageStaleCache = FALSE
    SabotageTouchBlind = TRUE
    SabotageNoPoison = FALSE
    SabotageNoFence = FALSE
    SabotagePublishAfterConfirm = FALSE
INVARIANTS
    ConfirmedRelinkNeverDangles
CHECK_DEADLOCK FALSE
