\* Sabotage: reconciliation acts on a STALE catalog sample — an unconditional delete instead of spec
\* §3's token-exact CAS.
\*
\* The more dangerous of the two reconciliation faults, and the reason the spec says "token-exact"
\* rather than "re-read first": the victim is whatever the catalog holds at ACT time, so a sample
\* taken while the name was `Creating` can delete a successor's `Live` entry. With no entry naming
\* it, the successor's whole ref layer is foreign by the janitor's own rule.
\* Must be RED on INV_RECONCILE_SAFE. Control: `_safe`.
SPECIFICATION Spec
CONSTANTS
    MaxInc = 3
    SabotageJanitorEatsNewborn = FALSE
    SabotageZombieGoLive = FALSE
    SabotageReconcileLiveCreator = FALSE
    SabotageReconcileStaleToken = TRUE
    SabotageSameIncarnationRebirth = FALSE
    SabotageFloorRetainsDeadName = FALSE
    SabotageDeleteWithoutEvidence = FALSE
    SabotageDeleteWithForeignEvidence = FALSE
    SabotageDeleteUnderHold = FALSE
INVARIANT TypeOK
INVARIANT INV_RECONCILE_SAFE
