\* HUNT (random SIMULATION, NOT a proof run): deep random traces at bounds BFS could never
\* enumerate — 2 trees + 2 blobs, MaxToken=4, MaxRound=4, MaxLog=8, all features co-enabled.
\* Run with: -simulate -depth 200 (the runner's extra-args). Probes deep combinatorial schedules
\* beyond BFS reach (the documented residual). Invariants only — action properties are left to
\* the BFS hunt. "No violation found" = no error on the sampled traces, never a PASS.
SPECIFICATION Spec
CONSTANTS
    Writers = {w1, w2}
    Leaders = {L1, L2}
    Shards = {s1, s2}
    Hashes = {t1, t2, h1, h2}
    TreeHashes = {t1, t2}
    MaxToken = 4
    MaxRound = 4
    MaxLog = 8
    EnableResurrect = TRUE
    EnableTrees = TRUE
    EnableDebris = TRUE
    EnableSplit = TRUE
    EnableOverwrite = TRUE
    SabotageNoFence = FALSE
    SabotageNoRecheckFold = FALSE
    SabotageNoRetireView = FALSE
    SabotageUncondDelete = FALSE
    SabotageReusedTag = FALSE
    SabotageCascadeRace = FALSE
    SabotageCutOverclaim = FALSE
    EnableReval = TRUE
    SabotageNoReobserve = FALSE
    EnableRegistry = FALSE
    EnableEvStale = FALSE
    SabotageNoRegistry = FALSE
    SabotageFoldTimeUniverse = FALSE
    SabotageNoEvReobserve = FALSE
CONSTRAINT StateConstraint
INVARIANT TypeOK
INVARIANT INV_NO_DANGLE
INVARIANT INV_NO_LOSS
INVARIANT INV_NO_RETURN
INVARIANT INV_JOURNAL_COVERAGE
