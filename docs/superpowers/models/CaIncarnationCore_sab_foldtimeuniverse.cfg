\* NEGATIVE CONTROL: GC fences the FOLD-TIME registry universe (captured at round start) instead
\* of the registry decoded by the committed registry-fence CAS — the C++ hole fixed 2026-06-12. A
\* namespace registered between round start and the registry fence falls between the two horns:
\* its registration floor predates the fence (the writer is never blocked), yet its shards are
\* never fenced or recheck-folded this round. MUST violate INV_NO_DANGLE (same bounds as
\* stage6_registry).
SPECIFICATION Spec
CONSTANTS
    Writers = {w1}
    Leaders = {L1}
    Shards = {s1, s2}
    Hashes = {h1}
    TreeHashes = {}
    MaxToken = 3
    MaxRound = 2
    MaxLog = 4
    EnableResurrect = TRUE
    EnableTrees = FALSE
    EnableDebris = FALSE
    EnableSplit = FALSE
    EnableOverwrite = FALSE
    SabotageNoFence = FALSE
    SabotageNoRecheckFold = FALSE
    SabotageNoRetireView = FALSE
    SabotageUncondDelete = FALSE
    SabotageReusedTag = FALSE
    SabotageCascadeRace = FALSE
    SabotageCutOverclaim = FALSE
    EnableReval = TRUE
    SabotageNoReobserve = FALSE
    EnableRegistry = TRUE
    EnableEvStale = FALSE
    SabotageNoRegistry = FALSE
    SabotageFoldTimeUniverse = TRUE
    SabotageNoEvReobserve = FALSE
CONSTRAINT StateConstraint
INVARIANT INV_NO_DANGLE
