\* FINDING, not a sabotage: v9's residual exposure, executable. Same corruption as `_v9_hold`, but
\* with the ordinary omission-capable listing. A namespace whose above-cursor record was lost and
\* that the hint never mentions is INDISTINGUISHABLE from a quiet one: the exact `GET cursor+1`
\* returns absent, no witness is ever observed, the frontier proof is granted, and a visible `-1`
\* elsewhere deletes a blob that an INTACT acked `+1` above the gap still names.
\*
\* The precondition is corruption (spec §5: an above-cursor log "cannot be legitimately cleaned, so
\* its disappearance is corruption") occurring BEFORE it was ever observed — so it sits outside
\* spec §1's trust model, in which exact point reads are honest. It is recorded here because the
\* damage exceeds the corruption itself: an intact record loses its blob. `_fix_ckptwitness` shows
\* the cheap partial mitigation. A VIOLATION is the evidence, so the runner treats it as PASS.
SPECIFICATION Spec
CONSTANTS
    T1 = t1
    T2 = t2
    MaxSeq = 3
    EdgeOf <- EdgeRoles
    HintSilent = FALSE
    HintComplete = FALSE
    CkptWitness = FALSE
    EnableHiddenHole = TRUE
    SabotageSkipQuietProbe = FALSE
    SabotageRebuildDropsHold = FALSE
    SabotageClearHoldOnAbsent = FALSE
    SabotageDestroyUnderHold = FALSE
    SabotageDeleteIgnoresIndeg = FALSE
    SabotageAdoptBeforeCommit = FALSE
    SabotageCleanupIgnoresCursor = FALSE
    PlanOnly = FALSE
    SabotageAdapterMints = FALSE
INVARIANT TypeOK
INVARIANT NoAckedLoss
INVARIANT NoMissedFold
INVARIANT ExactlyOnce
INVARIANT LosingCommitAdoptsNothing
INVARIANT HoldSuppresses
