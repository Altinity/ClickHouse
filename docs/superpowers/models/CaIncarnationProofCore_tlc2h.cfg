\* BOUNDED two-hash TLC pre-filter for INTER-HASH conjuncts (matches CInit's Hashes={h1,h2}).
\* The two-hash state space is not exhaustively enumerable (>495M distinct states observed without
\* completing); this config is run with a wall-clock timeout — no violation required, exhaustion
\* NOT required. See the pre-filter policy note in CaIncarnationProofCore.tla: induction soundness
\* rests on the Apalache base+step checks, not on this pre-filter.
SPECIFICATION Spec
CONSTANTS
    Writers = {w1, w2}
    Shards = {s1}
    Hashes = {h1, h2}
    MaxToken = 3
    MaxRound = 2
    MaxLog = 4
CONSTRAINT StateConstraint
INVARIANT TypeBounds
INVARIANT NoDangle
INVARIANT NoReturn
INVARIANT InflightAllocated
INVARIANT PhaseRoundActive
INVARIANT AbsentObsolete
INVARIANT RootEdgesTyped
INVARIANT InflightCurrentUnreferenced
INVARIANT FenceCoverage
INVARIANT FencePosRecord
INVARIANT FenceLeRound
INVARIANT RetiredCoveredNoPostFenceAdd
INVARIANT RetiringFenceBelow
INVARIANT InflightHeld
INVARIANT RetiredCurrentOrDead
INVARIANT InflightVsRefs
INVARIANT SendImpliesFenced
INVARIANT RefsFromLog
INVARIANT SnapFromPrefix
