\* Stage 5: split-brain leaders (two concurrent GC round machines on shared durable state) + unconditional overwrite (anonymous churn). Debris OFF to isolate split+overwrite (debris+split together explode; stage 4 covers debris). Small bounds. Ladder rung 1 (MaxLog=4): MaxLog=5 did not converge in 360s (split-brain x 2 hashes x overwrite). PASS: 82,983,981 distinct states, 3min 36s.
SPECIFICATION Spec
CONSTANTS
    Writers = {w1}
    Leaders = {L1, L2}
    Shards = {s1}
    Hashes = {h1, h2}
    TreeHashes = {}
    MaxToken = 3
    MaxRound = 2
    MaxLog = 4
    EnableResurrect = TRUE
    EnableTrees = FALSE
    EnableDebris = FALSE
    EnableSplit = TRUE
    EnableOverwrite = TRUE
    SabotageNoFence = FALSE
    SabotageNoRecheckFold = FALSE
    SabotageNoRetireView = FALSE
    SabotageUncondDelete = FALSE
    SabotageReusedTag = FALSE
    SabotageCascadeRace = FALSE
    SabotageCutOverclaim = FALSE
    EnableReval = FALSE
    SabotageNoReobserve = FALSE
    EnableRegistry = FALSE
    EnableEvStale = FALSE
    SabotageNoRegistry = FALSE
    SabotageFoldTimeUniverse = FALSE
    SabotageNoEvReobserve = FALSE
CONSTRAINT StateConstraint
INVARIANT TypeOK
INVARIANT INV_NO_DANGLE
INVARIANT INV_NO_LOSS
INVARIANT INV_NO_RETURN
INVARIANT INV_JOURNAL_COVERAGE
PROPERTY MonotoneGC
