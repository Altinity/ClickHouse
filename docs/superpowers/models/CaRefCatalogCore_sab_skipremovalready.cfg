\* Sabotage: the fourth state itself. The row is deleted straight out of `Removing` once its
\* terminal record has folded -- the ordering that was tried before `RemovalReady` existed, and the
\* one this state replaces. Nothing else is touched: the terminal record still folds first and the
\* `_ckpt` still goes before the row.
\*
\* Must be RED on INV_LEGAL_TRANSITIONS. `removing -> absent` is not a pair the table admits, and
\* the reason it is not is that the row still says `Removing` while the deletion is decided: at that
\* moment every producer is still entitled to admit the namespace and write its cursor again, so a
\* seal observed with the cursor pruned proves nothing about the seal that will be adopted next.
\* The state replaces that temporal claim with a durable catalog fact.
\* Control: `_safe`, which runs the same removal through the fourth state.
SPECIFICATION Spec
CONSTANTS
    MaxInc = 3
    SabotageJanitorEatsNewborn = FALSE
    SabotageZombieGoLive = FALSE
    SabotageReconcileLiveCreator = FALSE
    SabotageReconcileStaleToken = FALSE
    SabotageCkptDeleteWhileRemoving = FALSE
    SabotageEntryBeforeCkptDelete = FALSE
    SabotageSameIncarnationRebirth = FALSE
    SabotageFloorRetainsDeadName = FALSE
    SabotageSkipRemovalReady = TRUE
    SabotageRemovalReadyWithoutItem = FALSE
    SabotagePromoteUnderHold = FALSE
INVARIANT TypeOK
INVARIANT INV_LEGAL_TRANSITIONS
