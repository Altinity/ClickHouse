\* Sabotage: a stale `Creating` entry is reconciled without waiting for its creator's fence to be
\* terminal (spec §3 requires "only after its creator's fence is terminal").
\*
\* Must be RED on INV_RECONCILE_SAFE. The counterexample has to reach the DAMAGE, not just the bad
\* CAS: the reconciled creator is still running, nothing in the catalog names its incarnation any
\* more, and the janitor's honest rule ("delete every incarnation the catalog does not name") then
\* licenses it to delete a running life's bytes — or the orphan writes bytes no fold or exact-token
\* delete can ever address. Control: `_safe`.
SPECIFICATION Spec
CONSTANTS
    MaxInc = 3
    SabotageJanitorEatsNewborn = FALSE
    SabotageZombieGoLive = FALSE
    SabotageReconcileLiveCreator = TRUE
    SabotageReconcileStaleToken = FALSE
    SabotageSameIncarnationRebirth = FALSE
    SabotageFloorRetainsDeadName = FALSE
    SabotageDeleteWithoutEvidence = FALSE
    SabotageDeleteWithForeignEvidence = FALSE
    SabotageDeleteUnderHold = FALSE
INVARIANT TypeOK
INVARIANT INV_RECONCILE_SAFE
