\* SABOTAGE (2026-07-24 fence-not-rescue gate, spec rev.4): the pre-fix `allocateWriterEpoch`
\* re-mints the durable epoch counter from an ABSENT/wiped reading (`epoch = 0`, after a
\* genuine prior allocation -- `epochCeiling > 0`) WITHOUT checking whether a mount is still
\* live for this uuid (`SabEpochGuardOff = TRUE` drops the `mount = None` guard on
\* `RemintEpoch`). Counterexample shape: A holds a LIVE (unfenced) mount at some epoch ->
\* `WipeEpoch` destroys the durable counter -> `RemintEpoch(A)` re-mints epoch 1 DESPITE the
\* mount still being live and at a DIFFERENT epoch -> `Renew`'s pre-existing different-epoch
\* branch classifies the now-diverged mount as "superseded" (`localLost[A]' = TRUE`) -> A's
\* own next `Write` (gated only on its own still-valid `clock < fenceUntil`, P2 -- reads no
\* shared mount state at all) fires ANYWAY. This is the "confirmed mismatch, still mutates"
\* two-writer shape `SupersededWriterMakesNoMutation` exists to catch (round-3 №5 flagged the
\* model's actor≡uuid structure cannot cleanly express a literal second, concurrently-live
\* physical writer identity -- this is the model's decisive same-uuid substitute: the
\* corrupted incarnation's OWN local bookkeeping diverges from the mount's ground truth via
\* the guard-off re-mint, is CAUGHT by the model's existing superseded-detection, and still
\* mutates regardless). MUST violate SupersededWriterMakesNoMutation.
\*
\* `FenceCostsEpoch` and `WriterEpochMonotoneUnique` are NOT listed (see
\* `CaCasMountCore_stage1.cfg`'s comment, corrected 2026-07-24 review follow-up, for the two
\* DIFFERENT causes): `WriterEpochMonotoneUnique` is tripped by `WipeEpoch` alone (unrelated to
\* whether THIS cfg's own `SabEpochGuardOff` sabotage ever fires); `FenceCostsEpoch` requires
\* `RemintEpoch`'s HONEST branch to also fire afterward (its literal-`1` mint colliding with a
\* historically-fenced epoch) -- both are reachable in this cfg regardless of the guard-off
\* sabotage under test, and listing either here would let TLC report the wrong (accepted,
\* unrelated residual-hole) violation first, masking the actual target this cfg exists to
\* demonstrate.
SPECIFICATION Spec
CONSTANTS
    Actors = {A, B}
    None = NoneVal
    MaxClock = 4
    MaxEpoch = 3
    MaxToken = 7
    TTL = 2
    SabForeignTakeover = FALSE
    SabEpochReset = FALSE
    SabAdoptWedgeOnTouch = FALSE
    SabAdoptIgnoresFence = FALSE
    Drift = 0
    SabWallClockReclaim = FALSE
    SabEpochGuardOff = TRUE
    SabDecomBlindBypass = FALSE
    RecoveryGenOn = FALSE          \* 2026-07-28 v9: the recovery-generation layer is INERT here --
                                   \* this cfg predates it and its state space is therefore
                                   \* unchanged (see CaCasMountCore_RESULTS.md's before/after table)
    SabStaleInstall = FALSE
    SabWedgeRetryOldGen = FALSE
    SabSlotNoByteCompare = FALSE
    MaxAdmissions = 0          \* the layer is off here; the bound is only
                            \* declared because TLC requires every constant
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT NoTwoServerUuidsOwnSameServerRoot
INVARIANT ForeignUuidNeverAutoTakesOver
INVARIANT SupersededWriterMakesNoMutation
INVARIANT NoPermanentWedge
