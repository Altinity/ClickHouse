\* Sabotage: the reader treats a vanished selected object (deleted between LIST and GET) as
\* corruption instead of restarting with a fresh scan. A completing reader is stranded. Must be RED
\* (INV_NOFAIL).
SPECIFICATION Spec
CONSTANTS
    MaxSeq = 4
    MaxRestarts = 2
    SabotageDeleteBeforeSnapshot = FALSE
    SabotageVanishIsCorruption = TRUE
    SabotageRecreateBeforeCompleted = FALSE
    LatePred = FALSE
INVARIANT TypeOK
INVARIANT INV_RECOVERY
INVARIANT INV_NOFAIL
INVARIANT INV_RECREATE
