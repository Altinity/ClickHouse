\* Sabotage: direct `Removing -> absent` deletion omits the bounded cleanup-attempt check.
\* TLC must delete with `lastDeleteCleanupAttempt = FALSE` and violate `INV_REMOVAL_DELETE_PROVED`.
SPECIFICATION Spec
