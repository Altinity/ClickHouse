\* SABOTAGE: gate 1 rule 4 (apply-pending poison must be Clean) dropped.  Distinct from
\* _sab_stalecache: after a poisoned apply the lane IS quiescent, so rule 3 sees nothing and
\* rule 4 is the only guard left.  TLC MUST report a ConfirmedRelinkNeverDangles counterexample.
SPECIFICATION Spec
CONSTANTS
    Receivers = {r1}
    MaxId = 5
    MaxRound = 5
    MaxHoles = 0
    SabotageNoGate1 = FALSE
    SabotageStaleCache = FALSE
    SabotageTouchBlind = FALSE
    SabotageNoPoison = TRUE
    SabotageNoFence = FALSE
    SabotagePublishAfterConfirm = FALSE
INVARIANTS
    ConfirmedRelinkNeverDangles
CHECK_DEADLOCK FALSE
