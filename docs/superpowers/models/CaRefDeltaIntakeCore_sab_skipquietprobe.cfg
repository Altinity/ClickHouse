\* Sabotage: THE r7-1 BLOCKER, and the load-bearing control of this model. Destructive rounds run
\* without a frontier proof — "unhinted means quiet". T1 durably commits and acknowledges a `+1` on
\* the shared blob at its exact next slot; the round's listing omits every T1 key but returns T2's
\* `-1`; in-degree reaches zero over a fold that never saw T1. The store is HONEST here: the only
\* adversary is hint omission. Must be RED on NoAckedLoss.
SPECIFICATION Spec
CONSTANTS
    T1 = t1
    T2 = t2
    MaxSeq = 3
    EdgeOf <- EdgeRoles
    HintSilent = FALSE
    HintComplete = FALSE
    CkptWitness = FALSE
    EnableHiddenHole = FALSE
    SabotageSkipQuietProbe = TRUE
    SabotageRebuildDropsHold = FALSE
    SabotageClearHoldOnAbsent = FALSE
    SabotageDestroyUnderHold = FALSE
    SabotageDeleteIgnoresIndeg = FALSE
    SabotageAdoptBeforeCommit = FALSE
    SabotageCleanupIgnoresCursor = FALSE
    PlanOnly = FALSE
    SabotageAdapterMints = FALSE
INVARIANT TypeOK
INVARIANT NoAckedLoss
INVARIANT NoMissedFold
INVARIANT ExactlyOnce
INVARIANT LosingCommitAdoptsNothing
INVARIANT HoldSuppresses
