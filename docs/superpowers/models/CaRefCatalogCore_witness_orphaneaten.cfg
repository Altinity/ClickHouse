\* WITNESS for `_sab_reconcilestaletoken`, negated so that a VIOLATION is the evidence. Identical
\* settings; the only invariant is
\*
\*     WITNESS_ORPHAN_EATEN == ~orphanDataEaten
\*
\* so RED means TLC found a behaviour in which the janitor actually DELETED a running life's
\* `_log`/`_snap` DATA — the severe consequence of losing the catalog entry, as opposed to the orphan
\* merely writing unattributable bytes. The ghost requires `i \in objects` and not merely
\* `i \in objects \cup ckptOf`: eating an orphan's `_ckpt` is bad, but eating its data is the loss
\* this witness claims, and the witness that claims data loss has to be the one that observed it.
\* (Fix round 1 strengthened it — before, the ghost also fired on a `_ckpt`-only deletion and the
\* committed trace did not show the data loss the narrative described.)
\*
\* The distinction matters because the janitor is behaving CORRECTLY in that trace: its rule is
\* "delete every incarnation the catalog does not name", and a reconciliation that was neither
\* token-exact nor fence-terminal is what handed it a live namespace to apply that rule to.
\* `_sab_reconcilestaletoken`'s own counterexample stops at `OrphanWrite`, one step sooner.
\*
\* Trace (verified, 8 states): `Create`, `CkptCreate`, `ReconcileObserve`, `GoLive`, `WriteObject`
\* (so the namespace is `Live` with `objects = {1}`, `ckptOf = {1}`), `ReconcileCreating` on the now
\* stale sample, `Janitor` — which takes the data and the `_ckpt` together.
SPECIFICATION Spec
CONSTANTS
    MaxInc = 3
    SabotageJanitorEatsNewborn = FALSE
    SabotageZombieGoLive = FALSE
    SabotageReconcileLiveCreator = FALSE
    SabotageReconcileStaleToken = TRUE
    SabotageSameIncarnationRebirth = FALSE
    SabotageFloorRetainsDeadName = FALSE
    SabotageDeleteWithoutEvidence = FALSE
    SabotageDeleteWithForeignEvidence = FALSE
    SabotageDeleteUnderHold = FALSE
    SabotageDeleteWithoutExactObservation = FALSE
INVARIANT TypeOK
INVARIANT WITNESS_ORPHAN_EATEN
