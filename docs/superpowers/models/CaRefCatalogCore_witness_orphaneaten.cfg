\* WITNESS for `_sab_reconcilestaletoken`, negated so that a VIOLATION is the evidence. Identical
\* settings; the only invariant is
\*
\*     WITNESS_ORPHAN_EATEN == ~orphanEaten
\*
\* so RED means TLC found a behaviour in which the janitor actually DELETED a running life's bytes —
\* the severe consequence of losing the catalog entry, as opposed to the orphan merely writing
\* unattributable ones. The distinction matters because the janitor is behaving CORRECTLY in that
\* trace: its rule is "delete every incarnation the catalog does not name", and a reconciliation that
\* was neither token-exact nor fence-terminal is what handed it a live namespace to apply that rule
\* to. `_sab_reconcilestaletoken`'s own counterexample stops at `OrphanWrite`, one step sooner.
SPECIFICATION Spec
CONSTANTS
    MaxInc = 3
    SabotageJanitorEatsNewborn = FALSE
    SabotageReconcileLiveCreator = FALSE
    SabotageReconcileStaleToken = TRUE
    SabotageEntryBeforeCkptDelete = FALSE
    SabotageSameIncarnationRebirth = FALSE
    SabotageFloorRetainsDeadName = FALSE
INVARIANT TypeOK
INVARIANT WITNESS_ORPHAN_EATEN
