\* Sabotage: the pending exact-token delete skips its in-degree re-check and trusts the count taken
\* at condemnation time. This is the SECOND half of spec §5's temporal lemma (r9-2 variant (a)),
\* and the model shows the first half alone is not enough: an acked `+1` that lands AFTER its
\* namespace's frontier probe but BEFORE condemnation is invisible to that round (so in-degree
\* reaches zero and the blob is condemned) and is folded normally by the NEXT round (so in-degree
\* is back above zero when the delete runs). Writer-side rematerialization does not apply — the
\* blob was live when the writer added its ref. Only re-reading in-degree at the delete site stops
\* it. Must be RED on NoAckedLoss.
SPECIFICATION Spec
CONSTANTS
    T1 = t1
    T2 = t2
    MaxSeq = 3
    EdgeOf <- EdgeRoles
    HintSilent = FALSE
    HintComplete = FALSE
    CkptWitness = FALSE
    EnableHiddenHole = FALSE
    SabotageSkipQuietProbe = FALSE
    SabotageRebuildDropsHold = FALSE
    SabotageClearHoldOnAbsent = FALSE
    SabotageDestroyUnderHold = FALSE
    SabotageDeleteIgnoresIndeg = TRUE
    SabotageAdoptBeforeCommit = FALSE
    SabotageCleanupIgnoresCursor = FALSE
INVARIANT TypeOK
INVARIANT NoAckedLoss
INVARIANT NoMissedFold
INVARIANT ExactlyOnce
INVARIANT LosingCommitAdoptsNothing
INVARIANT HoldSuppresses
