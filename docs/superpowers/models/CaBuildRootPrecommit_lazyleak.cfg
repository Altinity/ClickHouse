\* B199-S2 LEAK reproduction (NON-VACUITY of INV_NO_LEAK): the OLD lazy path (InlineClosure=FALSE)
\* records an EMPTY closure when the manifest tree object is gone before fold, so the build's blobs
\* are never snapped and GC can never reclaim them. INV_NO_LEAK (liveness) is VIOLATED here -- this
\* proves the property is non-trivial and that the inline-closure fix is load-bearing. Run under the
\* fair spec. (Safety invariants still hold even while the space leaks; loss != leak.)
SPECIFICATION FairSpec
CONSTANTS
    Builds = {bld1, bld2}
    Trees = {t1, t2}
    Blobs = {b1}
    UseBuildRoot = TRUE
    FailClosedCommit = TRUE
    InlineClosure = FALSE
    BuildTree = t2
    UniqueToBuildTree = {}
CONSTRAINT StateConstraint
INVARIANT TypeOK
INVARIANT INV_NO_DANGLE_COMMITTED
INVARIANT INV_BUILDROOT_PROTECTS
INVARIANT INV_COMMIT_FAILCLOSED
INVARIANT INV_NO_RETURN
PROPERTY INV_NO_LEAK
CHECK_DEADLOCK FALSE
