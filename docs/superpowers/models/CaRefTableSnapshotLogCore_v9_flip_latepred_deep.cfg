\* Deeper bound (MaxSeq = 5) of CaRefTableSnapshotLogCore_v9_flip_latepred.cfg — same protocol, same
\* invariants, one more id in the timeline so a history can outlive a seal and a second mount
\* can walk across it. ~41 s, 32,925,718 distinct states. Must be GREEN.
\*   INV-1  contiguity puts every straggler at the frontier (pendingSlot = MaxWritten + 1), so it can
\*          never land below a published snapshot at all;
\*   INV-2  at the frontier the slot-occupy CAS decides it — Occupied means adopt and replay
\*          (RAdoptStraggler), Created means the seal owns the slot and the PUT is refused forever.
\* Removing the occupancy (_sab_noseal) brings the rev.4 counterexample straight back, so this green
\* is earned, not vacuous.
SPECIFICATION Spec
CONSTANTS
    MaxSeq = 5
    MaxRestarts = 2
    LatePred = TRUE
    SabotageReuseAfterAmbiguous = FALSE
    SabotageGapOnFail = FALSE
    SabotageNoSeal = FALSE
    SabotageBlindPut = FALSE
    SabotageScanIsTruth = FALSE
    SabotageCleanupAboveCkpt = FALSE
    SabotageStaleCkptCorruption = FALSE
    SabotageSealClobbersBase = FALSE
    FrontierSlice = FALSE
    SabotageAckBeforeFrontier = FALSE
    SabotageAllocateBeforeFrontier = FALSE
    SabotageInstallAboveFrontier = FALSE
    SabotageStaleFrontier = FALSE
    SabotageSnapshotAboveFrontier = FALSE
    SabotageSealAboveFrontier = FALSE
INVARIANTS TypeOK INV_RECOVERY INV_NOFAIL INV_DENSE INV_NO_GHOST INV_NO_PHANTOM
