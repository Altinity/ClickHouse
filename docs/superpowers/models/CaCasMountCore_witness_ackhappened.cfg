\* 2026-07-28 v9 fix round 1 WITNESS (negated reachability -- TLC reporting `W_AckHappened`
\* VIOLATED is the evidence): an operation is ever ACKNOWLEDGED at all in the HONEST configuration.
\*
\* Why it exists (review Minor 5): `AckedOpsAreDurable` is a set inclusion, so it is trivially true
\* while `acked` is empty. Without this config, "the green gate actually acks something" rested only
\* on the `-coverage 1` table's `WedgeRetryCreate` row -- and the other two new properties each got a
\* dedicated `_witness_*`, so this one should not have been the exception. A property whose
\* non-vacuity is argued from a side channel is one refactor away from being vacuous silently.
\*
\* All sabotage flags OFF -- this is a property of the honest protocol. Bounds are the green gate's;
\* see `_v9_recoverygen.cfg` for why they are what they are.
SPECIFICATION Spec
CONSTANTS
    Actors = {A, B}
    None = NoneVal
    MaxClock = 2
    MaxEpoch = 2
    MaxToken = 4
    TTL = 2
    SabForeignTakeover = FALSE
    SabEpochReset = FALSE
    SabAdoptWedgeOnTouch = FALSE
    SabAdoptIgnoresFence = FALSE
    Drift = 0
    SabWallClockReclaim = FALSE
    SabEpochGuardOff = FALSE
    SabDecomBlindBypass = FALSE
    RecoveryGenOn = TRUE
    SabStaleInstall = FALSE
    SabWedgeRetryOldGen = FALSE
    SabSlotNoByteCompare = FALSE
    MaxAdmissions = 3
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT W_AckHappened
