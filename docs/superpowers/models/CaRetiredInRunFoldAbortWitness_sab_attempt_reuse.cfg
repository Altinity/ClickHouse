    MaxToken = 3
    MaxJournal = 5
    Sabotage = "attempt_reuse"
INVARIANT TypeOK
INVARIANT INV_NO_LOSS
INVARIANT INV_NO_RETURN
INVARIANT INV_COVERAGE
INVARIANT INV_ONE_PASS
