\* Sabotage: ref cleanup requires only snapshot coverage, not cursor coverage, so it may delete a
\* log the fold has never accounted. Under v9 the damage is not a lost delta — it is a manufactured
\* quiet namespace: deleting the top record makes the exact `GET cursor+1` answer absent, and the
\* frontier proof is granted over an acked `+1` that no longer exists to be walked. Must be RED.
SPECIFICATION Spec
CONSTANTS
    T1 = t1
    T2 = t2
    MaxSeq = 3
    EdgeOf <- EdgeRoles
    HintSilent = FALSE
    HintComplete = FALSE
    CkptWitness = FALSE
    EnableHiddenHole = FALSE
    SabotageSkipQuietProbe = FALSE
    SabotageRebuildDropsHold = FALSE
    SabotageClearHoldOnAbsent = FALSE
    SabotageDestroyUnderHold = FALSE
    SabotageDeleteIgnoresIndeg = FALSE
    SabotageAdoptBeforeCommit = FALSE
    SabotageCleanupIgnoresCursor = TRUE
    PlanOnly = FALSE
    SabotageAdapterMints = FALSE
INVARIANT TypeOK
INVARIANT NoAckedLoss
INVARIANT NoMissedFold
INVARIANT ExactlyOnce
INVARIANT LosingCommitAdoptsNothing
INVARIANT HoldSuppresses
