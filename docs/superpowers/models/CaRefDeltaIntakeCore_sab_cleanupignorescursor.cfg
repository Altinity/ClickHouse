\* Historical cleanup sabotage, now a Task 5b GREEN control. Deleting a checkpoint-covered log above
\* the fold cursor creates a committed gap; exact CTE detects it and holds instead of treating the
\* namespace as quiet. The cleanup rule is still required for evidence retention, but this class no
\* longer reaches pool-wide data loss through LIST omission.
SPECIFICATION Spec
CONSTANTS
    T1 = t1
    T2 = t2
    MaxSeq = 2
    EdgeOf <- EdgeRoles
    HintSilent = FALSE
    HintComplete = FALSE
    EnableHiddenHole = FALSE
    SabotageRebuildDropsHold = FALSE
    SabotageClearHoldOnAbsent = FALSE
    SabotageDestroyUnderHold = FALSE
    SabotageDeleteIgnoresIndeg = FALSE
    SabotageAdoptBeforeCommit = FALSE
    SabotageCleanupIgnoresCursor = TRUE
    PlanOnly = FALSE
    SabotageAdapterMints = FALSE
    SabotageSkipCatalogTarget = FALSE
    SabotageSkipHeldRetry = FALSE
INVARIANT TypeOK
INVARIANT CteExact
INVARIANT RoundCteNoRegression
INVARIANT HoldReleaseRequiresFold
INVARIANT NoAckedLoss
INVARIANT NoMissedFold
INVARIANT ExactlyOnce
INVARIANT LosingCommitAdoptsNothing
INVARIANT HoldSuppresses
INVARIANT EveryCatalogTargetAttempted
INVARIANT EveryCarriedHoldRetried
