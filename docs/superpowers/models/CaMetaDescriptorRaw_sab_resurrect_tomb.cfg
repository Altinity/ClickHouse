\* Gate B raw-body v2 (sab_resurrect_tomb): the C2 raw-body bug — a writer un-tombstones (tombstone->clean)
\* while GC has committed to deleting the body. Under raw immutable bodies the resurrect cannot protect the
\* body (token unchanged), so GC's committed delete dangles the fresh ref. MUST violate INV_NO_LOSS (and
\* INV_NO_DANGLE once the body is deleted). Proves terminal-tombstone is load-bearing.
SPECIFICATION Spec
CONSTANTS
    MaxGen = 6
    Writers = {w1, w2}
    SabBlindAdopt = FALSE
    SabAdoptOverTombstone = FALSE
    SabDeleteBodyNoTombstone = FALSE
    SabMetaBeforeBody = FALSE
    SabResurrectFromTombstone = TRUE
INVARIANT TypeOK
INVARIANT INV_NO_DANGLE
INVARIANT INV_META_BODY
INVARIANT INV_NO_LOSS
INVARIANT INV_NO_RETURN
