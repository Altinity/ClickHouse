    Leaders = {L1, L2}
    Trees = {t1}
    Blobs = {b1}
    MaxGen = 3
    MaxLog = 4
    EnableSplitExpand = FALSE
    EnableInBuildStrip = FALSE
    EnableLeaseSteal = FALSE
    EnableAdopt = FALSE
CONSTRAINT StateConstraint
INVARIANT TypeOK
INVARIANT INV_MARKER_EDGES
INVARIANT INV_NO_LOSS
INVARIANT INV_NO_DANGLE
