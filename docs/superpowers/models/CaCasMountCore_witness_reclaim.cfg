\* LIVENESS WITNESS: assert W_SameUuidReclaimsExpired as an INVARIANT so TLC
\* reports it VIOLATED -> the "actor reclaims its own expired mount" state is reachable.
SPECIFICATION Spec
CONSTANTS
    Actors = {A, B}
    None = NoneVal
    MaxClock = 4
    MaxEpoch = 3
    MaxToken = 7
    TTL = 2
    SabForeignTakeover = FALSE
    SabEpochReset = FALSE
    SabAdoptWedgeOnTouch = FALSE
    SabAdoptIgnoresFence = FALSE
    Drift = 0
    SabWallClockReclaim = FALSE
    SabEpochGuardOff = FALSE
    SabDecomBlindBypass = FALSE
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT W_SameUuidReclaimsExpired
