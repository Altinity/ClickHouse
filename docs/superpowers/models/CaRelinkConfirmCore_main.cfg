\* HONEST GATE (positive): every confirm rule intact.
\* MaxHoles = 0 ASSUMES the paginated LIST returns every durable record above the
\* cursor.  That assumption is NOT established by the shipped code -- see
\* CaRelinkConfirmCore_sab_holeylist.cfg and BACKLOG {#list-as-journal-dataloss-2026-07-25}.
\* Under it, the publish-then-confirm protocol must hold.  TLC MUST report no error.
SPECIFICATION Spec
CONSTANTS
    Receivers = {r1}
    MaxId = 5
    MaxRound = 5
    MaxHoles = 0
    SabotageNoGate1 = FALSE
    SabotageStaleCache = FALSE
    SabotageTouchBlind = FALSE
    SabotageNoPoison = FALSE
    SabotageNoFence = FALSE
    SabotagePublishAfterConfirm = FALSE
INVARIANTS
    TypeOK
    GraduationIsPhased
    ConfirmedRelinkNeverDangles
    PromotedNeverDangles
CHECK_DEADLOCK FALSE
