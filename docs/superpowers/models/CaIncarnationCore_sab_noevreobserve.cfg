\* NEGATIVE CONTROL: the publish gate admits STALE tokenless evidence (recorded under an older
\* view) without re-observation — the Task-9 dangle. With retired entries dropping on confirmed
\* outcomes (reval mode), a child retired AND deleted after the evidence was recorded leaves no
\* retire hit at the refreshed view; admitting the stale evidence publishes a tree over the absent
\* child. MUST violate INV_NO_LOSS (same bounds as stage6_evstale).
SPECIFICATION Spec
CONSTANTS
    Writers = {w1}
    Leaders = {L1}
    Shards = {s1}
    Hashes = {t1, h1, h2}
    TreeHashes = {t1}
    MaxToken = 2
    MaxRound = 2
    MaxLog = 5
    EnableResurrect = TRUE
    EnableTrees = TRUE
    EnableDebris = FALSE
    EnableSplit = FALSE
    EnableOverwrite = FALSE
    SabotageNoFence = FALSE
    SabotageNoRecheckFold = FALSE
    SabotageNoRetireView = FALSE
    SabotageUncondDelete = FALSE
    SabotageReusedTag = FALSE
    SabotageCascadeRace = FALSE
    SabotageCutOverclaim = FALSE
    EnableReval = TRUE
    SabotageNoReobserve = FALSE
    EnableRegistry = FALSE
    EnableEvStale = TRUE
    SabotageNoRegistry = FALSE
    SabotageFoldTimeUniverse = FALSE
    SabotageNoEvReobserve = TRUE
CONSTRAINT StateConstraint
INVARIANT INV_NO_LOSS
