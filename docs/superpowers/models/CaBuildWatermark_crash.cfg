\* Crash before any publish -> the orphaned in-flight blob is reclaimed (frozen-seq detection). NoLeak
\* HOLDS. (Liveness is intentionally NOT required here: a crashed server's builds cannot all publish.)
SPECIFICATION Spec
CONSTANTS
  Builds = {b1, b2, b3}
  NoOwner = NoOwner
  WatermarkGuard = TRUE
  SoundDetection = TRUE
  ActiveSetCorrect = TRUE
  CanCrash = TRUE
INVARIANT TypeOK
INVARIANT Inv_ProtectedNeverCondemned
INVARIANT Inv_NoDangle
PROPERTY NoLeak
CHECK_DEADLOCK FALSE
