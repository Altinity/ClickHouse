\* S1: retire a Failed build before its exact precommit removal is durable -> INV_RETIRE_AFTER_REMOVAL
\* MUST be violated (the precommit is stuck forever: RemoveFailedPrecommit is gated on
\* buildState = "Failed", which is no longer true once Retired).
SPECIFICATION Spec
CONSTANTS
    Builds = {b1, b2, b3}
    MaxEpoch = 2
    SabotageRetireBeforeRemoval = TRUE
    SabotageRetireUncertain = FALSE
    SabotageSuccessorRemovesCurrentEpoch = FALSE
    SabotageCancelBeforeRemovalDurable = FALSE
INVARIANTS
    INV_RETIRE_AFTER_REMOVAL
