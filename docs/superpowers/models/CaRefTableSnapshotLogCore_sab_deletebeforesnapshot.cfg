\* Sabotage: cleanup deletes a ref log with no present covering snapshot (before snapshot X is
\* durable). A reader misses that log and reconstructs a wrong state. Must be RED (INV_RECOVERY).
SPECIFICATION Spec
CONSTANTS
    MaxSeq = 4
    MaxRestarts = 2
    SabotageDeleteBeforeSnapshot = TRUE
    SabotageVanishIsCorruption = FALSE
    SabotageRecreateBeforeCompleted = FALSE
    LatePred = FALSE
INVARIANT TypeOK
INVARIANT INV_RECOVERY
INVARIANT INV_NOFAIL
INVARIANT INV_RECREATE
