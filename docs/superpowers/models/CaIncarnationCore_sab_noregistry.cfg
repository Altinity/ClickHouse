\* NEGATIVE CONTROL: writers skip W-REGISTER — publishes land in UNREGISTERED namespaces with no
\* registration floor. GC's universe (the registry) never sees those namespaces: their shards are
\* never fenced and never folded by the recheck, so a stale-view publish can re-reference a
\* condemned hash past the recheck and the exact-token delete dangles it. MUST violate
\* INV_NO_DANGLE (same bounds as stage6_registry).
SPECIFICATION Spec
CONSTANTS
    Writers = {w1}
    Leaders = {L1}
    Shards = {s1, s2}
    Hashes = {h1}
    TreeHashes = {}
    MaxToken = 3
    MaxRound = 2
    MaxLog = 4
    EnableResurrect = TRUE
    EnableTrees = FALSE
    EnableDebris = FALSE
    EnableSplit = FALSE
    EnableOverwrite = FALSE
    SabotageNoFence = FALSE
    SabotageNoRecheckFold = FALSE
    SabotageNoRetireView = FALSE
    SabotageUncondDelete = FALSE
    SabotageReusedTag = FALSE
    SabotageCascadeRace = FALSE
    SabotageCutOverclaim = FALSE
    EnableReval = TRUE
    SabotageNoReobserve = FALSE
    EnableRegistry = TRUE
    EnableEvStale = FALSE
    SabotageNoRegistry = TRUE
    SabotageFoldTimeUniverse = FALSE
    SabotageNoEvReobserve = FALSE
CONSTRAINT StateConstraint
INVARIANT INV_NO_DANGLE
