\* Sabotage (INV-4): ref-log cleanup drops the `L <= ckpt.base` gate and deletes a log the
\* checkpoint does not cover. Recovery's arithmetic walk reads a 404 at a DURABLE id under an
\* unchanged `_ckpt` token, cannot tell it from the frontier, seals there and installs a truncated
\* state.
\* Must be RED on INV_RECOVERY.
SPECIFICATION Spec
CONSTANTS
    MaxSeq = 4
    MaxRestarts = 2
    LatePred = FALSE
    SabotageReuseAfterAmbiguous = FALSE
    SabotageGapOnFail = FALSE
    SabotageNoSeal = FALSE
    SabotageBlindPut = FALSE
    SabotageScanIsTruth = FALSE
    SabotageCleanupAboveCkpt = TRUE
    SabotageStaleCkptCorruption = FALSE
    SabotageSealClobbersBase = FALSE
INVARIANTS TypeOK INV_RECOVERY INV_NOFAIL INV_DENSE INV_NO_GHOST INV_NO_PHANTOM
