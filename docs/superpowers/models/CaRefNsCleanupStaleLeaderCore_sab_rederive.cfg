\* Sabotage: a resumed perpetual-janitor delete resolves the current logical name instead of using the
\* physical life id deposited by its LIST page. Rebirth still mints a fresh id. Once the name is live
\* again, re-derivation targets that live id directly. Must violate NoLiveDataDeleted.
SPECIFICATION Spec
CONSTANTS
    MaxInc = 2
    SabotageNoIncarnation = FALSE
    SabotageRederive = TRUE
INVARIANT TypeOK
INVARIANT NominationCapturedPhysicalId
INVARIANT NoLiveDataDeleted
