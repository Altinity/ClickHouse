\* Sabotage (spec 2026-07-27-cas-ref-chain-complete-cut-design.md §3, added by this task's review --
\* commit d1eae033122: "the namespace-cleanup item carries the incarnation captured at deposition,
\* and a resumed pass NEVER re-derives it from the catalog"): the resumed pass resolves ITS OWN
\* target from the CURRENT `entry.inc` instead of the value deposited with the item. Recreation still
\* mints a fresh incarnation honestly (SabotageNoIncarnation = FALSE) -- reuse is not needed for this
\* route. Once the namespace is reborn, "the current incarnation" simply IS the live one, and the
\* pass deletes it directly. Must violate NoLiveDataDeleted. RED: the model-level proof that
\* deposit-time capture, independently of incarnation freshness, is load-bearing.
SPECIFICATION Spec
CONSTANTS
    MaxInc = 2
    SabotageNoIncarnation = FALSE
    SabotageRederive = TRUE
INVARIANT TypeOK
INVARIANT CaptureHasEvidence
INVARIANT NoLiveDataDeleted
