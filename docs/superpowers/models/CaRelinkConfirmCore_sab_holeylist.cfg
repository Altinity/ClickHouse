\* *** NOT A SABOTAGE OF THE CONFIRM PROTOCOL. ***  Every confirm rule is intact here.  What is
\* removed is the ASSUMPTION that GC's paginated LIST returns every durable record above the fold
\* cursor -- i.e. this is the shipped discovery mechanism modelled honestly
\* (BACKLOG {#list-as-journal-dataloss-2026-07-25}).  MaxHoles = 1: exactly ONE round in the whole
\* behaviour may return an incomplete page; every other round is perfectly complete.  That budget
\* is deliberate -- it rules out "GC was merely lazy" traces, so the counterexample must go through
\* the PERMANENT skip (the omitted record sinks below its namespace cursor).  TLC MUST report a
\* ConfirmedRelinkNeverDangles counterexample: a hole that swallows the receiver's +1 on a
\* DEDUPLICATED blob, while a later same-namespace record advances the cursor past it, lets GC
\* see zero edges and delete a blob the confirmed, promoted manifest still references.
\* The confirm protocol cannot repair this; it is an independent release-blocker.
SPECIFICATION Spec
CONSTANTS
    Receivers = {r1}
    MaxId = 5
    MaxRound = 5
    MaxHoles = 1
    SabotageNoGate1 = FALSE
    SabotageStaleCache = FALSE
    SabotageNoPoison = FALSE
    SabotageNoFence = FALSE
    SabotagePublishAfterConfirm = FALSE
INVARIANTS
    ConfirmedRelinkNeverDangles
CHECK_DEADLOCK FALSE
