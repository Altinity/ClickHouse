\* Adversarial config (spec §late-predecessor-put, documented open limitation): an old-epoch id
\* (T1's LateId=2) that never became durable during this process's recovery becomes durable only
\* after the cursor has already advanced past it. NoMissedFold (I1) MUST be violated here -- this
\* is the known counterexample retained as documentation, not a bug in this model. Expected-fail:
\* the runner treats a violation on this config as PASS.
SPECIFICATION Spec
CONSTANTS
    T1 = t1
    T2 = t2
    MaxSeq = 4
    SabotageResumeSkip = FALSE
    SabotageAdoptBeforeCommit = FALSE
    SabotageCleanupIgnoresCursor = FALSE
    EnableLatePredecessorPut = TRUE
INVARIANT TypeOK
INVARIANT NoMissedFold
INVARIANT ExactlyOnce
INVARIANT LosingCommitAdoptsNothing
