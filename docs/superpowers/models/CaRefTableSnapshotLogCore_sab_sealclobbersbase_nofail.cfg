\* Same sabotage as `_sab_sealclobbersbase` (the sealer skips INV-4's semantic-max merge), narrowed
\* to the SECOND consequence: the regressed base still names a real snapshot id, but one that
\* snapshot-cleanup already deleted while the base was higher — deletion is gated strictly below the
\* CURRENT base, which the regressed pointer no longer names. The next mount samples it, the
\* exact-key GET 404s, the `_ckpt` reread shows an unchanged token, and the three-way revalidation
\* is obliged to declare corruption.
\*
\* Narrowed on purpose: with the full invariant list, INV_RECOVERY breaks first and shallower (see
\* `_sab_sealclobbersbase`), which would leave this branch — the one the merge obligation was
\* written for — unproven.
\* Must be RED on INV_NOFAIL.
SPECIFICATION Spec
CONSTANTS
    MaxSeq = 4
    MaxRestarts = 2
    LatePred = FALSE
    SabotageReuseAfterAmbiguous = FALSE
    SabotageGapOnFail = FALSE
    SabotageNoSeal = FALSE
    SabotageBlindPut = FALSE
    SabotageScanIsTruth = FALSE
    SabotageCleanupAboveCkpt = FALSE
    SabotageStaleCkptCorruption = FALSE
    SabotageSealClobbersBase = TRUE
INVARIANTS TypeOK INV_NOFAIL
