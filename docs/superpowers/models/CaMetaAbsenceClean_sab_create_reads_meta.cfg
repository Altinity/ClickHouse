\* §5 gate (sabotage): the fresh-create path reads meta and, meeting a tombstone, clears
\* it (meta-first) as "birth cleanup" -- a recycled hash born under a stale tombstone.
\* Absence lands while the old body + its queued exact-token delete are dying.
\* MUST violate INV_ABSENCE_NO_QUEUED_DELETE.
SPECIFICATION Spec
CONSTANTS
    MaxGen = 8
    SabResurrectMetaFirst = FALSE
    SabGcDeleteMetaFirst = FALSE
    SabAdoptOverTombstone = FALSE
    SabCreateReadsMeta = TRUE
INVARIANT TypeOK
INVARIANT INV_ABSENCE_NO_QUEUED_DELETE
INVARIANT INV_NO_DANGLE
INVARIANT INV_NO_LOSS
INVARIANT INV_META_BODY
