\* Total hint omission: the LIST returns NOTHING, ever. This replaces rev.4's `_sab_resumeskip`,
\* whose subject was pagination honesty. Under v9 the hint is consumed nowhere for correctness, so
\* the strongest possible omission is not a sabotage at all — it is a GREEN configuration, and the
\* proof that "resume-after-returned-key" is no longer load-bearing. Must be GREEN.
SPECIFICATION Spec
CONSTANTS
    T1 = t1
    T2 = t2
    MaxSeq = 3
    EdgeOf <- EdgeRoles
    HintSilent = TRUE
    HintComplete = FALSE
    CkptWitness = FALSE
    EnableHiddenHole = FALSE
    SabotageSkipQuietProbe = FALSE
    SabotageRebuildDropsHold = FALSE
    SabotageClearHoldOnAbsent = FALSE
    SabotageDestroyUnderHold = FALSE
    SabotageDeleteIgnoresIndeg = FALSE
    SabotageAdoptBeforeCommit = FALSE
    SabotageCleanupIgnoresCursor = FALSE
INVARIANT TypeOK
INVARIANT NoMissedFold
INVARIANT ExactlyOnce
INVARIANT LosingCommitAdoptsNothing
INVARIANT NoAckedLoss
INVARIANT HoldSuppresses
