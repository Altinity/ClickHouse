\* SABOTAGE: a non-owner auto-takes-over an expired mount.
\* MUST violate ForeignUuidNeverAutoTakesOver.
\*
\* 2026-07-24 fence-not-rescue gate (spec rev.4): `WriterEpochMonotoneUnique` DROPPED --
\* `WipeEpoch` alone (unrelated to this cfg's own `SabForeignTakeover` sabotage) already trips
\* its raw-`epoch` ceiling conjunct at a shallower depth than the intended
\* `ForeignUuidNeverAutoTakesOver` violation, masking the actual target this cfg exists to
\* demonstrate (confirmed empirically: an earlier run WITH the invariant listed reported
\* `WriterEpochMonotoneUnique` violated instead). Same accepted, unrelated residual-hole false
\* alarm documented in `CaCasMountCore_stage1.cfg`'s own comment.
SPECIFICATION Spec
CONSTANTS
    Actors = {A, B}
    None = NoneVal
    MaxClock = 4
    MaxEpoch = 3
    MaxToken = 7
    TTL = 2
    SabForeignTakeover = TRUE
    SabEpochReset = FALSE
    SabAdoptWedgeOnTouch = FALSE
    SabAdoptIgnoresFence = FALSE
    Drift = 0
    SabWallClockReclaim = FALSE
    SabEpochGuardOff = FALSE
    SabDecomBlindBypass = FALSE
    RecoveryGenOn = FALSE          \* 2026-07-28 v9: the recovery-generation layer is INERT here --
                                   \* this cfg predates it and its state space is therefore
                                   \* unchanged (see CaCasMountCore_RESULTS.md's before/after table)
    SabStaleInstall = FALSE
    SabWedgeRetryOldGen = FALSE
    SabSlotNoByteCompare = FALSE
    MaxAdmissions = 0          \* the layer is off here; the bound is only
                            \* declared because TLC requires every constant
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT NoTwoServerUuidsOwnSameServerRoot
INVARIANT ForeignUuidNeverAutoTakesOver
INVARIANT SupersededWriterMakesNoMutation
