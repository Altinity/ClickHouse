\* Sabotage (C1): a self-remount keeps stamping FRESH appends at the OLD, now-below-durable epoch from a
\* stale cache -- a durable log materializes below a snapshot frozen before it existed, so recovery
\* through that snapshot reconstructs a state missing it. Must be RED (INV_RECOVERY). The FIX routes
\* `allocateRefTxnId` through the fresh `live_writer_epoch` (a remount append always sorts strictly above
\* the frontier) and re-recovers the dropped cache, so the safe config stays GREEN. Distinct from
\* `_latepred`, which is an in-flight external straggler the epoch bump cannot cancel (accepted limitation).
SPECIFICATION Spec
CONSTANTS
    MaxSeq = 4
    MaxRestarts = 2
    SabotageDeleteBeforeSnapshot = FALSE
    SabotageVanishIsCorruption = FALSE
    SabotageRecreateBeforeCompleted = FALSE
    SabotageRemountKeepsOldEpoch = TRUE
    LatePred = FALSE
INVARIANT TypeOK
INVARIANT INV_RECOVERY
INVARIANT INV_NOFAIL
INVARIANT INV_RECREATE
