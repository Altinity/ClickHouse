\* 2026-07-28 v9 SABOTAGE (spec 2026-07-27-cas-ref-chain-complete-cut-design.md §2 INV-2's
\* `slot-occupy` resolution; plan task 1's FIRST hand-off -- task-1 report concern 1 and
\* `CaRefTableSnapshotLogCore_RESULTS.md` Scoping): `SabSlotNoByteCompare = TRUE` makes
\* `WedgeRetryOccupied` skip the byte comparison, so a lane acks its own operation on ANY `Occupied`
\* result rather than only when the bytes at the key are its own.
\*
\* TARGET INVARIANT: `AckedOpsAreDurable` -- the ONE invariant this round adds, and the only place a
\* new one was needed. The existing invariants cannot express this damage: `wrote`,
\* `supersededThenWrote` and `lostThenWrote` all record what a writer DID, never what its caller was
\* TOLD, and acked-then-lost is precisely a divergence between the two. It is also the direction
\* `CaRefTableSnapshotLogCore` structurally cannot reach -- that module grants the writer perfect
\* knowledge of `writtenEver`, so its `INV_NO_PHANTOM` only covers the opposite case (a write
\* reported as FAILED becoming durable). This cfg is the hand-off discharged.
\*
\* THE COUNTEREXAMPLE, depth 12: `ClaimOwnerEmpty -> ClaimMount -> Tick -> WedgeAdmit ->
\* WedgeRetryCreate` leaves the key holding the bytes of operation `<< A, 0 >>`
\* (`durable = acked = {<<A,0>>}`) `-> Tick -> ClearExpiredMount -> AllocEpoch` (generation 1)
\* `-> ClaimMount -> WedgeAdmit` (a NEW operation, `<< A, 1 >>`) `-> WedgeRetryOccupied`. That retry
\* finds the key `Occupied`; with the comparison skipped it concludes "mine landed" and acks
\* `<< A, 1 >>` while `durable` still holds only `<< A, 0 >>`. The caller has been told an operation
\* succeeded that nothing ever wrote. (`StragglerLands` -- the `Late Predecessor PUT` -- is the other
\* route to foreign bytes at the key; BFS reaches the successful create first.) Full narration in
\* `CaCasMountCore_RESULTS.md` `{#v9-traces}`.
\*
\* "Someone else's bytes" is a DIFFERENT INCARNATION of the same uuid, not a second physical
\* identity: this module's actors ARE server uuids and only the sticky owner can ever hold the slot,
\* so incarnations distinguished by generation are its established idiom for two writers (the same
\* substitution `_sab_epochwipelive.cfg` documents). The operation identity is
\* `<< actor, generation >>`, so a different generation IS different bytes.
\*
\* Only `TypeOK` and the target are listed (this module's sabotage-cfg convention).
\*
\* BOUNDS: MaxClock = 2, MaxEpoch = 2, MaxToken = 4, TTL = 2, Drift = 0, MaxAdmissions = 3 -- the
\* SAME bounds as the green gate `_v9_recoverygen.cfg`, which is where they are explained (that
\* config is exhaustive only at these). The reds and the green must share bounds or the pair carries
\* no evidence. This counterexample was FIRST found at `_stage1`'s wider bounds and still fires here.
