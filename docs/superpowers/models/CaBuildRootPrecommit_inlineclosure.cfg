\* B199-S2 inline-closure FIX: the precommit records its closure inline, GC seeds + reclaims from
\* it. INV_NO_LEAK (liveness) HOLDS: an abandoned build's closure is always drained. Run under the
\* fair spec. Safety invariants are also checked here.
SPECIFICATION FairSpec
CONSTANTS
    Builds = {bld1, bld2}
    Trees = {t1, t2}
    Blobs = {b1}
    UseBuildRoot = TRUE
    FailClosedCommit = TRUE
    InlineClosure = TRUE
    BuildTree = t2
    UniqueToBuildTree = {}
CONSTRAINT StateConstraint
INVARIANT TypeOK
INVARIANT INV_NO_DANGLE_COMMITTED
INVARIANT INV_BUILDROOT_PROTECTS
INVARIANT INV_COMMIT_FAILCLOSED
INVARIANT INV_NO_RETURN
PROPERTY INV_NO_LEAK
CHECK_DEADLOCK FALSE
