\* THE USER'S SCENARIO: create/drop per second. MaxInc = 3 admits three full create -> drop ->
\* recreate cycles of the one name, with best-effort cleanup free to leave a remnant behind on every
\* one of them and a lazy janitor free to never collect any of it.
\*
\* Green is the claim of INV-3 that §10 rejected `seq_floor` for: the catalog holds a record exactly
\* while the name is `Creating`/`Live`/`Removing` and none after, no matter how much debris the pool
\* has accumulated, because incarnation-scoped inertness lets `EntryDelete` skip the physical-empty
\* proof. Its red controls are `_sab_floorretainsdeadname` (a design that keeps dead-name records)
\* and `_sab_sameincarnationrebirth` (the debris stops being inert). Non-vacuity — that the three
\* cycles actually COMPLETE, and complete with debris outstanding — is `_witness_churn3`.
