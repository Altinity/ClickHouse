\* rev.6 honest protocol (spec 2026-07-13-cas-ref-lease-exclusivity-rev6-design.md): deliveries only
\* pre-coverage (T_mat honored) -- LatePred = FALSE means no under-snapshot delivery can occur, so
\* droppedEver stays empty and WStateRev6 = WState. Must be GREEN on every invariant, including the
\* rev.6 oracle-match invariants.
SPECIFICATION Spec
CONSTANTS
    MaxSeq = 4
    MaxRestarts = 2
    SabotageDeleteBeforeSnapshot = FALSE
    SabotageVanishIsCorruption = FALSE
    SabotageRecreateBeforeCompleted = FALSE
    SabotageRemountKeepsOldEpoch = FALSE
    LatePred = FALSE
    Rev6MountRule = TRUE
INVARIANTS TypeOK INV_RECOVERY INV_NOFAIL INV_RECREATE NoDivergentFold INV_SNAP_DETERMINISTIC INV_FRESH_READER
