\* Sabotage: forced REBUILD forgets a committed-gap hold instead of carrying it verbatim. Exact CTE
\* would re-detect the gap next round, but releasing the durable fact before fold/adoption is itself a
\* contract violation. Must be RED on `HoldReleaseRequiresFold`.
SPECIFICATION Spec
CONSTANTS
    T1 = t1
    T2 = t2
    MaxSeq = 2
    EdgeOf <- EdgeRoles
    HintSilent = FALSE
    HintComplete = FALSE
    EnableHiddenHole = TRUE
    SabotageRebuildDropsHold = TRUE
    SabotageClearHoldOnAbsent = FALSE
    SabotageDestroyUnderHold = FALSE
    SabotageDeleteIgnoresIndeg = FALSE
    SabotageAdoptBeforeCommit = FALSE
    SabotageCleanupIgnoresCursor = FALSE
    PlanOnly = FALSE
    SabotageAdapterMints = FALSE
    SabotageSkipCatalogTarget = FALSE
    SabotageSkipHeldRetry = FALSE
INVARIANT TypeOK
INVARIANT CteExact
INVARIANT RoundCteNoRegression
INVARIANT HoldReleaseRequiresFold
INVARIANT HoldSuppresses
INVARIANT EveryCatalogTargetAttempted
INVARIANT EveryCarriedHoldRetried
