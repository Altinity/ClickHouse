\* Sabotage: THE r8 BLOCKER. A forced REBUILD rebuilds cursors from catalog + `_ckpt` + arithmetic
\* tails and forgets the holds. The gap is still there, but the round that could see the witness has
\* passed; a later round reads the same 404 as an honest frontier and destroys. Spec §7 requires
\* REBUILD to carry every hold verbatim. Must be RED on HoldSuppresses.
\* Control: `_ctl_holdsuppresses`.
SPECIFICATION Spec
CONSTANTS
    T1 = t1
    T2 = t2
    MaxSeq = 3
    EdgeOf <- EdgeRoles
    HintSilent = FALSE
    HintComplete = FALSE
    CkptWitness = FALSE
    EnableHiddenHole = TRUE
    SabotageSkipQuietProbe = FALSE
    SabotageRebuildDropsHold = TRUE
    SabotageClearHoldOnAbsent = FALSE
    SabotageDestroyUnderHold = FALSE
    SabotageDeleteIgnoresIndeg = FALSE
    SabotageAdoptBeforeCommit = FALSE
    SabotageCleanupIgnoresCursor = FALSE
INVARIANT TypeOK
INVARIANT HoldSuppresses
