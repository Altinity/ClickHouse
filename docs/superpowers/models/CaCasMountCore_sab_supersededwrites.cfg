\* SABOTAGE: drop the epoch-match conjunct from Write so a superseded holder mutates.
\* MUST violate SupersededWriterMakesNoMutation.
SPECIFICATION Spec
CONSTANTS
    Actors = {A, B}
    None = NoneVal
    MaxClock = 4
    MaxEpoch = 3
    TTL = 2
    SabForeignTakeover = FALSE
    SabEpochReset = FALSE
    SabSupersededWrites = TRUE
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT NoTwoServerUuidsOwnSameServerRoot
INVARIANT ForeignUuidNeverAutoTakesOver
INVARIANT WriterEpochMonotoneUnique
INVARIANT SupersededWriterMakesNoMutation
