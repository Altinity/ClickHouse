\* Sabotage: an arbitrary input adapter inserts a `ref_lives` row after the catalog loop. The
\* key-set equality must be RED for a `Creating` id, proving all adapters share no insertion API.
SPECIFICATION Spec
CONSTANTS
    T1 = t1
    T2 = t2
    MaxSeq = 3
    EdgeOf <- EdgeRoles
    HintSilent = FALSE
    HintComplete = FALSE
    CkptWitness = FALSE
    EnableHiddenHole = FALSE
    SabotageSkipQuietProbe = FALSE
    SabotageRebuildDropsHold = FALSE
    SabotageClearHoldOnAbsent = FALSE
    SabotageDestroyUnderHold = FALSE
    SabotageDeleteIgnoresIndeg = FALSE
    SabotageAdoptBeforeCommit = FALSE
    SabotageCleanupIgnoresCursor = FALSE
    PlanOnly = TRUE
    SabotageAdapterMints = TRUE
INVARIANT TypeOK
INVARIANT PlanKeySetExact
INVARIANT RebuildPlanKeySetExact
