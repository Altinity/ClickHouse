\* B199-S2 inline-closure FIX with TWO blobs so "unique vs shared" is expressible:
\*   t1 :> {b1}      -- a committed table ref over the SHARED blob b1.
\*   t2 :> {b1, b2}  -- an abandoned precommit's manifest tree over the shared b1 PLUS a UNIQUE b2.
\* Expected: all safety invariants + INV_NO_LEAK HOLD. The shared blob b1 is spared (pinned by the
\* committed t1 -- INV_NO_DANGLE_COMMITTED); the abandoned build's unique blob b2 is reclaimed
\* (INV_NO_LEAK). Run under the fair spec.
SPECIFICATION FairSpec
CONSTANTS
    Builds = {bld1, bld2}
    Trees = {t1, t2}
    Blobs = {b1, b2}
    UseBuildRoot = TRUE
    FailClosedCommit = TRUE
    InlineClosure = TRUE
    BuildTree = t2
    UniqueToBuildTree = {b2}
CONSTRAINT StateConstraint
INVARIANT TypeOK
INVARIANT INV_NO_DANGLE_COMMITTED
INVARIANT INV_BUILDROOT_PROTECTS
INVARIANT INV_COMMIT_FAILCLOSED
INVARIANT INV_NO_RETURN
PROPERTY INV_NO_LEAK
CHECK_DEADLOCK FALSE
