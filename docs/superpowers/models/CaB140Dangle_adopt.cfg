\* B140-dangle CROSS-LEADER arm: in-build strip OFF, but byte-equal generation ADOPTION and
\* lease-steal ON. Isolates the hypothesized cross-generation mix (a marker-gen byte-equal-adopted
\* into a stripped-gen across leaders) as an INDEPENDENT producer of the dangle.
SPECIFICATION Spec
CONSTANTS
    Leaders = {L1, L2}
    Trees = {t1}
    Blobs = {b1}
    MaxGen = 3
    MaxLog = 4
    EnableSplitExpand = TRUE
    EnableInBuildStrip = FALSE
    EnableLeaseSteal = TRUE
    EnableAdopt = TRUE
CONSTRAINT StateConstraint
INVARIANT TypeOK
INVARIANT INV_BLOB_NOT_CONDEMNED
INVARIANT INV_NO_LOSS
