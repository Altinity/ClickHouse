\* Non-vacuity probe for the b2 config: confirms the "shared spared AND unique reclaimed" state is
\* actually REACHED (TLC reports W_SharedSparedUniqueReclaimed violated == reachable). Same constants
\* as CaBuildRootPrecommit_inlineclosure_b2.cfg; safety-only Spec (the witness is a reachability probe).
SPECIFICATION Spec
CONSTANTS
    Builds = {bld1, bld2}
    Trees = {t1, t2}
    Blobs = {b1, b2}
    UseBuildRoot = TRUE
    FailClosedCommit = TRUE
    InlineClosure = TRUE
    BuildTree = t2
    UniqueToBuildTree = {b2}
CONSTRAINT StateConstraint
INVARIANT W_SharedSparedUniqueReclaimed
