\* Sabotage (INV-2): recovery still CONCLUDES the frontier from the absent expected-next id, but
\* does not OCCUPY the slot — the rev.4 protocol. The drained lane's in-flight PUT then lands in a
\* slot a completed recovery already declared final, and the installed state is missing it. This is
\* the counterexample that _v9_flip_latepred turns green, so it is the proof that the flip is bought
\* by the seal and by nothing else.
\* Must be RED on INV_RECOVERY.
SPECIFICATION Spec
CONSTANTS
    MaxSeq = 4
    MaxRestarts = 2
    LatePred = TRUE
    SabotageReuseAfterAmbiguous = FALSE
    SabotageGapOnFail = FALSE
    SabotageNoSeal = TRUE
    SabotageBlindPut = FALSE
    SabotageScanIsTruth = FALSE
    SabotageCleanupAboveCkpt = FALSE
    SabotageStaleCkptCorruption = FALSE
    SabotageSealClobbersBase = FALSE
    FrontierSlice = FALSE
    SabotageAckBeforeFrontier = FALSE
    SabotageAllocateBeforeFrontier = FALSE
    SabotageInstallAboveFrontier = FALSE
    SabotageStaleFrontier = FALSE
    SabotageSnapshotAboveFrontier = FALSE
    SabotageSealAboveFrontier = FALSE
    SabotageSnapshotAtSeal = FALSE
INVARIANTS TypeOK INV_RECOVERY INV_NOFAIL INV_DENSE INV_NO_GHOST INV_NO_PHANTOM
