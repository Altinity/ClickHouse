\* SABOTAGE: build_seq NOT monotone (unique but out-of-order). A later, lower build_seq pulls min_active
\* back down and re-protects a finished build's condemned blob -> Inv_ProtectedNeverCondemned VIOLATED.
\* Proves monotone build-number allocation (a counter) is load-bearing, not just uniqueness.
SPECIFICATION Spec
CONSTANTS
  Servers = {s1, s2}
  NoneServer = NoneServer
  MaxSeq = 2
  MaxEpoch = 1
  ConfusedGuard = FALSE
  MonotonicSeq = FALSE
INVARIANT TypeOK
INVARIANT Inv_ProtectedNeverCondemned
INVARIANT Inv_NoDangle
CHECK_DEADLOCK FALSE
