\* Sabotage: the transition's no-durable-hold precondition is dropped -- a held namespace is
\* promoted anyway.
\*
\* Must be RED on INV_NO_ORPHANED_HOLD, and again the ghost fires at the row deletion. A hold clears
\* ONLY by folding through its offending position, and only a walkable row can be folded through; the
\* hold is also the one producer that forces an exact walk even when the listing omits the namespace,
\* which is precisely the admission a non-walkable row refuses. So the precondition is an
\* ENFORCEMENT: nothing about the other guards implies it, and without it the hold outlives every
\* step that could have discharged it.
\* Control: `_safe`, where `HoldDetect` and `HoldClear` are both enabled and the transition waits.
SPECIFICATION Spec
CONSTANTS
    MaxInc = 3
    SabotageJanitorEatsNewborn = FALSE
    SabotageZombieGoLive = FALSE
    SabotageReconcileLiveCreator = FALSE
    SabotageReconcileStaleToken = FALSE
    SabotageCkptDeleteWhileRemoving = FALSE
    SabotageEntryBeforeCkptDelete = FALSE
    SabotageSameIncarnationRebirth = FALSE
    SabotageFloorRetainsDeadName = FALSE
    SabotageSkipRemovalReady = FALSE
    SabotageRemovalReadyWithoutItem = FALSE
    SabotagePromoteUnderHold = TRUE
INVARIANT TypeOK
INVARIANT INV_NO_ORPHANED_HOLD
