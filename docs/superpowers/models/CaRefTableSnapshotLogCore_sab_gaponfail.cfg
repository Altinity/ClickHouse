\* Sabotage (INV-1, contiguity): the rev.4 allocator — a definitely-failed conditional create burns
\* its id and the writer moves on, leaving "a safe id gap". It is not safe once absence is the
\* walk's terminator: recovery reads a 404 at the gap, concludes it has reached the frontier, seals
\* there and installs a state missing every record above the gap. This is the spec's root cause
\* ("absence is undecidable in a sparse id space") as a counterexample.
\* Must be RED on INV_DENSE (INV_RECOVERY also breaks).
SPECIFICATION Spec
CONSTANTS
    MaxSeq = 4
    MaxRestarts = 2
    LatePred = FALSE
    SabotageReuseAfterAmbiguous = FALSE
    SabotageGapOnFail = TRUE
    SabotageNoSeal = FALSE
    SabotageBlindPut = FALSE
    SabotageScanIsTruth = FALSE
    SabotageCleanupAboveCkpt = FALSE
    SabotageStaleCkptCorruption = FALSE
    SabotageSealClobbersBase = FALSE
INVARIANTS TypeOK INV_RECOVERY INV_NOFAIL INV_DENSE INV_NO_GHOST INV_NO_PHANTOM
