\* §5 gate (sabotage): the reuse point-read ignores the tombstone and adopts a condemned
\* body as-is. A live ref then stands over a body with a queued exact-token delete, which
\* GC's unguarded delete execution removes. MUST violate INV_NO_DANGLE (and INV_NO_LOSS).
SPECIFICATION Spec
CONSTANTS
    MaxGen = 8
    SabResurrectMetaFirst = FALSE
    SabGcDeleteMetaFirst = FALSE
    SabAdoptOverTombstone = TRUE
    SabCreateReadsMeta = FALSE
INVARIANT TypeOK
INVARIANT INV_ABSENCE_NO_QUEUED_DELETE
INVARIANT INV_NO_DANGLE
INVARIANT INV_NO_LOSS
INVARIANT INV_META_BODY
