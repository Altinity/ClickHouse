\* Sabotage (§4 / §5, "LIST is a zero-trust hint"): the reader folds what the enumeration returned
\* instead of walking the tail by arithmetic. Must be RED on INV_RECOVERY.
\*
\* TLC's shortest counterexample is not the hidden hole but the other half of the same mistake: the
\* hint reader has no vanish detection, so when cleanup legitimately advances `_ckpt` and deletes a
\* covered log between the reader's `_ckpt` sample and its fetch, the arithmetic walk restarts
\* (RWalkVanish) while the hint reader silently folds a short history. The hidden-hole shape is
\* reachable in the same state space and is pinned separately by `_witness_hintlie`, so neither half
\* rests on the other.
SPECIFICATION Spec
CONSTANTS
    MaxSeq = 4
    MaxRestarts = 2
    LatePred = FALSE
    SabotageReuseAfterAmbiguous = FALSE
    SabotageGapOnFail = FALSE
    SabotageNoSeal = FALSE
    SabotageBlindPut = FALSE
    SabotageScanIsTruth = TRUE
    SabotageCleanupAboveCkpt = FALSE
    SabotageStaleCkptCorruption = FALSE
INVARIANTS TypeOK INV_RECOVERY INV_NOFAIL INV_DENSE INV_NO_GHOST INV_NO_PHANTOM
