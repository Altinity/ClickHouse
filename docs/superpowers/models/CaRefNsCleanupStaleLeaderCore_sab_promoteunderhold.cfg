\* Sabotage: `Removing -> RemovalReady` fires with a durable hold outstanding — the transition's
\* no-hold precondition dropped, everything else honest (fresh incarnations, deposit-time capture).
\*
\* Must be RED on NoHeldRowRetired, and GREEN on NoLiveDataDeleted: dropping this precondition is not
\* a rebirth hazard, which is the point of giving it its own invariant rather than folding it into
\* the data-loss one. The damage is recorded at the row deletion, not at the promotion, so the
\* sabotage has to reach it: a hold discharges only by folding through its offending position, only a
\* walkable row can be folded through, and after the transition no walkable row exists — nor will one
\* ever again, since the next life is a different incarnation with its own accounting.
\* Control: `_safe`, where the same hold is detected and cleared and the transition simply waits.
SPECIFICATION Spec
CONSTANTS
    MaxInc = 2
    SabotageNoIncarnation = FALSE
    SabotageRederive = FALSE
    SabotagePromoteUnderHold = TRUE
INVARIANT TypeOK
INVARIANT NoLiveDataDeleted
INVARIANT NoHeldRowRetired
