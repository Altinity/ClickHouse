\* §5 gate (sabotage): resurrect clears the tombstone BEFORE the fresh body -- the ONE
\* excluded direction. Absence (=Clean) lands while the old body + its queued exact-token
\* delete are dying. MUST violate INV_ABSENCE_NO_QUEUED_DELETE.
SPECIFICATION Spec
CONSTANTS
    MaxGen = 8
    SabResurrectMetaFirst = TRUE
    SabGcDeleteMetaFirst = FALSE
    SabAdoptOverTombstone = FALSE
    SabCreateReadsMeta = FALSE
INVARIANT TypeOK
INVARIANT INV_ABSENCE_NO_QUEUED_DELETE
INVARIANT INV_NO_DANGLE
INVARIANT INV_NO_LOSS
INVARIANT INV_META_BODY
