\* Sabotage: a hold clears when a second probe finds the same position absent, instead of by folding
\* through it. Spec §5 (r9-5): "a held higher witness disappearing while the gap remains = corruption",
\* never grounds for clearing. Must be RED on HoldSuppresses. Control: `_ctl_holdsuppresses`.
SPECIFICATION Spec
CONSTANTS
    T1 = t1
    T2 = t2
    MaxSeq = 3
    EdgeOf <- EdgeRoles
    HintSilent = FALSE
    HintComplete = FALSE
    CkptWitness = FALSE
    EnableHiddenHole = TRUE
    SabotageSkipQuietProbe = FALSE
    SabotageRebuildDropsHold = FALSE
    SabotageClearHoldOnAbsent = TRUE
    SabotageDestroyUnderHold = FALSE
    SabotageDeleteIgnoresIndeg = FALSE
    SabotageAdoptBeforeCommit = FALSE
    SabotageCleanupIgnoresCursor = FALSE
    PlanOnly = FALSE
    SabotageAdapterMints = FALSE
INVARIANT TypeOK
INVARIANT HoldSuppresses
