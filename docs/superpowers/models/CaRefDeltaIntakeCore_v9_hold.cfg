\* The hold, working — an UPPER BOUND, deliberately. The store loses an above-cursor log to
\* corruption (`EnableHiddenHole`) while detection is IDEALIZED (`HintComplete` reads the store, so
\* a witness is observed the instant it exists — no listing can do that). The impossible shape is
\* therefore always seen: the namespace is HELD at the offending position and pool-wide destruction
\* is suppressed until the fold passes through it, so no acked `+1` is lost.
\*
\* This isolates the hold MECHANISM from the detection problem. With a real listing — even one that
\* omits nothing — the same configuration is RED, because an enumeration is a snapshot and a witness
\* that becomes durable after it is invisible; that is `_witness_corruptgap`, the lower bound.
\* Must be GREEN.
SPECIFICATION Spec
CONSTANTS
    T1 = t1
    T2 = t2
    MaxSeq = 3
    EdgeOf <- EdgeRoles
    HintSilent = FALSE
    HintComplete = TRUE
    CkptWitness = FALSE
    EnableHiddenHole = TRUE
    SabotageSkipQuietProbe = FALSE
    SabotageRebuildDropsHold = FALSE
    SabotageClearHoldOnAbsent = FALSE
    SabotageDestroyUnderHold = FALSE
    SabotageDeleteIgnoresIndeg = FALSE
    SabotageAdoptBeforeCommit = FALSE
    SabotageCleanupIgnoresCursor = FALSE
INVARIANT TypeOK
INVARIANT NoMissedFold
INVARIANT ExactlyOnce
INVARIANT LosingCommitAdoptsNothing
INVARIANT NoAckedLoss
INVARIANT HoldSuppresses
