\* Sabotage: attempt-pinning broken — a re-execution reuses the prior attempt's keys at an advanced
\* journal cut and the stale run bytes are silently adopted under the newer claimed coverage
\* (instead of the byte-equal CORRUPTED_DATA refusal). Must be RED.
SPECIFICATION Spec
CONSTANTS
    Blobs = {b1, b2}
    MaxRound = 4
    MaxToken = 3
    MaxJournal = 5
    Sabotage = "attempt_reuse"
INVARIANT TypeOK
INVARIANT INV_NO_LOSS
INVARIANT INV_NO_RETURN
INVARIANT INV_COVERAGE
INVARIANT INV_ONE_PASS
