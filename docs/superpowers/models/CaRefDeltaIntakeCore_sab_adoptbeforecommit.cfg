\* Sabotage S2: the candidate cursor becomes live (visible to cleanup) at scan-complete, before
\* the fold commit's win/lose is decided. Must violate NoMissedFold or LosingCommitAdoptsNothing
\* (I1 or I3) via a lost commit. Must be RED.
SPECIFICATION Spec
CONSTANTS
    T1 = t1
    T2 = t2
    MaxSeq = 3
    SabotageResumeSkip = FALSE
    SabotageAdoptBeforeCommit = TRUE
    SabotageCleanupIgnoresCursor = FALSE
    EnableLatePredecessorPut = FALSE
