\* Sabotage: the candidate cursor becomes live at scan-complete, before the fold commit's win/lose
\* is decided. Cursor adoption must be atomic with the commit (I3) — a losing round adopts nothing.
\* Unchanged from rev.4 and still load-bearing. Must be RED: TLC reaches NoMissedFold first — a
\* lost commit leaves the cursor standing above the fold — and LosingCommitAdoptsNothing falls in
\* the same behaviour.
SPECIFICATION Spec
CONSTANTS
    T1 = t1
    T2 = t2
    MaxSeq = 2
    EdgeOf <- EdgeRoles
    HintSilent = FALSE
    HintComplete = FALSE
    EnableHiddenHole = FALSE
    SabotageRebuildDropsHold = FALSE
    SabotageClearHoldOnAbsent = FALSE
    SabotageDestroyUnderHold = FALSE
    SabotageDeleteIgnoresIndeg = FALSE
    SabotageAdoptBeforeCommit = TRUE
    SabotageCleanupIgnoresCursor = FALSE
    PlanOnly = FALSE
    SabotageAdapterMints = FALSE
    SabotageSkipCatalogTarget = FALSE
    SabotageSkipHeldRetry = FALSE
INVARIANT TypeOK
INVARIANT CteExact
INVARIANT RoundCteNoRegression
INVARIANT HoldReleaseRequiresFold
INVARIANT NoMissedFold
INVARIANT LosingCommitAdoptsNothing
INVARIANT ExactlyOnce
INVARIANT NoAckedLoss
INVARIANT HoldSuppresses
INVARIANT EveryCatalogTargetAttempted
INVARIANT EveryCarriedHoldRetried
