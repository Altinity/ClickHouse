\* Sabotage: namespace_birth over a Removed namespace without the durable Completed marker of its
\* removal's physical cleanup (recreation before Completed). Must be RED (INV_RECREATE).
SPECIFICATION Spec
CONSTANTS
    MaxSeq = 4
    MaxRestarts = 2
    SabotageDeleteBeforeSnapshot = FALSE
    SabotageVanishIsCorruption = FALSE
    SabotageRecreateBeforeCompleted = TRUE
    SabotageRemountKeepsOldEpoch = FALSE
    LatePred = FALSE
INVARIANT TypeOK
INVARIANT INV_RECOVERY
INVARIANT INV_NOFAIL
INVARIANT INV_RECREATE
