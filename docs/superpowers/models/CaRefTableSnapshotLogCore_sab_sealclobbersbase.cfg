\* Sabotage (INV-4, the `_ckpt` merge): the sealer read-modify-writes the whole `_ckpt` body — as
\* the real code does — but writes back the base it SAMPLED at the start of its recovery instead of
\* merging by semantic maximum. A base another writer advanced meanwhile is dragged backwards onto a
\* snapshot that snapshot-cleanup has legitimately already deleted (deletion is gated strictly below
\* the CURRENT base, which the regressed pointer no longer names). The next mount then samples that
\* base, its exact-key GET 404s, the `_ckpt` reread shows an unchanged token, and recovery is
\* obliged to declare corruption.
\*
\* This is the config that makes the merge load-bearing: with `EXCEPT !.seal` — a field-surgical
\* update — the regression is structurally unrepresentable and INV-4's merge obligation would be
\* proven by nothing. Closes spec §9's "`_ckpt` races (... merge ...)" control.
\*
\* Must be RED on INV_RECOVERY. That is NOT the corruption stop the fix round predicted, and the
\* difference matters: TLC's shortest counterexample regresses the base all the way to 0 ("no
\* checkpoint") after the covered prefix has been legitimately cleaned, so the next mount
\* reconstructs an EMPTY namespace over live data and reports success. The failure mode of a
\* skipped merge is silent data loss, not a fail-closed stop. The predicted corruption path is real
\* too and is pinned separately by `_sab_sealclobbersbase_nofail`.
SPECIFICATION Spec
CONSTANTS
    MaxSeq = 4
    MaxRestarts = 2
    LatePred = FALSE
    SabotageReuseAfterAmbiguous = FALSE
    SabotageGapOnFail = FALSE
    SabotageNoSeal = FALSE
    SabotageBlindPut = FALSE
    SabotageScanIsTruth = FALSE
    SabotageCleanupAboveCkpt = FALSE
    SabotageStaleCkptCorruption = FALSE
    SabotageSealClobbersBase = TRUE
    FrontierSlice = FALSE
    SabotageAckBeforeFrontier = FALSE
    SabotageAllocateBeforeFrontier = FALSE
    SabotageInstallAboveFrontier = FALSE
    SabotageStaleFrontier = FALSE
    SabotageSnapshotAboveFrontier = FALSE
    SabotageSealAboveFrontier = FALSE
    SabotageSnapshotAtSeal = FALSE
INVARIANTS TypeOK INV_RECOVERY INV_NOFAIL INV_DENSE INV_NO_GHOST INV_NO_PHANTOM
