\* Stage 3: trees (asymmetric Children: t1 full, t2 single-child) — expansion markers, atomic cascade, shared-child survival, selective cascade, drop/re-attach replay. Bounds reduced (MaxToken 2 / MaxLog 5 / Writers={w1}) — trees+resurrect explode on larger bounds. Ladder rung 1 (single writer): full tree-machinery coverage; only writer-vs-writer interleaving dropped.
SPECIFICATION Spec
