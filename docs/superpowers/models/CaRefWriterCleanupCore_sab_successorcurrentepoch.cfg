\* S2: successor cleanup also reclaims epoch == current (not just epoch < current) ->
\* INV_NO_WRONGFUL_RECLAIM MUST be violated (a still-promotable current-epoch Active build's
\* precommit gets wrongfully reclaimed).
SPECIFICATION Spec
CONSTANTS
    Builds = {b1, b2, b3}
    MaxEpoch = 2
    SabotageRetireBeforeRemoval = FALSE
    SabotageRetireUncertain = FALSE
    SabotageSuccessorRemovesCurrentEpoch = TRUE
    SabotageCancelBeforeRemovalDurable = FALSE
INVARIANTS
    INV_NO_WRONGFUL_RECLAIM
