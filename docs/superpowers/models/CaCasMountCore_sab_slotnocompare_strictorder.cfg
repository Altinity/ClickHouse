\* 2026-07-28 v9 fix round 1 -- `_sab_slotnocompare.cfg` under the strict-order state constraint.
\* Identical sabotage (`SabSlotNoByteCompare = TRUE`), identical bounds, identical TARGET INVARIANT
\* (`AckedOpsAreDurable`); see that cfg's header for the mechanism and the op-identity granularity
\* the compare turns on.
\*
\* THE `CONSTRAINT`: `StrictOrderMount` (`mount = None \/ mount.epoch > 0`) prunes the model's
\* PRE-EXISTING epoch-0 bootstrap mount -- `ClaimMount` permits a mount at generation 0 before any
\* `AllocEpoch` ran, whereas the product's STRICT ORDER (`CasStore.cpp:312-316`) allocates the
\* durable writer_epoch FIRST and never reaches that state. BFS finds the generation 0 -> 1
\* transition first, so WITHOUT this constraint the shortest counterexample of every v9 sabotage runs
\* through a mount the product cannot have. Under it the same sabotage must still be RED, on an
\* `AllocEpoch`-first mount and a 1 -> 2 transition -- which is what establishes that these
\* counterexamples are about a generation TRANSITION, not about the bootstrap value.
\*
\* Fix round 1 committed this: it was previously an uncommitted scratch-tree check reported only in
\* prose, and unverifiable prose is not evidence. See `StrictOrderMount`'s own comment in the module,
\* and `CaCasMountCore_RESULTS.md` `{#fix1-strictorder}`.
SPECIFICATION Spec
CONSTANTS
    Actors = {A, B}
    None = NoneVal
    MaxClock = 2
    MaxEpoch = 2
    MaxToken = 4
    TTL = 2
    SabForeignTakeover = FALSE
    SabEpochReset = FALSE
    SabAdoptWedgeOnTouch = FALSE
    SabAdoptIgnoresFence = FALSE
    Drift = 0
    SabWallClockReclaim = FALSE
    SabEpochGuardOff = FALSE
    SabDecomBlindBypass = FALSE
    RecoveryGenOn = TRUE
    SabStaleInstall = FALSE
    SabWedgeRetryOldGen = FALSE
    SabSlotNoByteCompare = TRUE
    MaxAdmissions = 3
CHECK_DEADLOCK FALSE
CONSTRAINT StrictOrderMount
INVARIANT TypeOK
INVARIANT AckedOpsAreDurable
