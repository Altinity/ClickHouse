\* 2026-07-28 v9 SABOTAGE (spec 2026-07-27-cas-ref-chain-complete-cut-design.md §2 INV-1's
\* every-attempt rule, §9's r9-5): `SabWedgeRetryOldGen = TRUE` drops the generation guard on
\* `WedgeRetryCreate`, so a wedged lane's one bounded conditional create fires under whatever
\* generation happens to be current instead of only while its STORED admission generation still is.
\*
\* TARGET INVARIANT: `GlobalSupersededWriterMakesNoMutation` -- the same PRE-EXISTING global-truth
\* exclusivity property `_sab_staleinstall.cfg` targets, deliberately reused rather than shadowed by
\* a new parallel one. The route is different and that is the point: there the mutation is a
\* recovery RESULT being published; here it is a dead lane's own conditional CREATE landing in the
\* successor incarnation's live id space. Both are "an incarnation mutated after the durable epoch
\* counter moved past it", which is what the invariant already says.
\*
\* THE COUNTEREXAMPLE, depth 10: `ClaimOwnerEmpty -> ClaimMount -> Tick -> Tick -> WedgeAdmit`
\* (an operation is admitted at generation 0 and its send comes back ambiguous -- INV-1's wedge)
\* `-> ClearExpiredMount -> AllocEpoch` (generation 1) `-> ClaimMount` (fresh `fenceUntil`)
\* `-> WedgeRetryCreate`. With the guard dropped the generation-0 lane's create lands while
\* `epoch = 1`, so a lane belonging to a dead incarnation has written into the live one's stream and
\* acked its caller. Full narration in `CaCasMountCore_RESULTS.md` `{#v9-traces}`, including the
\* scratch re-check that it also holds with an `AllocEpoch`-first mount.
\*
\* WHAT THE SABOTAGE CANNOT REACH, which is why the recheck must come FIRST rather than lean on the
\* seal: once the successor's recovery has SEALED the key, `slot # None` and the store refuses the
\* create outright, whatever generation the retry presents (INV-1's "a successor's `EpochSeal` found
\* at the key is a conclusive rejection"). The sabotage's entire reachable damage is the pre-seal
\* window. That structural half is exercised, un-sabotaged, by `_witness_sealrejected.cfg`.
\*
\* Only `TypeOK` and the target are listed (this module's sabotage-cfg convention -- see
\* `_sab_staleinstall.cfg`'s note).
\*
\* BOUNDS: MaxClock = 2, MaxEpoch = 2, MaxToken = 4, TTL = 2, Drift = 0, MaxAdmissions = 3 -- the
\* SAME bounds as the green gate `_v9_recoverygen.cfg`, which is where they are explained (that
\* config is exhaustive only at these). The reds and the green must share bounds or the pair carries
\* no evidence. This counterexample was FIRST found at `_stage1`'s wider bounds and still fires here.
SPECIFICATION Spec
CONSTANTS
    Actors = {A, B}
    None = NoneVal
    MaxClock = 2
    MaxEpoch = 2
    MaxToken = 4
    TTL = 2
    SabForeignTakeover = FALSE
    SabEpochReset = FALSE
    SabAdoptWedgeOnTouch = FALSE
    SabAdoptIgnoresFence = FALSE
    Drift = 0
    SabWallClockReclaim = FALSE
    SabEpochGuardOff = FALSE
    SabDecomBlindBypass = FALSE
    RecoveryGenOn = TRUE
    SabStaleInstall = FALSE
    SabWedgeRetryOldGen = TRUE
    SabSlotNoByteCompare = FALSE
    MaxAdmissions = 3
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT GlobalSupersededWriterMakesNoMutation
