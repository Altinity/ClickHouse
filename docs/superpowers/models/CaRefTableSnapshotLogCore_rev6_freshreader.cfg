\* rev.6 fresh-observer containment (spec 2026-07-13-cas-ref-lease-exclusivity-rev6-design.md): same
\* adversarial constants as _rev6_latedelivery (a late predecessor PUT lands under an existing
\* snapshot and is dropped from the oracle), checking the fresh-observer + snapshot-determinism
\* invariants. Expected GREEN: any reader that STARTED after the last late delivery
\* (rStartedAfterDrop) always agrees with the rev.6 oracle, and published snapshot bytes stay
\* byte-deterministic under the same oracle.
\*
\* This is the regression guard for the CoveredFold fix in WriterPublishSnapshot (see
\* CaRefTableSnapshotLogCore.tla): before that fix, this config was RED on INV_SNAP_DETERMINISTIC
\* (a snapshot published at/above a dropped id re-included it), proving the invariant is falsifiable,
\* not vacuously green. MaxSeq=5 (not 4) matches _rev6_latedelivery so both exercise the same
\* drop-then-republish-above-it shape.
SPECIFICATION Spec
CONSTANTS
    MaxSeq = 5
    MaxRestarts = 2
    SabotageDeleteBeforeSnapshot = FALSE
    SabotageVanishIsCorruption = FALSE
    SabotageRecreateBeforeCompleted = FALSE
    SabotageRemountKeepsOldEpoch = FALSE
    LatePred = TRUE
    Rev6MountRule = TRUE
INVARIANTS TypeOK INV_FRESH_READER INV_SNAP_DETERMINISTIC
