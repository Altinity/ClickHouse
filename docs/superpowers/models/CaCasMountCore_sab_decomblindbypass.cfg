\* SABOTAGE (2026-07-24 fence-not-rescue gate, spec rev.4, round-3 finding-1): the rejected
\* DecommissionRecovery blind bypass -- `RemintEpochDecom` mints epoch 1 unconditionally
\* (`SabDecomBlindBypass = TRUE`) regardless of whether the surviving mount is terminal or
\* still LIVE. Counterexample shape (the round-3 №1 trace): A holds a LIVE epoch-1 mount ->
\* `WipeEpoch` destroys the durable counter -> a "decommission" re-mint of epoch 1 (blind,
\* ignoring the mount's liveness) recreates the SAME (uuid, epoch) pair the live incarnation
\* already holds -> `ClaimMount`'s pre-existing `refreshOK`/same-pair-adopt path lets the
\* corrupted incarnation re-claim/continue over what is nominally the SAME epoch number as
\* the still-live original -> the mismatch this creates is either caught by `Renew`
\* (`SupersededWriterMakesNoMutation`, if the two threads of control diverge) or the fenced-
\* epoch numeric reuse breaks `FenceCostsEpoch` first (round-3 №1 is precisely a same-pair-
\* number-reuse hazard). MUST violate at least one of the listed invariants
\* (`SupersededWriterMakesNoMutation` is the primary target per the brief; `FenceCostsEpoch`
\* is intentionally still exercised HERE, unlike the honest cfgs -- this is the sabotage
\* meant to break it).
\*
\* `WriterEpochMonotoneUnique` is NOT listed: `WipeEpoch` ALONE (before `RemintEpochDecom`
\* even fires -- `RemintEpochDecom` additionally requires `crashed[a]`, see that action's own
\* comment) already trips its raw-`epoch` ceiling conjunct, the same accepted, unrelated
\* residual-hole false alarm documented in `CaCasMountCore_stage1.cfg` -- confirmed empirically
\* (an earlier run of this cfg WITH the invariant listed reported it violated at depth 6, one
\* step after `WipeEpoch`, with `RemintEpochDecom` never having fired at all -- masking the
\* actual target this cfg exists to demonstrate).
SPECIFICATION Spec
CONSTANTS
    Actors = {A, B}
    None = NoneVal
    MaxClock = 4
    MaxEpoch = 3
    MaxToken = 7
    TTL = 2
    SabForeignTakeover = FALSE
    SabEpochReset = FALSE
    SabAdoptWedgeOnTouch = FALSE
    SabAdoptIgnoresFence = FALSE
    Drift = 0
    SabWallClockReclaim = FALSE
    SabEpochGuardOff = FALSE
    SabDecomBlindBypass = TRUE
    RecoveryGenOn = FALSE          \* 2026-07-28 v9: the recovery-generation layer is INERT here --
                                   \* this cfg predates it and its state space is therefore
                                   \* unchanged (see CaCasMountCore_RESULTS.md's before/after table)
    SabStaleInstall = FALSE
    SabWedgeRetryOldGen = FALSE
    SabSlotNoByteCompare = FALSE
    MaxAdmissions = 0          \* the layer is off here; the bound is only
                            \* declared because TLC requires every constant
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT NoTwoServerUuidsOwnSameServerRoot
INVARIANT ForeignUuidNeverAutoTakesOver
INVARIANT SupersededWriterMakesNoMutation
INVARIANT FenceCostsEpoch
INVARIANT NoPermanentWedge
