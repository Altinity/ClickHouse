\* Sabotage: the transition's positive-evidence guard is dropped -- `Removing -> RemovalReady`
\* fires without the terminal record having folded into a cleanup item.
\*
\* Must be RED on INV_TERMINAL_ACCOUNTED. The violation is recorded at the ROW DELETION, not at the
\* promotion, so the sabotage has to reach the damage rather than announce it: a `RemovalReady` row
\* is not walkable and an absent row cannot be named, so the terminal record that had not folded when
\* the transition fired can never fold afterwards. Its deltas are lost to the fold permanently.
\* This is why the evidence has to be POSITIVE. An implementation that infers readiness from an
\* item's absence cannot tell "the item folded and was pruned" from "the item was never written".
\* Control: `_safe`.
SPECIFICATION Spec
CONSTANTS
    MaxInc = 3
    SabotageJanitorEatsNewborn = FALSE
    SabotageZombieGoLive = FALSE
    SabotageReconcileLiveCreator = FALSE
    SabotageReconcileStaleToken = FALSE
    SabotageCkptDeleteWhileRemoving = FALSE
    SabotageEntryBeforeCkptDelete = FALSE
    SabotageSameIncarnationRebirth = FALSE
    SabotageFloorRetainsDeadName = FALSE
    SabotageSkipRemovalReady = FALSE
    SabotageRemovalReadyWithoutItem = TRUE
    SabotagePromoteUnderHold = FALSE
INVARIANT TypeOK
INVARIANT INV_TERMINAL_ACCOUNTED
