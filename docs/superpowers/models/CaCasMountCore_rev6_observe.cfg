\* rev.6 POSITIVE gate: observation-based reclaim. SabWallClockReclaim = FALSE (honest),
\* Drift = 2 (bounded clock-rate skew) exercises the ObservedReclaim wait (TTL + Drift)
\* against a holder whose TRUE local fence can genuinely outlive the stamp by up to
\* Drift ticks. SupersededWriterMakesNoMutation (knowledge-based, legacy),
\* GlobalSupersededWriterMakesNoMutation (round 2: GLOBAL-truth), and every legacy
\* safety invariant MUST hold; W_ObservedReclaim MUST be VIOLATED (the "reclaim after
\* full stability wait" recovery path is reachable, not vacuous).
SPECIFICATION Spec
CONSTANTS
    Actors = {A, B}
    None = NoneVal
    MaxClock = 8
    MaxEpoch = 3
    MaxToken = 8
    TTL = 3
    SabForeignTakeover = FALSE
    SabEpochReset = FALSE
    SabSupersededWrites = FALSE
    SabAdoptWedgeOnTouch = FALSE
    SabAdoptIgnoresFence = FALSE
    Drift = 2
    SabWallClockReclaim = FALSE
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT NoTwoServerUuidsOwnSameServerRoot
INVARIANT ForeignUuidNeverAutoTakesOver
INVARIANT WriterEpochMonotoneUnique
INVARIANT SupersededWriterMakesNoMutation
INVARIANT GlobalSupersededWriterMakesNoMutation
INVARIANT FenceCostsEpoch
INVARIANT NoPermanentWedge
INVARIANT W_ObservedReclaim
