\* rev.6 SAFETY cfg (round 8, reconciled consult+review package -- FIXES review C1 and
\* round-7's Finding A): observation-based reclaim. SabWallClockReclaim = FALSE (honest),
\* Drift = 2 (bounded clock-rate skew) exercises the ObservedReclaim wait (TTL + Drift)
\* against a holder whose TRUE local fence can genuinely outlive the stamp by up to Drift
