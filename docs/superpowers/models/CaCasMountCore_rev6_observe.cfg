\* Round 8: `ObservedReclaim` now installs the successor's body (fresh epoch, unfenced,
\* fresh deadline -- faithful to the product's token-guarded `putOverwrite` reclaim,
\* `CasServerRoot.cpp:405-414`), and every continuation-arm action's PRE-EXISTING body
\* classification (`Renew`'s different-epoch branch, `AdoptRead`'s epoch guard, `ClaimMount`'s
\* `refreshOK`/`strictOK`) independently refuses to re-arm the superseded incarnation -- no
\* `heldToken` compensating field (round 7, deleted this round). TLC genuinely explores the
