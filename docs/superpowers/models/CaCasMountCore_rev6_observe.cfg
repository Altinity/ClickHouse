\* AdoptRead-AdoptWrite all fail to re-arm (their own body-check sees the new-epoch body), so
\* `clock < fenceUntil` goes and stays false for that incarnation. `GlobalSupersededWriterMakesNoMutation`
\* (the invariant this cfg exists to verify -- THE reclaim-faithfulness regression detector,
\* superseding the retired `_sab_supersededwrites` canary role), `SupersededWriterMakesNoMutation`
\* (knowledge-based, legacy), and every legacy safety invariant MUST hold, GREEN, with the
