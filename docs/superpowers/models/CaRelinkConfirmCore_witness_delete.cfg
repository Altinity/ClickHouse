\* WITNESS (negated reachability) -- NON-VACUITY OF THE CONSEQUENT.  GC in this model really does
\* physically delete a blob (three-phase graduation runs to completion), so
\* "BlobsOf(Token) \subseteq LiveBlobs" is not trivially true in every reachable state.
\* TLC MUST report W_BlobDeleted VIOLATED.
SPECIFICATION Spec
CONSTANTS
    Receivers = {r1}
    MaxId = 5
    MaxRound = 5
    MaxHoles = 0
    SabotageNoGate1 = FALSE
    SabotageStaleCache = FALSE
    SabotageTouchBlind = FALSE
    SabotageNoPoison = FALSE
    SabotageNoFence = FALSE
    SabotagePublishAfterConfirm = FALSE
INVARIANT W_BlobDeleted
CHECK_DEADLOCK FALSE
