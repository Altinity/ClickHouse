\* 2026-07-28 v9 WITNESS (negated reachability -- TLC reporting `W_GenerationRefused` VIOLATED is
\* the evidence): the honest post-I/O generation recheck actually REFUSES a returning
\* old-generation result at least once.
\*
\* Why this config exists: `_v9_recoverygen.cfg`'s green is consistent with a recheck that never
\* had anything to reject, in which case the green would prove nothing about the recheck and the
\* two `_sab_*` reds would be the only evidence the guard matters at all. This pins the honest side:
\* a result IS produced under a generation that a self-remount then supersedes, and the recheck
\* refuses it (`RecoveryRefused` for a recovery, `WedgeAbandonStale` for a wedged lane -- one flag,
\* `staleRefusedEver`, is set by both; `COVERAGE=1 bash run_mount.sh` shows both actions firing --
\* recorded in `CaCasMountCore_RESULTS.md` `{#v9-coverage}`, which is the only place that fact can
\* come from, since one flag cannot distinguish which site set it).
\*
\* Trace, depth 9: `ClaimOwnerEmpty -> ClaimMount -> Tick -> Tick -> RecoveryStart` (captures
\* generation 0) `-> ClearExpiredMount -> AllocEpoch` (the local generation becomes 1)
\* `-> RecoveryRefused`, which drops the returning result because `recGen[A] # localEpoch[A]`.
\*
\* All sabotage flags OFF -- this is a property of the HONEST protocol.
\*
\* BOUNDS: MaxClock = 2, MaxEpoch = 2, MaxToken = 4, TTL = 2, Drift = 0, MaxAdmissions = 3 -- the
\* SAME bounds as the green gate `_v9_recoverygen.cfg`, which is where they are explained (that
\* config is exhaustive only at these). The reds and the green must share bounds or the pair carries
\* no evidence. This witness was FIRST found at `_stage1`'s wider bounds and still fires here.
SPECIFICATION Spec
CONSTANTS
    Actors = {A, B}
    None = NoneVal
    MaxClock = 2
    MaxEpoch = 2
    MaxToken = 4
    TTL = 2
    SabForeignTakeover = FALSE
    SabEpochReset = FALSE
    SabAdoptWedgeOnTouch = FALSE
    SabAdoptIgnoresFence = FALSE
    Drift = 0
    SabWallClockReclaim = FALSE
    SabEpochGuardOff = FALSE
    SabDecomBlindBypass = FALSE
    RecoveryGenOn = TRUE
    SabStaleInstall = FALSE
    SabWedgeRetryOldGen = FALSE
    SabSlotNoByteCompare = FALSE
    MaxAdmissions = 3
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT W_GenerationRefused
