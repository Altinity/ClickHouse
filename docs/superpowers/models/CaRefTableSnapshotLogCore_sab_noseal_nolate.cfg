\* THE FLIP'S CONTROL, and the only config here whose sabotage is expected to stay GREEN.
\* Identical to _sab_noseal (recovery concludes the frontier without OCCUPYING the slot) except that
\* the straggler is switched off: LatePred = FALSE. It must be GREEN.
\*
\* The pair is the controlled experiment behind the LatePredecessorPut flip, with exactly one
\* variable moving in each direction:
\*   _v9_flip_latepred  straggler ON,  seal ON   -> GREEN
\*   _sab_noseal        straggler ON,  seal OFF  -> RED (INV_RECOVERY)
\*   _sab_noseal_nolate straggler OFF, seal OFF  -> GREEN   <- this config
\* So the red is caused by the straggler and cured by the seal's occupancy, and neither the "green"
\* nor the "red" can be explained by some third difference between the two configs.
SPECIFICATION Spec
CONSTANTS
    MaxSeq = 4
    MaxRestarts = 2
    LatePred = FALSE
    SabotageReuseAfterAmbiguous = FALSE
    SabotageGapOnFail = FALSE
    SabotageNoSeal = TRUE
    SabotageBlindPut = FALSE
    SabotageScanIsTruth = FALSE
    SabotageCleanupAboveCkpt = FALSE
    SabotageStaleCkptCorruption = FALSE
    SabotageSealClobbersBase = FALSE
    FrontierSlice = FALSE
    SabotageAckBeforeFrontier = FALSE
    SabotageAllocateBeforeFrontier = FALSE
    SabotageInstallAboveFrontier = FALSE
    SabotageStaleFrontier = FALSE
    SabotageSnapshotAboveFrontier = FALSE
    SabotageSealAboveFrontier = FALSE
INVARIANTS TypeOK INV_RECOVERY INV_NOFAIL INV_DENSE INV_NO_GHOST INV_NO_PHANTOM
