\* POSITIVE gate: all sabotage flags OFF. The 4 invariants below MUST hold.
\*
\* 2026-07-24 fence-not-rescue gate (spec rev.4): `FenceCostsEpoch` AND
\* `WriterEpochMonotoneUnique` are DROPPED from this cfg's list (was: 7 invariants; then 6;
\* see history below). `WipeEpoch` (new, UNGATED -- the environment can lose the durable
\* epoch object at any time, in every cfg, per design) makes `epoch` itself legitimately read
\* below a value already recorded in `wrote`/`fencedEpochs`, with no re-mint needed at all --
\* the SAME underlying mechanism the PRE-EXISTING, Sab-gated `SabResetEpoch` models
\* (`CaCasMountCore_sab_epochreset.cfg`), just now reachable WITHOUT that sabotage flag. Both
\* dropped invariants read the raw `epoch` value directly (`WriterEpochMonotoneUnique`'s
\* ceiling conjunct, `FenceCostsEpoch`'s fenced-pair check) and neither can distinguish "epoch
\* transiently reads low, self-healing, no consequential re-mint" from "genuinely corrupted" --
\* this is PRECISELY the design spec's own "Residual hole, honestly stated" (Phase C section,
\* `2026-07-24-cas-mount-lease-self-race-fix-v2-design.md`): "epoch AND mount both wiped under
\* a live mount still permits a same-pair twin... degrading to a remount, never to two silently
\* -live writers persisting" -- an ACCEPTED, bounded, self-healing risk Phase C does NOT
\* eliminate (no body nonce / coherent-read machinery is a stated non-goal), not a regression
\* this gate is meant to catch. Mirrors the model's OWN existing precedent:
\* `CaCasMountCore_sab_epochreset.cfg` has NEVER listed `FenceCostsEpoch` either, for the
\* identical underlying reason. (An earlier draft of this task's change tried making
\* `WriterEpochMonotoneUnique`'s conjunct read a new ceiling variable instead of dropping it --
