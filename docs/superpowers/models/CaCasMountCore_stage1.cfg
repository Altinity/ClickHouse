\* re-running the full battery per Step 5 and reverted; see `WriterEpochMonotoneUnique`'s own
\* comment in the .tla file.) Both invariants remain meaningful and are still exercised
\* elsewhere: `WriterEpochMonotoneUnique` in every `sab_*.cfg` that lists it (unaffected --
