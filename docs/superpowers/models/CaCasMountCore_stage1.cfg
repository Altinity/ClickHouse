\* POSITIVE gate: all sabotage flags OFF. The 4 invariants below MUST hold.
\*
\* 2026-07-24 fence-not-rescue gate (spec rev.4): `FenceCostsEpoch` AND
\* `WriterEpochMonotoneUnique` are DROPPED from this cfg's list (was: 7 invariants; then 6;
\* see history below). CORRECTED 2026-07-24 (review follow-up) -- these have TWO DIFFERENT
\* causes, not one shared "`WipeEpoch` alone" trigger:
\*   - `WriterEpochMonotoneUnique`: `WipeEpoch` (new, UNGATED) ALONE makes `epoch` itself
\*     legitimately read below a value already recorded in `wrote`, with NO re-mint needed at
\*     all (depth-6 trace: AllocEpoch -> ClaimMount -> Write -> WipeEpoch). The SAME underlying
\*     mechanism the PRE-EXISTING, Sab-gated `SabResetEpoch` models
\*     (`CaCasMountCore_sab_epochreset.cfg`), just now reachable WITHOUT that sabotage flag.
\*   - `FenceCostsEpoch`: requires `RemintEpoch`'s HONEST branch to ALSO fire afterward (NOT
\*     `WipeEpoch` alone) -- shortest trace: AllocEpoch(1) -> ClaimMount -> GcFence -> AllocEpoch
\*     (2) -> ClaimMount -> ClearExpiredMount -> WipeEpoch -> RemintEpoch mints the literal `1`
\*     (mount = None satisfies the honest guard) -> ClaimMount reinstalls a LIVE (A,1), colliding
\*     with the (A,1) pair `GcFence` already fenced. Root cause: `RemintEpoch`'s honest branch
\*     mints a hardcoded literal `1` with no distinctness protection, unlike
\*     `RemintEpochDecom`'s `mount.epoch + 1` (distinct by construction). See
\*     `CaCasMountCore_RESULTS.md`'s "Accepted residual gap" section (corrected) for the full
\*     traces and a follow-up note (not implemented) on minting `epochCeiling + 1` instead of
\*     `1` there, which would plausibly close this specific hole.
\* Both dropped invariants read raw, instantaneous state (`WriterEpochMonotoneUnique`'s ceiling
\* conjunct, `FenceCostsEpoch`'s fenced-pair check) and neither can distinguish "epoch
\* transiently reads low, self-healing" from "genuinely corrupted" -- both are, at the level of
\* the design spec's own language, instances of its "Residual hole, honestly stated" (Phase C
\* section, `2026-07-24-cas-mount-lease-self-race-fix-v2-design.md`): "epoch AND mount both
\* wiped under a live mount still permits a same-pair twin... degrading to a remount, never to
\* two silently-live writers persisting" -- an ACCEPTED, bounded, self-healing risk Phase C does
\* NOT eliminate (no body nonce / coherent-read machinery is a stated non-goal), not a
\* regression this gate is meant to catch -- but they are two DIFFERENT concrete triggers within
\* that category. Mirrors the model's OWN existing precedent: `CaCasMountCore_sab_epochreset.cfg`
\* has NEVER listed `FenceCostsEpoch` either, for the identical underlying reason. (An earlier
\* draft of this task's change tried making `WriterEpochMonotoneUnique`'s conjunct read a new
\* ceiling variable instead of dropping it -- WRONG, because that ALSO silently defeated
\* `sab_epochreset.cfg`'s own detection, caught by re-running the full battery per Step 5 and
\* reverted; see `WriterEpochMonotoneUnique`'s own comment in the .tla file.) Both invariants
\* remain meaningful and are still exercised elsewhere: `WriterEpochMonotoneUnique` in every
\* `sab_*.cfg` that lists it (unaffected -- each one's OWN sabotage fires first, or the cfg
\* lacks `WipeEpoch`'s composing precondition in its reachable depth), `FenceCostsEpoch` in
\* `CaCasMountCore_sab_fenceresurrect.cfg`; both are only unreachable-as-a-guarantee in configs
\* where their respective trigger (see above) is reachable.
