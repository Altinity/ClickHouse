\* 2026-07-28 v9 SABOTAGE (spec 2026-07-27-cas-ref-chain-complete-cut-design.md §3 "Recovery
\* ownership", §9's r9-5): `SabStaleInstall = TRUE` drops the generation recheck `Install` performs
\* under the install lock, post-I/O, immediately before publishing a recovery result.
\*
\* TARGET INVARIANT: `GlobalSupersededWriterMakesNoMutation` -- the module's OWN, PRE-EXISTING
\* global-truth exclusivity property (`~supersededThenWrote`: no mutation once the durable `epoch`
\* counter has advanced past the generation the mutation belongs to). No parallel invariant was
\* invented for this: an old recovery publishing after a self-remount IS a mutation by a superseded
\* incarnation, which is exactly what that invariant already says must never happen. It is the same
\* property `_sab_wallclockreclaim.cfg` targets, reached by a completely different route (a
\* returning recovery result rather than a reclaimer trusting a foreign wall clock).
\*
\* THE COUNTEREXAMPLE, and why `clock < fenceUntil` does not already stop it: a bare GC fence-out
\* cannot get to `Install` at all -- `GcFence` fires only once `mount.deadline + Drift <= clock`,
\* which implies `clock >= fenceUntil` (see `GcFence`'s own mutual-exclusion proof), so the honest
\* mechanical liveness check already excludes it. What DOES get there is a SELF-REMOUNT: `ClaimMount`
\* installs a FRESH `fenceUntil`, so the liveness check passes again while `epoch` has meanwhile moved
\* on. The generation recheck (`recGen[A] # localEpoch[A]`) is the ONLY thing standing in that window,
\* which is precisely §3's "self-remount cancels or waits out recovery before rearming".
\*
\* Shortest trace, depth 10 (full narration in `CaCasMountCore_RESULTS.md` `{#v9-traces}`):
\* `ClaimOwnerEmpty -> ClaimMount -> Tick -> Tick -> RecoveryStart` (captures generation 0)
\* `-> ClearExpiredMount -> AllocEpoch` (generation 1) `-> ClaimMount` (fresh `fenceUntil`)
\* `-> Install`, publishing under generation 0 while `epoch = 1`. BFS reaches the transition via a
\* retired record rather than a `GcFence`; the mechanism is the generation TRANSITION either way, and
\* `_RESULTS.md` `{#findings}` records the scratch re-check proving the counterexample also holds with
\* an `AllocEpoch`-first mount (i.e. that it is not an artifact of the model's epoch-0 bootstrap).
\*
\* Only `TypeOK` and the target are listed, following this module's established sabotage-cfg
\* convention (`_sab_adoptwedge`, `_sab_fenceresurrect`, `_sab_wallclockreclaim` each list exactly
\* `TypeOK` + their own target), so the asserted violation NAME in `run_mount.sh` is unambiguous.
\*
\* BOUNDS: MaxClock = 2, MaxEpoch = 2, MaxToken = 4, TTL = 2, Drift = 0, MaxAdmissions = 3 -- the
\* SAME bounds as the green gate `_v9_recoverygen.cfg`, which is where they are explained (that
\* config is exhaustive only at these). The reds and the green must share bounds or the pair carries
\* no evidence. This counterexample was FIRST found at `_stage1`'s wider bounds and still fires here.
SPECIFICATION Spec
