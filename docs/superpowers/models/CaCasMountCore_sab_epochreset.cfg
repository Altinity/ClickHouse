\* SABOTAGE: zero the durable epoch when the mount is cleared (epoch reuse).
\* MUST violate WriterEpochMonotoneUnique.
SPECIFICATION Spec
CONSTANTS
    Actors = {A, B}
    None = NoneVal
    MaxClock = 4
    MaxEpoch = 3
    MaxToken = 7
    TTL = 2
    SabForeignTakeover = FALSE
    SabEpochReset = TRUE
    SabAdoptWedgeOnTouch = FALSE
    SabAdoptIgnoresFence = FALSE
    Drift = 0
    SabWallClockReclaim = FALSE
    SabEpochGuardOff = FALSE
    SabDecomBlindBypass = FALSE
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT NoTwoServerUuidsOwnSameServerRoot
INVARIANT ForeignUuidNeverAutoTakesOver
INVARIANT WriterEpochMonotoneUnique
INVARIANT SupersededWriterMakesNoMutation
