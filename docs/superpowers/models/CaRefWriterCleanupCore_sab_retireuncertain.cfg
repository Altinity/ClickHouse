\* S4: retire a failed build while its owner-grant PUT outcome is still unresolved. The PUT may
\* already be durable, so retiring loses the only live actor that can resolve and clean its owner.
\* Must violate INV_NO_RETIRE_UNCERTAIN_GRANT.
SPECIFICATION Spec
CONSTANTS
    Builds = {b1}
    MaxEpoch = 2
    SabotageRetireBeforeRemoval = FALSE
    SabotageRetireUncertain = TRUE
    SabotageSuccessorRemovesCurrentEpoch = FALSE
    SabotageCancelBeforeRemovalDurable = FALSE
INVARIANTS
    INV_NO_RETIRE_UNCERTAIN_GRANT
