\* Sabotage (INV-2, "the store's conditional create is the fence"): the lane writes its record with
\* an unconditional PUT instead of a conditional create, so a straggler overwrites the seal that
\* already occupies its slot. Pins the implementation requirement that every ref-log write is a
\* create-if-absent, never a put.
\* Must be RED on INV_NO_GHOST (INV_RECOVERY also breaks).
SPECIFICATION Spec
CONSTANTS
    MaxSeq = 4
    MaxRestarts = 2
    LatePred = TRUE
    SabotageReuseAfterAmbiguous = FALSE
    SabotageGapOnFail = FALSE
    SabotageNoSeal = FALSE
    SabotageBlindPut = TRUE
    SabotageScanIsTruth = FALSE
    SabotageCleanupAboveCkpt = FALSE
    SabotageStaleCkptCorruption = FALSE
    SabotageSealClobbersBase = FALSE
    FrontierSlice = FALSE
    SabotageAckBeforeFrontier = FALSE
    SabotageAllocateBeforeFrontier = FALSE
    SabotageInstallAboveFrontier = FALSE
    SabotageStaleFrontier = FALSE
    SabotageSnapshotAboveFrontier = FALSE
    SabotageSealAboveFrontier = FALSE
    SabotageSnapshotAtSeal = FALSE
\* Narrowed on purpose: INV_RECOVERY also breaks here and is checked first, which would
\* hide the property this config exists to falsify.
INVARIANTS TypeOK INV_NO_GHOST
