\* The fixed rule, GC observer: `Cadence = Period`, `Threshold = 7`. The holder keeps its lease for
\* the whole `TTL`. The observer's clock may gain `Allowance` per lease, plus one banked tick.
\* EXPECTED: green, with the fence at least 1 holder tick after authority ended.
SPECIFICATION Spec
CONSTANTS
    None = NoneVal
    TTL = 4
    Period = 2
    Allowance = 1
    Cadence = 2
    AuthoritySpan = 4
    GainEvery = 4
    MaxClock = 14
    MaxWalk = 14
    Healthy = FALSE
    MaxLatency = 0
    MinMargin = 1
    SabSightingBeforeRead = FALSE
    SabRedecisionStaleSample = FALSE
    SabWrappingStability = FALSE
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    NoFenceInsideAuthority
    NoWriteAfterFence
    FenceMarginAtLeast
