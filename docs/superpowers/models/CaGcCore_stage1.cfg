\* Stage 1: happy path + dedup-reuse-vs-delete race. No failures.
\* 2 writers, 1 hash H, epochs 0..2, single leader (no steal/expiry/wipe).
SPECIFICATION Spec

CONSTANTS
    Writers = {w1, w2}
    Leaders = {L1}
    MaxEpoch = 2
    Retention = 1
    EnableExpiry = FALSE
    EnableSplit = FALSE
    EnableWipe = FALSE

CONSTRAINT StateConstraint

INVARIANT TypeOK
INVARIANT INV_NO_LOSS
INVARIANT INV_NO_DANGLE
INVARIANT INV_NO_ABA
