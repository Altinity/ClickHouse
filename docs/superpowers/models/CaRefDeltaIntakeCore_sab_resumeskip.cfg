\* Sabotage S1: a page may advance the scan position past a durable key without returning it
\* (opaque-continuation-token over-scan). Must violate NoMissedFold (I1). Must be RED.
SPECIFICATION Spec
CONSTANTS
    T1 = t1
    T2 = t2
    MaxSeq = 3
    SabotageResumeSkip = TRUE
    SabotageAdoptBeforeCommit = FALSE
    SabotageCleanupIgnoresCursor = FALSE
    EnableLatePredecessorPut = FALSE
INVARIANT TypeOK
INVARIANT NoMissedFold
INVARIANT ExactlyOnce
INVARIANT LosingCommitAdoptsNothing
