\* The drain takes its honest fresh cut, but ref-plan intake consumes the earlier observed catalog
\* snapshot. Must be RED on the compositional provenance invariant.
SPECIFICATION Spec
CONSTANTS
    SabotageFoldBypassesDrain = FALSE
    SabotageRebuildBypassesDrain = FALSE
    SabotageDeferBypassesDrain = FALSE
    SabotageContinueAfterUnknown = FALSE
    SabotageStaleDeleteAfterSuccessorHold = FALSE
    SabotageRebuildFromUnadoptedSeal = FALSE
    SabotageIntakeUsesPreDrainCut = TRUE
    SabotageIntakeUsesStaleToken = FALSE
INVARIANT TypeOK
INVARIANT DrainBeforeDecision
INVARIANT DeleteUsesCurrentAdoptedProof
INVARIANT ExactCatalogCAS
INVARIANT IntakeConsumesFreshPostDrainCut
