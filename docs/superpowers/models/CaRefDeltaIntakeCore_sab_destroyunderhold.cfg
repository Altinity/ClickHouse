\* Sabotage: destruction ignores a CARRIED hold — the hold's whole point is that it outlives the one
\* round in which the shape was detectable.
\*
\* Trace (verified, 20 states): round 1's hint returns the witness, the probe finds the gap and HOLDS
\* the namespace (revoking the frontier proof it contradicts); round 2's hint says nothing about it,
\* so the same absent probe now reads as an honest frontier and both namespaces are "proven". The
\* hold is still live, and only this toggle lets `Condemn` past it.
\* Must be RED on HoldSuppresses. Control: `_ctl_holdsuppresses` (identical, no toggle).
SPECIFICATION Spec
CONSTANTS
    T1 = t1
    T2 = t2
    MaxSeq = 3
    EdgeOf <- EdgeRoles
    HintSilent = FALSE
    HintComplete = FALSE
    CkptWitness = FALSE
    EnableHiddenHole = TRUE
    SabotageSkipQuietProbe = FALSE
    SabotageRebuildDropsHold = FALSE
    SabotageClearHoldOnAbsent = FALSE
    SabotageDestroyUnderHold = TRUE
    SabotageDeleteIgnoresIndeg = FALSE
    SabotageAdoptBeforeCommit = FALSE
    SabotageCleanupIgnoresCursor = FALSE
    PlanOnly = FALSE
    SabotageAdapterMints = FALSE
INVARIANT TypeOK
INVARIANT HoldSuppresses
