\* 2026-07-28 v9 POSITIVE GATE for the recovery-generation layer (spec
\* 2026-07-27-cas-ref-chain-complete-cut-design.md §3 "Recovery ownership", §9's r9-5): every
\* sabotage flag OFF, `RecoveryGenOn = TRUE`. This is the config the main implementation plan cites
\* before touching `slot-occupy`, the `_ckpt` CAS or the install path.
\*
\* THE SEVEN LISTED INVARIANTS. Six are PRE-EXISTING and unchanged; only `AckedOpsAreDurable` is new:
\*   TypeOK
\*   NoTwoServerUuidsOwnSameServerRoot
\*   ForeignUuidNeverAutoTakesOver
\*   SupersededWriterMakesNoMutation             -- knowledge-based exclusivity
\*   GlobalSupersededWriterMakesNoMutation       -- global-truth exclusivity: the target of BOTH
\*                                                  `_sab_staleinstall` and `_sab_wedgeretryoldgen`,
\*                                                  so it MUST be listed here or those two reds
\*                                                  would prove nothing about the honest protocol
\*   AckedOpsAreDurable                          -- the target of `_sab_slotnocompare`
\* `NoPermanentWedge` is listed too: the new layer must not manufacture a wedge (it never assigns
\* `wedged`, and this is the cheap mechanical confirmation).
\*
\* TWO INVARIANTS ARE DROPPED, both for causes that PREDATE this round and are already documented at
\* length in `CaCasMountCore_stage1.cfg`: `WriterEpochMonotoneUnique` (the ungated `WipeEpoch` alone
\* makes `epoch` legitimately read below a value already in `wrote`, at depth 6) and
\* `FenceCostsEpoch` (`RemintEpoch`'s honest branch mints a hardcoded literal `1` with no
\* distinctness protection against a historically fenced pair). Neither has anything to do with the
\* recovery-generation layer, and `_stage1.cfg` -- which still runs with `RecoveryGenOn = FALSE` --
\* remains where that pre-existing residual gap is recorded. Repeating the analysis here would
\* duplicate it; see `CaCasMountCore_RESULTS.md`'s "Accepted residual gap" section.
\*
\* NON-VACUITY. A green here is only worth something if the honest machinery actually ran, so two
\* dedicated witness configs pin the two branches a green could otherwise be silent about:
\* `_witness_genrefused` (the post-I/O recheck really refuses a returning old-generation result) and
\* `_witness_sealrejected` (a lane's retry really meets a successor's `EpochSeal` and is conclusively
\* rejected -- plan task 1's second hand-off). `COVERAGE=1 bash run_mount.sh` additionally reports
\* per-action invocation counts for this config.
\*
\* BOUNDS, and why they are SMALLER than `_stage1`'s. At `_stage1`'s bounds this config has no
\* verdict at all: it passed 46 M distinct states at depth 19 with a still-growing queue after nine
\* minutes. Smaller NUMERIC bounds alone barely helped, because the recovery-generation variables are
\* ORTHOGONAL to the mount machinery and multiply it rather than extend it -- so the round added
\* `MaxAdmissions` (a state-space bound in the declared spirit of `epochWiped`'s one-shot `WipeEpoch`
\* guard; see its comment in the module) and settled at `MaxClock = 2, MaxEpoch = 2, MaxToken = 4,
\* TTL = 2, Drift = 0, MaxAdmissions = 3`, where the search is EXHAUSTIVE. Numbers, and the whole
\* measured sweep, are in `CaCasMountCore_RESULTS.md`.
\*
\* What those bounds still contain: `TTL = 2` with `MaxClock = 2` is one full expire-and-remount
\* cycle, which is exactly what every counterexample in this round needs (each is a GENERATION
\* TRANSITION with an outstanding result or lane); `MaxEpoch = 2` gives two transitions;
\* `MaxToken = 4` gives four mount writes against a longest trace using two. Every one of the three
\* sabotages and both witnesses is red HERE, at these same bounds, not only at wider ones -- so the
\* green and the reds are directly comparable, which is the property that actually carries evidence.
\* `Actors = {A, B}` is kept (not reduced to `{A}`, which would be cheaper) precisely so
\* `NoTwoServerUuidsOwnSameServerRoot` and `ForeignUuidNeverAutoTakesOver` stay non-vacuous here.
\*
\* `Drift = 0` deliberately: drift is `_rev6_observe`'s subject, and that config already does not
\* complete exhaustively (documented, pre-existing) -- pairing `Drift > 0` with nine new actions
\* would produce a second config with no verdict, which is worse than a smaller honest one.
SPECIFICATION Spec
CONSTANTS
    Actors = {A, B}
    None = NoneVal
    MaxClock = 2
    MaxEpoch = 2
    MaxToken = 4
    TTL = 2
    SabForeignTakeover = FALSE
    SabEpochReset = FALSE
    SabAdoptWedgeOnTouch = FALSE
    SabAdoptIgnoresFence = FALSE
    Drift = 0
    SabWallClockReclaim = FALSE
    SabEpochGuardOff = FALSE
    SabDecomBlindBypass = FALSE
    RecoveryGenOn = TRUE
    SabStaleInstall = FALSE
    SabWedgeRetryOldGen = FALSE
    SabSlotNoByteCompare = FALSE
    MaxAdmissions = 3
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT NoTwoServerUuidsOwnSameServerRoot
INVARIANT ForeignUuidNeverAutoTakesOver
INVARIANT SupersededWriterMakesNoMutation
INVARIANT GlobalSupersededWriterMakesNoMutation
INVARIANT AckedOpsAreDurable
INVARIANT NoPermanentWedge
