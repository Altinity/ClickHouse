\* Sabotage: §10's rejected alternative made executable — removal retains a per-dead-life record (a
\* `seq_floor`) instead of deleting the catalog entry.
\*
\* Must be RED on INV_BOUNDED_CATALOG. This is the user's churn objection as a counterexample: floors
\* for dead names never retire, so the catalog carries a record for a name that is not `Creating`,
\* `Live` or `Removing`, and under create/drop churn the count grows with the cycles instead of
\* staying at the live-name count. Control: `_churn` (the same three cycles, entries deleted).
SPECIFICATION Spec
CONSTANTS
    MaxInc = 3
    SabotageJanitorEatsNewborn = FALSE
    SabotageZombieGoLive = FALSE
    SabotageReconcileLiveCreator = FALSE
    SabotageReconcileStaleToken = FALSE
    SabotageSameIncarnationRebirth = FALSE
    SabotageFloorRetainsDeadName = TRUE
    SabotageDeleteWithoutEvidence = FALSE
    SabotageDeleteWithForeignEvidence = FALSE
    SabotageDeleteUnderHold = FALSE
INVARIANT TypeOK
INVARIANT INV_BOUNDED_CATALOG
