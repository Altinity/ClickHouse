\* Both stale stamps on (`SabSightingBeforeRead`, `SabRedecisionStaleSample`), every read at
\* most 3 ticks after its sample.
\* EXPECTED: `NoFenceInsideAuthority` violated. The observer's clock may gain one tick per lease, so
\* a walk of 3 is enough; `_stale_stamps_short_walk` is the green twin.
\* Trace: `ObsSample` at 0, the holder renews at 3, `ObsRead` sees that token and `ObsDecide` dates it
\* 0, `ObsSample` at observer tick 7 passes the threshold and `ObsFenceWrite` lands at holder tick 6
\* with authority until 7.
