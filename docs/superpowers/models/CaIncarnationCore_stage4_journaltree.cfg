\* Stage 4 (supplement): MaxLog=3 + a tree on 1 shard — covers the JOURNALED retire→fence→recheck→delete tail (unreachable at MaxLog=2) and FGCommit's tree-reachability rebuild (dead at TreeHashes={}). Companion to stage4_small (which covers debris + the 2-shard cut).
SPECIFICATION Spec
