\* THE GATE. The honest catalog: creation's three conditional writes, token-exact fence-terminal
\* reconciliation, removal with terminal-fold evidence, one cleanup attempt, exact observed-row CAS,
\* no durable hold, and
\* fresh incarnations every life. Every ADVERSARY is on — cleanup leaves remnants nondeterministically,
\* the janitor is lazy and may omit any object forever, the owning fence may go terminal at any point
\* of any life, and a reconciler may sample the catalog at any time. Must be GREEN on all six
\* invariants. MaxInc = 2 keeps this the lifecycle gate; `_churn` runs the same rules over three
\* full cycles.
SPECIFICATION Spec
CONSTANTS
    MaxInc = 2
    SabotageJanitorEatsNewborn = FALSE
    SabotageZombieGoLive = FALSE
    SabotageReconcileLiveCreator = FALSE
    SabotageReconcileStaleToken = FALSE
    SabotageSameIncarnationRebirth = FALSE
    SabotageFloorRetainsDeadName = FALSE
    SabotageDeleteWithoutEvidence = FALSE
    SabotageDeleteWithForeignEvidence = FALSE
    SabotageDeleteUnderHold = FALSE
    SabotageDeleteWithoutExactObservation = FALSE
    SabotageDeleteWithoutCleanupAttempt = FALSE
INVARIANT TypeOK
INVARIANT INV_NO_ALIAS
INVARIANT INV_NEWBORN_SAFE
INVARIANT INV_BOUNDED_CATALOG
INVARIANT INV_RECONCILE_SAFE
INVARIANT INV_REMOVAL_DELETE_PROVED
