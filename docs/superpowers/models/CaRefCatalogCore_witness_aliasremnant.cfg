\* WITNESS for `_sab_sameincarnationrebirth`, negated so that a VIOLATION is the evidence. Identical
\* settings; the only invariant is
\*
\*     WITNESS_ALIAS_REMNANT == ~aliasedOnRemnant
\*
\* so RED means TLC found a behaviour in which a COMPLETED removal left a `_log`/`_snap` remnant
\* behind and a reborn incarnation then read it. That is the route the inertness argument is actually
\* about — `EntryDelete` deliberately skips the physical-empty proof, so this remnant is the expected
\* state of the pool, not a fault. `_sab_sameincarnationrebirth`'s own counterexample takes a shorter
\* route (a reconciled creator's surviving `_ckpt`) and would leave this one unexercised.
SPECIFICATION Spec
CONSTANTS
    MaxInc = 3
    SabotageJanitorEatsNewborn = FALSE
    SabotageZombieGoLive = FALSE
    SabotageReconcileLiveCreator = FALSE
    SabotageReconcileStaleToken = FALSE
    SabotageSameIncarnationRebirth = TRUE
    SabotageFloorRetainsDeadName = FALSE
    SabotageDeleteWithoutEvidence = FALSE
    SabotageDeleteWithForeignEvidence = FALSE
    SabotageDeleteUnderHold = FALSE
    SabotageDeleteWithoutExactObservation = FALSE
    SabotageDeleteWithoutCleanupAttempt = FALSE
INVARIANT TypeOK
INVARIANT WITNESS_ALIAS_REMNANT
