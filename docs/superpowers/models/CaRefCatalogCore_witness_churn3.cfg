\* NON-VACUITY WITNESS for `_churn`, negated so that a VIOLATION is the evidence. Identical settings
\* to `_churn`; the only invariant is
\*
\*     WITNESS_CHURN == ~(lives = MaxInc /\ objects # {})
\*
\* so RED means TLC found a behaviour in which all three create -> drop -> recreate cycles completed
\* WHILE ref-layer debris was still outstanding. That is the shape the churn green has to be about:
\* a lifecycle that quietly wedged at the first remnant — the physical-empty-proof design — would
\* also be green on every safety invariant, and would be worthless.
SPECIFICATION Spec
CONSTANTS
    MaxInc = 3
    SabotageJanitorEatsNewborn = FALSE
    SabotageZombieGoLive = FALSE
    SabotageReconcileLiveCreator = FALSE
    SabotageReconcileStaleToken = FALSE
    SabotageSameIncarnationRebirth = FALSE
    SabotageFloorRetainsDeadName = FALSE
    SabotageDeleteWithoutEvidence = FALSE
    SabotageDeleteWithForeignEvidence = FALSE
    SabotageDeleteUnderHold = FALSE
INVARIANT TypeOK
INVARIANT WITNESS_CHURN
