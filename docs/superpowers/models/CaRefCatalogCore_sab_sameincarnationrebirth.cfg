\* Sabotage: incarnation freshness dropped — a new life REUSES the dead life's incarnation instead of
\* minting, which is what the pool looked like before INV-3 scoped the ref layer by incarnation.
\*
\* Must be RED on INV_NO_ALIAS. This is the config that earns `EntryDelete`'s missing physical-empty
\* proof: removal is allowed to leave debris behind ONLY because a future life can never name it.
\* Reuse the number and the very first thing the new life does — the recovery open of spec §4 — reads
\* the dead life's `_log`/`_snap` at its own prefix. Control: `_safe` (same lifecycle, fresh mints).
SPECIFICATION Spec
CONSTANTS
    MaxInc = 3
    SabotageJanitorEatsNewborn = FALSE
    SabotageReconcileLiveCreator = FALSE
    SabotageReconcileStaleToken = FALSE
    SabotageEntryBeforeCkptDelete = FALSE
    SabotageSameIncarnationRebirth = TRUE
    SabotageFloorRetainsDeadName = FALSE
INVARIANT TypeOK
INVARIANT INV_NO_ALIAS
