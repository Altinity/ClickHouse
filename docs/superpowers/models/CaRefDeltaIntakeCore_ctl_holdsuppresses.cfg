\* Green control for the three hold sabotages. Exact CTE detects the hidden committed key without a
\* LIST witness; honest intake keeps the hold and suppresses destruction. Must be GREEN.
SPECIFICATION Spec
CONSTANTS
    T1 = t1
    T2 = t2
    MaxSeq = 2
    EdgeOf <- EdgeRoles
    HintSilent = FALSE
    HintComplete = FALSE
    EnableHiddenHole = TRUE
    SabotageRebuildDropsHold = FALSE
    SabotageClearHoldOnAbsent = FALSE
    SabotageDestroyUnderHold = FALSE
    SabotageDeleteIgnoresIndeg = FALSE
    SabotageAdoptBeforeCommit = FALSE
    SabotageCleanupIgnoresCursor = FALSE
    PlanOnly = FALSE
    SabotageAdapterMints = FALSE
    SabotageSkipCatalogTarget = FALSE
    SabotageSkipHeldRetry = FALSE
INVARIANT TypeOK
INVARIANT CteExact
INVARIANT RoundCteNoRegression
INVARIANT HoldReleaseRequiresFold
INVARIANT HoldSuppresses
INVARIANT EveryCatalogTargetAttempted
INVARIANT EveryCarriedHoldRetried
