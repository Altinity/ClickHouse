\* Green control for the three hold sabotages: identical settings to `_sab_destroyunderhold`,
\* `_sab_rebuilddropshold` and `_sab_clearholdonabsent`, with no toggle. `HoldSuppresses` alone is
\* checked, because `NoAckedLoss` is red here for an unrelated reason (`_witness_corruptgap`) and
\* would mask the property under test. Must be GREEN.
SPECIFICATION Spec
CONSTANTS
    T1 = t1
    T2 = t2
    MaxSeq = 3
    EdgeOf <- EdgeRoles
    HintSilent = FALSE
    HintComplete = FALSE
    CkptWitness = FALSE
    EnableHiddenHole = TRUE
    SabotageSkipQuietProbe = FALSE
    SabotageRebuildDropsHold = FALSE
    SabotageClearHoldOnAbsent = FALSE
    SabotageDestroyUnderHold = FALSE
    SabotageDeleteIgnoresIndeg = FALSE
    SabotageAdoptBeforeCommit = FALSE
    SabotageCleanupIgnoresCursor = FALSE
INVARIANT TypeOK
INVARIANT HoldSuppresses
