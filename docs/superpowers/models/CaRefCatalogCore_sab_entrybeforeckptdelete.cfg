\* Sabotage: INV-4's removal ordering inverted — the catalog entry is deleted while its `_ckpt`
\* object still exists, instead of exact-token-deleting `_ckpt` first and the entry LAST.
\*
\* Must be RED on INV_CKPT_ORDER. The entry is the only record that names the incarnation and
\* authorizes the exact-token delete, so once it is gone the surviving `_ckpt` can never be addressed
\* by token again — it is reachable only through the zero-trust listing (§1), which may omit it
\* forever. Read the RESULTS entry for the honest scope of this one: with incarnations unique the
\* orphan is inert, so the damage is a permanent leak, not aliasing; the aliasing case needs this
\* sabotage AND `_sab_sameincarnationrebirth` (the `ckptOf` disjunct of `ReadOwn`).
\* Control: `_safe`.
SPECIFICATION Spec
CONSTANTS
    MaxInc = 3
    SabotageJanitorEatsNewborn = FALSE
    SabotageReconcileLiveCreator = FALSE
    SabotageReconcileStaleToken = FALSE
    SabotageEntryBeforeCkptDelete = TRUE
    SabotageSameIncarnationRebirth = FALSE
    SabotageFloorRetainsDeadName = FALSE
INVARIANT TypeOK
INVARIANT INV_CKPT_ORDER
