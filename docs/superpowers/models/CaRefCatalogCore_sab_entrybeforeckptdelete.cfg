\* Sabotage: INV-4's removal ordering inverted — the catalog entry is deleted while its `_ckpt`
\* object still exists, instead of exact-token-deleting `_ckpt` first and the entry LAST.
\*
\* Must be RED on INV_CKPT_ORDER. The entry is the only record that names the incarnation and
\* authorizes the exact-token delete, so once it is gone the surviving `_ckpt` can never be addressed
\* by token again — it is reachable only through the zero-trust listing (§1), which may omit it
\* forever. Read the RESULTS entry for the honest scope of this one: with incarnations unique the
\* orphan is inert, so the damage is a permanent leak, not aliasing. Note also what this sabotage is
\* NOT needed for — a stranded `_ckpt` arises on the honest reconciliation path too (a reconciled
\* `Creating` leaves one behind with no entry naming it), which is the residue the rebirth
\* counterexample actually aliases onto. That one is not an ordering violation, because a reconciled
\* `Creating` never reached `Removing` and so no exact-token delete was ever owed; INV_CKPT_ORDER is
\* scoped to the removal path for exactly that reason.
\*
\* Trace (verified, 7 states): a complete honest life — `Create`, `CkptCreate`, `GoLive`, `Drop`,
\* `TerminalFoldAndCleanup` — then `EntryDelete` with `ckptOf = {1}` still populated.
\* Control: `_safe`.
