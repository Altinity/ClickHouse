\* SABOTAGE: the design's ORDER is inverted -- confirm and promote BEFORE the receiver's +1 is
\* durable.  The guarded theorem stays vacuously satisfied (its rDurableBefore antecedent is
\* false), so this cfg checks the antecedent-free PromotedNeverDangles, which TLC MUST report
\* violated -- proving "publish, THEN confirm" is load-bearing, not incidental ordering.
SPECIFICATION Spec
CONSTANTS
    Receivers = {r1}
    MaxId = 5
    MaxRound = 5
    MaxHoles = 0
    SabotageNoGate1 = FALSE
    SabotageStaleCache = FALSE
    SabotageNoPoison = FALSE
    SabotageNoFence = FALSE
    SabotagePublishAfterConfirm = TRUE
INVARIANTS
    PromotedNeverDangles
CHECK_DEADLOCK FALSE
