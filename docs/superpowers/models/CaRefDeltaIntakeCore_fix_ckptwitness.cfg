\* THE `_ckpt` WITNESS, red-to-green against `_sab_cleanupignorescursor`. Same broken cleanup, plus a
\* second witness source: `_ckpt.checkpoint` coverage. A log above the cursor that `_ckpt` covers
\* cannot have been legitimately cleaned, so its absence is the impossible shape — detected WITHOUT
\* the hint, and the namespace holds instead of looking quiet. Green here means the whole
\* premature-cleanup class degrades from data loss to a hold.
\*
\* This began as the model's proposal and is now spec text (§5, commits abd77cd4738 / 33b301eacb8).
\* The toggle survives adoption on purpose: with it OFF the sabotage is RED and with it ON this
\* config is GREEN, so the rule stays separable evidence rather than an assumption.
SPECIFICATION Spec
CONSTANTS
    T1 = t1
    T2 = t2
    MaxSeq = 3
    EdgeOf <- EdgeRoles
    HintSilent = FALSE
    HintComplete = FALSE
    CkptWitness = TRUE
    EnableHiddenHole = FALSE
    SabotageSkipQuietProbe = FALSE
    SabotageRebuildDropsHold = FALSE
    SabotageClearHoldOnAbsent = FALSE
    SabotageDestroyUnderHold = FALSE
    SabotageDeleteIgnoresIndeg = FALSE
    SabotageAdoptBeforeCommit = FALSE
    SabotageCleanupIgnoresCursor = TRUE
INVARIANT TypeOK
INVARIANT NoAckedLoss
INVARIANT NoMissedFold
INVARIANT ExactlyOnce
INVARIANT LosingCommitAdoptsNothing
INVARIANT HoldSuppresses
