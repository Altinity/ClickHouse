\* PROPOSED FIX, red-to-green against `_sab_cleanupignorescursor`. Same broken cleanup, plus one
\* extra witness source the spec does not currently name: `_ckpt.checkpoint` coverage. A log above
\* the cursor that `_ckpt` covers cannot have been legitimately cleaned, so its absence is the
\* impossible shape — detected WITHOUT the hint, and the namespace holds instead of looking quiet.
