\* rev.6 late-delivery-under-an-existing-snapshot demo (spec
\* 2026-07-13-cas-ref-lease-exclusivity-rev6-design.md): a late predecessor PUT lands under an
\* existing snapshot and coverage-at-birth drops it from the oracle (droppedEver).
\*
\* AMENDED 2026-07-14: expected GREEN, not a violation. `WriterPublishSnapshot` now excludes
\* droppedEver from its own fold (CoveredFold), so every published snapshot already reflects the
\* rev.6 oracle as of its own publish time. Given that fix, NoDivergentFold does not falsify here:
\* verified exhaustively at MaxSeq=5 (35.6M states, 0 left on queue), MaxSeq=6 abandoned after 426.9M
\* states / 5 min with no violation found (state space explodes ~10x per +1 to MaxSeq -- not a
\* practical exhaustive bound), and a 1M-trace random simulation at MaxSeq=12/depth=60 (183.5M states
\* checked) found none either. This is an abstraction-limit result, not a stronger-than-designed
\* system property: this model serializes the reader against ordinary writes (ReaderInactive gates
\* WriterBirth/Mut/Remove/Rebirth/Fail + GcComplete, and rPhase never returns to "idle" once a reader
\* starts) in a way the real system does not -- a real reader observes a live, concurrently-mutating
\* table. WriterPublishSnapshot/GcCleanupLog/GcCleanupSnap/LatePredecessorPut are NOT reader-gated
\* here (by design, "off-lane"), but the drop's own X>L precondition plus the model's kind-major key
\* ordering (_log < _snap regardless of id) plus GcCleanupSnap never deleting the newest snapshot
\* together force any reader's eventual pick to be >= X > L for any L in play, so a dropped id can
\* only ever land in Reconstruct's base (already excluded by CoveredFold), never its tail. The real
\* system's in-flight T_mat-violation transient (accepted, spec's T_mat/seal sections) is simply not
\* expressible in this serialized-reader model -- do not read this GREEN as "the transient can't
\* happen for real". MaxSeq=5 (not 4) is used so the drop-then-republish-above-it shape actually fits.
SPECIFICATION Spec
CONSTANTS
    MaxSeq = 5
    MaxRestarts = 2
    SabotageDeleteBeforeSnapshot = FALSE
    SabotageVanishIsCorruption = FALSE
    SabotageRecreateBeforeCompleted = FALSE
    SabotageRemountKeepsOldEpoch = FALSE
    LatePred = TRUE
    Rev6MountRule = TRUE
INVARIANTS TypeOK NoDivergentFold
