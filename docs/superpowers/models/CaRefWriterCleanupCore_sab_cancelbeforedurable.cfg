\* S3: cancel a local build before the namespace-removal transaction is durable ->
\* INV_NAMESPACE_REMOVAL_COMPLETE MUST be violated (the cancelled build is excluded from the
\* removal transaction's owner enumeration, so namespaceState reaches "Removed" while its
\* precommit remains a durable, never-cleaned owner).
SPECIFICATION Spec
CONSTANTS
    Builds = {b1, b2, b3}
    MaxEpoch = 2
    SabotageRetireBeforeRemoval = FALSE
    SabotageRetireUncertain = FALSE
    SabotageSuccessorRemovesCurrentEpoch = FALSE
    SabotageCancelBeforeRemovalDurable = TRUE
INVARIANTS
    INV_NAMESPACE_REMOVAL_COMPLETE
