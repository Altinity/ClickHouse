\* Honest perpetual janitor: the LIST page deposits its physical life id, the post-page catalog cut
\* nominates that id, rebirth mints a fresh id, and a stale resumed delete still targets the deposited
\* physical id rather than re-deriving the logical name. GREEN.
\* MaxInc = 2 is tight: only one Recreate is reachable.
SPECIFICATION Spec
CONSTANTS
    MaxInc = 2
    SabotageNoIncarnation = FALSE
    SabotageRederive = FALSE
INVARIANT TypeOK
INVARIANT NominationCapturedPhysicalId
INVARIANT NoLiveDataDeleted
