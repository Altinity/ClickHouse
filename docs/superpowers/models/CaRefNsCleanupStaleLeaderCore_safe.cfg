\* Honest rebirth (spec 2026-07-27-cas-ref-chain-complete-cut-design.md §2 INV-3, §3 Lifecycles):
\* recreation always mints a fresh incarnation, and the resumed pass always targets what it captured
\* at deposition, never re-derived. The stale leader's unconditional, unguarded physical-delete pass
\* -- scoped only to that captured incarnation, never re-checked at delete time -- structurally
\* cannot reach the reborn life's data. GREEN.
\* MaxInc = 2 is tight, not a convenience: only one Recreate is ever reachable (entry never returns
\* to `absent` after rebirth), so a third incarnation value is dead headroom.
SPECIFICATION Spec
CONSTANTS
    MaxInc = 2
    SabotageNoIncarnation = FALSE
    SabotageRederive = FALSE
INVARIANT TypeOK
INVARIANT NoLiveDataDeleted
