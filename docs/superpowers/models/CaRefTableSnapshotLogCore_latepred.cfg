\* Adversarial: honest protocol plus LatePredecessorPut — a fenced predecessor's ref-log PUT
\* materializes below a snapshot that already covered past its id (spec §late-predecessor-put).
\* EXPECTED-FAIL: INV_RECOVERY must produce the documented Phase-1 counterexample. The runner treats
\* "violation found" as PASS for this config. Do NOT strengthen the model to make this green: that
\* would assume a mount fence cancels an already-submitted S3 request, which it cannot.
SPECIFICATION Spec
CONSTANTS
    MaxSeq = 4
    MaxRestarts = 2
    SabotageDeleteBeforeSnapshot = FALSE
    SabotageVanishIsCorruption = FALSE
    SabotageRecreateBeforeCompleted = FALSE
    LatePred = TRUE
INVARIANT TypeOK
INVARIANT INV_RECOVERY
INVARIANT INV_NOFAIL
INVARIANT INV_RECREATE
