\* Sabotage: the pre-C1 code -- the scheduler never exits on a natural
\* Vanished transition => MUST VIOLATE GcExitsAfterVanished (a
\* VanishedReplaced pool with the scheduler running forever).
SPECIFICATION FairSpec
CONSTANTS
  EnableTrip2 = TRUE
  DrainGate = TRUE
  EnableGcSelfExit = FALSE
INVARIANT TypeOK
PROPERTY GcExitsAfterVanished
CHECK_DEADLOCK FALSE
