\* Sabotage: the GC scheduler never exits on a natural Vanished transition
\* => MUST VIOLATE GcExitsAfterVanished.
SPECIFICATION FairSpec
CONSTANTS
  EnableTrip2 = TRUE
  DrainGate = TRUE
  EnableGcSelfExit = FALSE
  RenewChecksIntent = TRUE
  ReadinessGate = TRUE
  LiveChecksPending = TRUE
  ReclaimChecksPending = TRUE
  ArmChecksTerminal = TRUE
  AckSnapshot = TRUE
  ReclaimTrips = TRUE
  MaxGen = 2
INVARIANT TypeOK
PROPERTY GcExitsAfterVanished
CHECK_DEADLOCK FALSE
