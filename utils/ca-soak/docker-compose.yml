# CA soak-test cluster: two ClickHouse replicas sharing ONE content-addressed (CA) pool on RustFS,
# coordinated by a single-node Keeper. Proves a ReplicatedMergeTree over the CA pool replicates
# node1 -> node2.
#
# Image choice: the host-built CA-capable binary (../../build/programs/clickhouse) is mounted over
# /usr/bin/clickhouse in a stock clickhouse/clickhouse-server image. The host binary needs only
# GLIBC_2.4 and links just libc/libpthread/librt/libm/libdl, so it runs fine on the stock image's
# glibc (Ubuntu base). The stock entrypoint and config skeleton are reused; the clickhouse-keeper /
# clickhouse-server symlinks resolve to the mounted binary.

services:
  rustfs1:
    image: rustfs/rustfs:1.0.0-beta.8
    command: server --address 0.0.0.0:11121
    env_file: configs/rustfs.env
    expose:
      - "11121"
    # Named volume so the orphan-reaper sidecar can share it (RustFS beta leaks overwrite-orphan
    # data dirs and does not reclaim them — #3). Removed by `docker compose down -v` each run.
    volumes:
      - rustfs_data:/data

  # CA soak orphan reaper (test-harness only, #3): reclaims RustFS's un-reclaimed overwrite-orphan
  # <uuid>/ data dirs under roots/. Debian sidecar (GNU find/du/sort) sharing rustfs1's data volume.
  # Safety is in the script: scoped to roots/, keep-newest + grace window (see the spec).
  reaper:
    image: debian:stable-slim
    depends_on:
      - rustfs1
    volumes:
      - rustfs_data:/data
      - ./scripts/orphan_reaper.sh:/orphan_reaper.sh:ro
    environment:
      GRACE_SEC: "120"
      REAP_INTERVAL: "300"
    entrypoint: ["bash", "/orphan_reaper.sh", "/data/test/soak_pool/roots"]

  # One-shot: wait for RustFS, then create the `test` bucket the CA pool path lives under.
  createbucket:
    image: minio/mc:latest
    depends_on:
      - rustfs1
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set carustfs http://rustfs1:11121 clickhouse clickhouse; do
        echo 'waiting for rustfs...'; sleep 1;
      done;
      /usr/bin/mc mb --ignore-existing carustfs/test;
      echo 'bucket ready';
      "

  keeper1:
    image: clickhouse/clickhouse-server:25.8
    entrypoint: ["/usr/bin/clickhouse", "keeper", "--config-file", "/etc/clickhouse-keeper/keeper.xml"]
    volumes:
      - ../../build/programs/clickhouse:/usr/bin/clickhouse:ro
      - ./configs/keeper.xml:/etc/clickhouse-keeper/keeper.xml:ro
    expose:
      - "9181"

  ch1:
    image: clickhouse/clickhouse-server:25.8
    # Skip the entrypoint's default-user lockdown so the open `default` user keeps network access
    # (the entrypoint otherwise disables it when no password is set, breaking the HTTP smoke).
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    depends_on:
      - keeper1
      - rustfs1
      - createbucket
    volumes:
      - ../../build/programs/clickhouse:/usr/bin/clickhouse:ro
      - ./configs/storage_conf.xml:/etc/clickhouse-server/config.d/storage_conf.xml:ro
      - ./configs/keeper_client.xml:/etc/clickhouse-server/config.d/keeper_client.xml:ro
      - ./configs/macros_node1.xml:/etc/clickhouse-server/config.d/macros.xml:ro
    ports:
      - "8123:8123"
      - "9000:9000"
    # ch1 must finish mounting the shared CA pool BEFORE ch2 mounts it. The CA capability probe
    # writes a fixed key (<pool>/_probe/token); two servers probing the same shared pool
    # concurrently race on that key and one gets PreconditionFailed and aborts. Gating ch2 on
    # ch1's health serializes the two mounts and avoids the probe race.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 2s
      timeout: 3s
      retries: 45
      start_period: 5s

  ch2:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    depends_on:
      keeper1:
        condition: service_started
      rustfs1:
        condition: service_started
      createbucket:
        condition: service_completed_successfully
      ch1:
        condition: service_healthy
    volumes:
      - ../../build/programs/clickhouse:/usr/bin/clickhouse:ro
      - ./configs/storage_conf.xml:/etc/clickhouse-server/config.d/storage_conf.xml:ro
      - ./configs/keeper_client.xml:/etc/clickhouse-server/config.d/keeper_client.xml:ro
      - ./configs/macros_node2.xml:/etc/clickhouse-server/config.d/macros.xml:ro
    ports:
      - "8124:8123"
      # Host port 9001 can be occupied by a stray RustFS process; 9002 avoids the collision.
      # The smoke only uses HTTP (8123/8124); the native port is exposed for convenience.
      - "9002:9000"

volumes:
  rustfs_data:
