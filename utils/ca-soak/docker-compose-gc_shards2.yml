# CA soak Phase-4 gc_shards=2 variant.
# Identical to docker-compose.yml except storage_conf_gc_shards2.xml is mounted for both ch1 and ch2
# so gc_shards=2 is active from pool creation. Use via:
#   docker compose -f docker-compose-gc_shards2.yml up -d / down -v
#
# The default docker-compose.yml (gc_shards=1) is UNCHANGED.

services:
  rustfs1:
    image: rustfs/rustfs:1.0.0-rc.3
    command: server --address 0.0.0.0:11121
    env_file: configs/rustfs.env
    expose:
      - "11121"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  createbucket:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - rustfs1
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set carustfs http://rustfs1:11121 clickhouse clickhouse; do
        echo 'waiting for rustfs...'; sleep 1;
      done;
      /usr/bin/mc mb --ignore-existing carustfs/test;
      until /usr/bin/mc ls carustfs/test >/dev/null 2>&1; do
        echo 'waiting for bucket to become visible...'; sleep 1;
      done;
      echo 'bucket ready';
      "

  keeper1:
    image: clickhouse/clickhouse-server:25.8
    entrypoint: ["/usr/bin/clickhouse", "keeper", "--config-file", "/etc/clickhouse-keeper/keeper.xml"]
    volumes:
      - ../../build/programs/clickhouse:/usr/bin/clickhouse:ro
      - ./configs/keeper.xml:/etc/clickhouse-keeper/keeper.xml:ro
    expose:
      - "9181"

  ch1:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    depends_on:
      keeper1:
        condition: service_started
      rustfs1:
        condition: service_started
      createbucket:
        condition: service_completed_successfully
    mem_limit: 28g
    volumes:
      - ../../build/programs/clickhouse:/usr/bin/clickhouse:ro
      - ./configs/storage_conf_gc_shards2_ch1.xml:/etc/clickhouse-server/config.d/storage_conf.xml:ro
      - ./configs/fsck_only_ca.xml:/etc/clickhouse-server/fsck-only.xml:ro
      - ./configs/keeper_client.xml:/etc/clickhouse-server/config.d/keeper_client.xml:ro
      - ./configs/macros_node1.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ./configs/memory.xml:/etc/clickhouse-server/config.d/memory.xml:ro
      - ./configs/ca_gc_log.xml:/etc/clickhouse-server/config.d/ca_gc_log.xml:ro
      - ./configs/ca_event_log.xml:/etc/clickhouse-server/config.d/ca_event_log.xml:ro
      - ./logs/ch1:/var/log/clickhouse-server
    ports:
      - "8123:8123"
      - "9000:9000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 2s
      timeout: 3s
      retries: 45
      start_period: 5s

  ch2:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    depends_on:
      keeper1:
        condition: service_started
      rustfs1:
        condition: service_started
      createbucket:
        condition: service_completed_successfully
      ch1:
        condition: service_healthy
    mem_limit: 28g
    volumes:
      - ../../build/programs/clickhouse:/usr/bin/clickhouse:ro
      - ./configs/storage_conf_gc_shards2_ch2.xml:/etc/clickhouse-server/config.d/storage_conf.xml:ro
      - ./configs/fsck_only_ca.xml:/etc/clickhouse-server/fsck-only.xml:ro
      - ./configs/keeper_client.xml:/etc/clickhouse-server/config.d/keeper_client.xml:ro
      - ./configs/macros_node2.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ./configs/memory.xml:/etc/clickhouse-server/config.d/memory.xml:ro
      - ./configs/ca_gc_log.xml:/etc/clickhouse-server/config.d/ca_gc_log.xml:ro
      - ./configs/ca_event_log.xml:/etc/clickhouse-server/config.d/ca_event_log.xml:ro
      - ./logs/ch2:/var/log/clickhouse-server
    ports:
      - "8124:8123"
      - "9002:9000"
